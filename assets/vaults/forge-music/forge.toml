# Cross-vault imports (drain 2026-08-03-1500). Spec only — nothing reads
# this yet; see forge/docs/specs/vault-imports.md.
#
# Must stay LAST in this file: in TOML every key after a [table] header
# belongs to that table, so a [imports] section placed above `name` /
# `version` / `domains` would silently swallow them.
#
# [imports]
# music-core = { git = "https://github.com/frmoded/music-core.git", sha = "abc12345", tag = "v0.3.0" }

[imports]
