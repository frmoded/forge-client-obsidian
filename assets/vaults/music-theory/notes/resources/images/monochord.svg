<text x="40" y="196" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="600">Monochord: one string, a movable bridge</text>
<text x="40" y="215" font-size="12" fill="#555555" text-anchor="start">Ratios read straight off the length: 1/2 gives the octave, 2/3 the fifth</text>
