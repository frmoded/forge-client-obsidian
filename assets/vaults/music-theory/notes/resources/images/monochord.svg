<text x="310" y="42" font-size="12" fill="#2B2B2B" text-anchor="middle">1/2 — octave (2:1)</text>
<text x="397" y="146" font-size="12" fill="#B39373" text-anchor="middle">2/3 — fifth (3:2)</text>
