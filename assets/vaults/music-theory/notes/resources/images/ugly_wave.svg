<svg viewBox="0 0 480 200" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="480" height="200" fill="#ffffff"/>
  <text x="10" y="20" font-size="13" fill="#333">C4 and D♭4 overlaid — a close, uneven ratio. The waves drift in and out of alignment (beating).</text>
  <path d="M 10,110 Q 40,80 70,110 T 130,110 T 190,110 T 250,110 T 310,110 T 370,110 T 430,110 T 470,110" fill="none" stroke="#2a6fdb" stroke-width="2.5"/>
  <path d="M 10,110 Q 38,84 66,110 T 122,110 T 178,110 T 234,110 T 290,110 T 346,110 T 402,110 T 458,110" fill="none" stroke="#d6482f" stroke-width="2" opacity="0.85"/>
  <text x="180" y="180" font-size="12" fill="#666" text-anchor="middle">the small drift between peaks is what you hear as roughness</text>
</svg>
