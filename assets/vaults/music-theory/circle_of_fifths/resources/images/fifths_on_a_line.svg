<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="600" height="449.0556" viewBox="0 0 600 449.0556" data-caption-column="360" role="img" aria-label="Two octaves of keys in a line. An arrow runs from C to G, seven half steps, a fifth. A second arrow runs from B to F sharp in the next octave, also seven half steps.">
<!-- own background: a solid panel so no ink depends on the page colour (dark mode); the wheel's panel, palette and font -->
<rect x="0" y="0" width="600" height="449.0556" rx="10" ry="10" fill="#fdfcfa"/>
<defs>
<marker id="head1" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="15" refY="7" orient="auto"><path d="M0 0 L15 7 L0 14 Z" fill="#2B2B2B"/></marker>
<marker id="head2" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="15" refY="7" orient="auto"><path d="M0 0 L15 7 L0 14 Z" fill="#D72027"/></marker>
</defs>
<g font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">
<!-- the arrows: one flat cubic curve each (rise 48 units, level apexes), left to right above the keys, never folding back; the second is dashed as well as red -->
<path class="arrow" d="M 40 118 C 80 54 160 54 200 118" fill="none" stroke="#2B2B2B" stroke-width="3.5" stroke-linecap="round" marker-end="url(#head1)"/>
<circle cx="40" cy="118" r="4.5" fill="#2B2B2B"/>
<text class="arrowlabel" x="120" y="30" font-size="18" font-weight="600" fill="#2B2B2B">a fifth: 7 half steps</text>
<text class="arrowwhere" x="120" y="51" font-size="15" fill="#555555">C to G</text>
<path class="arrow" d="M 280 118 C 325 54 415 54 460 118" fill="none" stroke="#D72027" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="10 6" marker-end="url(#head2)"/>
<circle cx="280" cy="118" r="4.5" fill="#D72027"/>
<text class="arrowlabel" x="370" y="30" font-size="18" font-weight="600" fill="#2B2B2B">a fifth: 7 half steps</text>
<text class="arrowwhere" x="370" y="51" font-size="15" fill="#555555">B to F♯</text>
