<rect class="key white" data-i="23" data-note="B" x="540" y="190" width="40" height="150" rx="3" ry="3" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1"/>
<rect class="key black" data-i="1" data-note="C♯" x="46" y="190" width="28" height="92" rx="3" ry="3" fill="#2B2B2B" stroke="#2B2B2B" stroke-width="1"/>
<rect class="key black" data-i="3" data-note="D♯" x="86" y="190" width="28" height="92" rx="3" ry="3" fill="#2B2B2B" stroke="#2B2B2B" stroke-width="1"/>
<rect class="key black" data-i="6" data-note="F♯" x="166" y="190" width="28" height="92" rx="3" ry="3" fill="#2B2B2B" stroke="#2B2B2B" stroke-width="1"/>
<rect class="key black" data-i="8" data-note="G♯" x="206" y="190" width="28" height="92" rx="3" ry="3" fill="#2B2B2B" stroke="#2B2B2B" stroke-width="1"/>
<rect class="key black" data-i="10" data-note="A♯" x="246" y="190" width="28" height="92" rx="3" ry="3" fill="#2B2B2B" stroke="#2B2B2B" stroke-width="1"/>
<rect class="key black" data-i="13" data-note="C♯" x="326" y="190" width="28" height="92" rx="3" ry="3" fill="#2B2B2B" stroke="#2B2B2B" stroke-width="1"/>
<rect class="key black" data-i="15" data-note="D♯" x="366" y="190" width="28" height="92" rx="3" ry="3" fill="#2B2B2B" stroke="#2B2B2B" stroke-width="1"/>
<rect class="key black end" data-i="18" data-note="F♯" x="446" y="190" width="28" height="92" rx="3" ry="3" fill="#B07F00" stroke="#2B2B2B" stroke-width="1"/>
<rect class="key black" data-i="20" data-note="G♯" x="486" y="190" width="28" height="92" rx="3" ry="3" fill="#2B2B2B" stroke="#2B2B2B" stroke-width="1"/>
<rect class="key black" data-i="22" data-note="A♯" x="526" y="190" width="28" height="92" rx="3" ry="3" fill="#2B2B2B" stroke="#2B2B2B" stroke-width="1"/>
<!-- the labels: sharps only, one spelling -->
<text class="keylabel" data-i="0" x="40" y="326" font-size="18" font-weight="600" fill="#2B2B2B">C</text>
<text class="keylabel" data-i="1" x="60" y="270" font-size="14" font-weight="600" fill="#fdfcfa">C♯</text>
<text class="keylabel" data-i="2" x="80" y="326" font-size="18" font-weight="600" fill="#2B2B2B">D</text>
<text class="keylabel" data-i="3" x="100" y="270" font-size="14" font-weight="600" fill="#fdfcfa">D♯</text>
<text class="keylabel" data-i="4" x="120" y="326" font-size="18" font-weight="600" fill="#2B2B2B">E</text>
