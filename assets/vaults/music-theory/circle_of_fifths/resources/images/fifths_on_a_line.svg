<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="600" height="457" viewBox="0 0 600 457" role="img" aria-label="Two octaves of keys in a line. An arrow runs from C to G, seven half steps, a fifth. A second arrow runs from B to F sharp in the next octave, also seven half steps.">
<!-- own background: a solid panel so no ink depends on the page colour (dark mode); the wheel's panel, palette and font -->
<rect x="0" y="0" width="600" height="457" rx="10" ry="10" fill="#fdfcfa"/>
<defs>
<marker id="head1" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="15" refY="7" orient="auto"><path d="M0 0 L15 7 L0 14 Z" fill="#2B2B2B"/></marker>
<marker id="head2" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="15" refY="7" orient="auto"><path d="M0 0 L15 7 L0 14 Z" fill="#D72027"/></marker>
</defs>
<g font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">
<!-- the arrows: both run left to right above the keys and never fold back; the second is dashed as well as red -->
<path class="arrow" d="M 40 182 C 40 62 200 62 200 182" fill="none" stroke="#2B2B2B" stroke-width="3.5" stroke-linecap="round" marker-end="url(#head1)"/>
<circle cx="40" cy="182" r="4.5" fill="#2B2B2B"/>
<text class="arrowlabel" x="120" y="50" font-size="18" font-weight="600" fill="#2B2B2B">a fifth: 7 half steps</text>
<text class="arrowwhere" x="120" y="72" font-size="15" fill="#555555">C to G</text>
<path class="arrow" d="M 280 182 C 280 62 460 62 460 182" fill="none" stroke="#D72027" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="10 6" marker-end="url(#head2)"/>
<circle cx="280" cy="182" r="4.5" fill="#D72027"/>
<text class="arrowlabel" x="370" y="50" font-size="18" font-weight="600" fill="#2B2B2B">a fifth: 7 half steps</text>
<text class="arrowwhere" x="370" y="72" font-size="15" fill="#555555">B to F♯</text>
<!-- the keys, C to B twice (white keys first, the black keys on top); the four keys an arrow starts or ends on are lit -->
<rect class="key white end" data-i="0" data-note="C" x="20" y="190" width="40" height="150" rx="3" ry="3" fill="#F8C54B" stroke="#2B2B2B" stroke-width="1"/>
<rect class="key white" data-i="2" data-note="D" x="60" y="190" width="40" height="150" rx="3" ry="3" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1"/>
<rect class="key white" data-i="4" data-note="E" x="100" y="190" width="40" height="150" rx="3" ry="3" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1"/>
<rect class="key white" data-i="5" data-note="F" x="140" y="190" width="40" height="150" rx="3" ry="3" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1"/>
<rect class="key white end" data-i="7" data-note="G" x="180" y="190" width="40" height="150" rx="3" ry="3" fill="#F8C54B" stroke="#2B2B2B" stroke-width="1"/>
<rect class="key white" data-i="9" data-note="A" x="220" y="190" width="40" height="150" rx="3" ry="3" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1"/>
<rect class="key white end" data-i="11" data-note="B" x="260" y="190" width="40" height="150" rx="3" ry="3" fill="#F8C54B" stroke="#2B2B2B" stroke-width="1"/>
<rect class="key white" data-i="12" data-note="C" x="300" y="190" width="40" height="150" rx="3" ry="3" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1"/>
<rect class="key white" data-i="14" data-note="D" x="340" y="190" width="40" height="150" rx="3" ry="3" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1"/>
<rect class="key white" data-i="16" data-note="E" x="380" y="190" width="40" height="150" rx="3" ry="3" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1"/>
<rect class="key white" data-i="17" data-note="F" x="420" y="190" width="40" height="150" rx="3" ry="3" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1"/>
<rect class="key white" data-i="19" data-note="G" x="460" y="190" width="40" height="150" rx="3" ry="3" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1"/>
