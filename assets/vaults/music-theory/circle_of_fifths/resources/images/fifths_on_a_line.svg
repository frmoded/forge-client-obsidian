<text class="keylabel" data-i="9" x="240" y="326" font-size="18" font-weight="600" fill="#2B2B2B">A</text>
<text class="keylabel" data-i="10" x="260" y="270" font-size="14" font-weight="600" fill="#fdfcfa">A♯</text>
<text class="keylabel" data-i="11" x="280" y="326" font-size="18" font-weight="600" fill="#2B2B2B">B</text>
<text class="keylabel" data-i="12" x="320" y="326" font-size="18" font-weight="600" fill="#2B2B2B">C</text>
<text class="keylabel" data-i="13" x="340" y="270" font-size="14" font-weight="600" fill="#fdfcfa">C♯</text>
<text class="keylabel" data-i="14" x="360" y="326" font-size="18" font-weight="600" fill="#2B2B2B">D</text>
<text class="keylabel" data-i="15" x="380" y="270" font-size="14" font-weight="600" fill="#fdfcfa">D♯</text>
<text class="keylabel" data-i="16" x="400" y="326" font-size="18" font-weight="600" fill="#2B2B2B">E</text>
<text class="keylabel" data-i="17" x="440" y="326" font-size="18" font-weight="600" fill="#2B2B2B">F</text>
<text class="keylabel" data-i="18" x="460" y="270" font-size="14" font-weight="600" fill="#fdfcfa">F♯</text>
<text class="keylabel" data-i="19" x="480" y="326" font-size="18" font-weight="600" fill="#2B2B2B">G</text>
<text class="keylabel" data-i="20" x="500" y="270" font-size="14" font-weight="600" fill="#fdfcfa">G♯</text>
<text class="keylabel" data-i="21" x="520" y="326" font-size="18" font-weight="600" fill="#2B2B2B">A</text>
<text class="keylabel" data-i="22" x="540" y="270" font-size="14" font-weight="600" fill="#fdfcfa">A♯</text>
<text class="keylabel" data-i="23" x="560" y="326" font-size="18" font-weight="600" fill="#2B2B2B">B</text>
<!-- the two octaves -->
<polyline points="24,346 24,354 296,354 296,346" fill="none" stroke="#555555" stroke-width="1.5" stroke-linejoin="round"/>
<polyline points="304,346 304,354 576,354 576,346" fill="none" stroke="#555555" stroke-width="1.5" stroke-linejoin="round"/>
<text class="octave" x="160" y="378" font-size="16" font-weight="500" fill="#555555">1st octave</text>
<text class="octave" x="440" y="378" font-size="16" font-weight="500" fill="#555555">2nd octave</text>
</g>
<!-- caption BEGIN -->
<!-- caption-box 0 0 600 400|600|400 -->
<g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<text x="12" y="426" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="600">Fifths on a line</text>
<text x="12" y="445" font-size="12" fill="#555555" text-anchor="start">Seven half steps from C to G, and from B to F♯ in the next octave</text>
</g>
<!-- caption END -->
</svg>
