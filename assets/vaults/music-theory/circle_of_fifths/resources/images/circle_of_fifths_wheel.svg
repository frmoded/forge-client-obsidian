<g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<text x="0" y="626" font-size="15" fill="#2B2B2B" text-anchor="start" font-weight="600">The circle of fifths</text>
<text x="0" y="645" font-size="12" fill="#555555" text-anchor="start">Twelve keys, a fifth apart, closing into a ring</text>
</g>
<!-- caption END -->
</svg>
