<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exercise: key to signature</title>
<style>

  .key { cursor: default; }
  .key.white rect { fill: #FFFFFF; stroke: var(--axis); stroke-width: 1; }
  .key.black rect { fill: var(--ink); stroke: var(--ink); stroke-width: 1; }
  .key.lit.white rect { fill: var(--highlight); stroke: var(--ink); stroke-width: 1.5; }
  .key.lit.black rect { fill: #B07F00; stroke: var(--ink); }

  .seg.tonic path { stroke: var(--accent); stroke-width: 3; }

  .seg.wrong path { fill: #F6C9CB; stroke: var(--wrong); stroke-width: 2; stroke-dasharray: 3 2; }
  .seg.reveal path { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 4 2; }
  .seg:focus path { stroke: var(--accent); stroke-width: 3; }

  .seg text.name { font-size: 16px; }
  .seg text.name.both { font-size: 11px; }
  .seg text.name.small { font-size: 12px; font-weight: 500; }
  .seg text.count { font-size: 10px; font-weight: 500; fill: var(--muted); }

  #detail, #prompt { min-height: 34px; margin: 2px 0 0; font-size: 12px; line-height: 16px; color: var(--ink); }
  #prompt { min-height: 36px; font-size: 13px; line-height: 18px; margin: 3px 0 0; }
  #counts { gap: 4px; }

  .head.wrong { fill: #F6C9CB; stroke: var(--wrong); }

  .mark { fill: var(--ink); font-size: 13px; font-weight: 700; text-anchor: middle; pointer-events: none; }

</head>

    b.addEventListener("click", function () { if (l === level) return; level = l; fresh(); });         // a new level starts a fresh exercise; each level keeps its own score
    $("levels").appendChild(b);
  });
  fresh(false);
})();
</script>
</body>
</html>
