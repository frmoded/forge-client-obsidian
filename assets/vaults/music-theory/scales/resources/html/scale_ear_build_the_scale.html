<html lang="en">

<title>Build the scale</title>
<style>

  .key.black.right rect { fill: var(--right); stroke: #1B5E3A; }

  .key.wrong rect { fill: #F6C9CB; stroke: var(--wrong); stroke-width: 3; stroke-dasharray: 3 2; }
  .key.black.wrong rect { fill: #8B1C20; stroke: var(--wrong); }

  .key:focus rect { stroke: var(--accent); stroke-width: 3; }

</div>
<script>

  // 2026-11-15-2102 - HEAR THE SCALE (practice, the Scales chapter), the interval ear gadget's pattern for scales. Two games, each scored (memory only: the sandboxed page has no storage), a number of ATTEMPTS a question (by level):

    { id: "natural_minor", name: "natural minor",    group: "Major and minor", steps: [2, 1, 2, 2, 1, 2, 2], parent: 9, from: null },
    { id: "harmonic_minor", name: "harmonic minor",  group: "Major and minor", steps: [2, 1, 2, 2, 1, 3, 1], parent: 9, from: null },
    { id: "melodic_minor", name: "melodic minor",    group: "Major and minor", steps: [2, 1, 2, 2, 2, 2, 1], down: [2, 1, 2, 2, 1, 2, 2], parent: 9, from: null },
    { id: "ionian",        name: "Ionian",           group: "Modes", steps: [2, 2, 1, 2, 2, 2, 1], parent: 0, from: null },
    { id: "dorian",        name: "Dorian",           group: "Modes", steps: [2, 1, 2, 2, 2, 1, 2], parent: 2, from: null },
    { id: "phrygian",      name: "Phrygian",         group: "Modes", steps: [1, 2, 2, 2, 1, 2, 2], parent: 4, from: null },
    { id: "lydian",        name: "Lydian",           group: "Modes", steps: [2, 2, 2, 1, 2, 2, 1], parent: 5, from: null },
    { id: "mixolydian",    name: "Mixolydian",       group: "Modes", steps: [2, 2, 1, 2, 2, 1, 2], parent: 7, from: null },
    { id: "aeolian",       name: "Aeolian",          group: "Modes", steps: [2, 1, 2, 2, 1, 2, 2], parent: 9, from: null },

  var BUILD = ["major", "natural_minor", "harmonic_minor", "dorian", "mixolydian", "major_pentatonic", "minor_pentatonic"];      // game 2: the scales to build
  // The LEVELS (the same as the interval ear gadgets): easy 5, medium 3, hard 1 ATTEMPTS a question. In "name the scale" every guess uses one; in "build the scale" the attempts are the WRONG TAPS (a right key is free): the question ends when they are used up, and scores 1 when the scale is built before.

  var NS = "http://www.w3.org/2000/svg";

  for (m = LOW; m <= HIGH; m++) { if (isBlack(m)) blacks.push({ m: m, x: PAD + wi * WW - BW / 2 }); else { whites.push({ m: m, x: PAD + wi * WW }); wi++; } }

  whites.forEach(function (k) { makeKey(k, false); }); blacks.forEach(function (k) { makeKey(k, true); });
  var GAME = 2;                                        // 2026-11-16-0900: THIS file is one game; there is no game switch
  var GAMES = [{ id: 2, title: "Build the scale", tip: "The tonic is given: tap the other notes of the named scale" }];
  var games = {}, current = GAME, level = DEFAULT_LEVEL, scores = emptyScores();
  GAMES.forEach(function (g) { games[g.id] = { state: initial(), previous: null }; });
  function mark(mm, ch) { var g = keys[mm], r = g.firstChild, black = isBlack(mm); var t = el("text", { "class": "mark", x: +r.getAttribute("x") + +r.getAttribute("width") / 2, y: PAD + (black ? 26 : 48), "text-anchor": "middle" }, g); t.textContent = ch; }

    var a = $("answers"), gm = games[current], st = gm.state; a.textContent = "";
    if (current !== 1) return;

      var b = document.createElement("button"); b.type = "button"; b.setAttribute("data-scale", id); b.textContent = HEAR_LABEL[id];
      b.disabled = st.phase !== "asked";

      (st.phase === "idle" ? "Press Next: you will be asked to build a scale." : "Build " + scaleTitle(q.tonic, q.scale) + (st.phase === "asked" ? ": tap its other notes in the octave above the yellow key (" + (targetsOf(q).length - st.found.length) + " to find)." : st.outcome === "solved" ? ". All found." : ". Out of attempts: the dashed keys were its notes."));
