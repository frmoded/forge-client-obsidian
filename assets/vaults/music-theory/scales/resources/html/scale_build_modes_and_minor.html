<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exercise: build modes and minor scales</title>
<style>
  /* The look of the Scales hub player (scale_player.html): the same palette, controls row, piano strip, staff, letters and chips. No margin, no padding, no fixed height: the page is exactly its content, and every state has the SAME content height (the rows that fill in later reserve their space). */
  :root { --paper: #FDFCFA; --ink: #2B2B2B; --muted: #555555; --axis: #666666; --highlight: #F8C54B; --accent: #D72027; --chip: #F2F2EC; --wrong: #D72027; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--muted); font-size: 13px; -webkit-text-size-adjust: 100%; }
  .wrap { max-width: 460px; }
  svg { display: block; width: 100%; height: auto; user-select: none; -webkit-user-select: none; }
  .row { display: flex; align-items: center; gap: 8px; margin: 3px 0 0; flex-wrap: wrap; min-height: 30px; }
  #choose { margin-top: 0; flex-wrap: nowrap; }      /* one line at every width: the scale select shrinks (an ellipsis) instead of wrapping the row, so the page keeps one height whatever the spelling of the tonics */
  #choose select { min-width: 0; }
  #tonic { flex: 0 0 auto; }
  #scale { flex: 1 1 0; max-width: 230px; text-overflow: ellipsis; }
  #choose label, #choose button { flex: 0 0 auto; }                         /* the first row's top margin would collapse through the body and push the page's content 3 px past its own height */
  label { color: var(--ink); }
  select, button { font: inherit; color: var(--ink); background: #fff; border: 1px solid var(--axis); border-radius: 6px; padding: 4px 8px; min-height: 30px; }
  button { cursor: pointer; padding: 4px 12px; }
  button:hover:not(:disabled), select:hover { border-color: var(--ink); }
  button:disabled { opacity: 0.45; cursor: default; }
  button:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
  button[aria-pressed="true"] { background: var(--highlight); border-color: var(--ink); }
  .switch { gap: 4px; }
  .switch button { padding: 3px 8px; min-height: 26px; font-size: 11px; white-space: nowrap; }
  .chips { gap: 4px; min-height: 24px; }
  .chip { min-width: 26px; text-align: center; background: var(--chip); border: 1px solid #DDDDD2; border-radius: 4px; color: var(--ink); font-size: 12px; line-height: 20px; padding: 0 5px; }
  .chip.h { background: #E7EEF8; border-color: #C6D3E6; } .chip.w { background: #F2F2EC; } .chip.t { background: #F8E2D9; border-color: #E7C2B3; }
  .key { cursor: pointer; }
  .key:focus { outline: none; }
  .key.idle { cursor: default; }
  .key.white rect { fill: #FFFFFF; stroke: var(--axis); stroke-width: 1; }
  .key.black rect { fill: var(--ink); stroke: var(--ink); stroke-width: 1; }
  .key.lit.white rect { fill: var(--highlight); stroke: var(--ink); stroke-width: 1.5; }
  .key.lit.black rect { fill: #B07F00; stroke: var(--ink); }
  .key.tonic rect { stroke: var(--accent); stroke-width: 3; }
  .key.wrong rect { fill: #F6C9CB; stroke: var(--wrong); stroke-width: 2; stroke-dasharray: 3 2; }
  .key.black.wrong rect { fill: #8B1C20; stroke: var(--wrong); }
  .key.reveal rect { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 4 2; }
  .key.sounding rect { fill: #9DD9B5; }
  .key:focus rect { stroke: var(--accent); stroke-width: 3; }
  .key text { pointer-events: none; fill: var(--ink); font-size: 9px; }
  .key text.mark { font-size: 15px; font-weight: 700; }
  .key.black text.mark { fill: #fff; }
  .staffline, .ledger { stroke: #A69B91; stroke-width: 1; }
  .head { fill: #fff; stroke: var(--ink); stroke-width: 1.4; }
  .head.sounding { fill: #9DD9B5; }
  .head.tonic { stroke: var(--accent); stroke-width: 2; }
  .head.ghost { fill: none; stroke: var(--muted); stroke-width: 1.4; stroke-dasharray: 3 2; }
  .acc { fill: var(--ink); font-size: 14px; }
  .acc.ghost { fill: var(--muted); }
  .letters { display: flex; gap: 4px; flex-wrap: nowrap; min-height: 28px; margin: 3px 0 0; }
  .letter { flex: 0 0 auto; min-width: 34px; text-align: center; border: 1px solid #DDDDD2; border-radius: 5px; background: #fff; color: var(--ink); line-height: 24px; padding: 0 5px; font-weight: 600; }
  .letter.sounding { background: #9DD9B5; }
  .letter.tonic { border-color: var(--accent); }
  #prompt { min-height: 36px; margin: 3px 0 0; color: var(--ink); font-size: 13px; }
  #hint { color: var(--ink); font-size: 12px; }
  .score { display: flex; align-items: center; gap: 10px; margin: 3px 0 0; min-height: 22px; font-size: 12px; }
  #counter { color: var(--ink); }
  .linkbtn { background: none; border: 0; padding: 0; min-height: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 12px; }
  .linkbtn:hover { color: var(--ink); }
  #board { margin: 1px 0 0; min-height: 18px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  #board b { color: var(--ink); }
  .sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
</style>
</head>
<body>
<div class="wrap">
<div class="row" id="choose"><label for="tonic">Tonic</label><select id="tonic" aria-label="Tonic"></select><label for="scale" id="scale-label">Scale</label><select id="scale" aria-label="Scale"></select><button type="button" id="random">Random</button></div>
<div class="row switch" id="levels" role="group" aria-label="Choose a level"></div>
<div id="prompt" aria-live="off"></div>
<svg id="strip" role="group" aria-label="Piano keys, C4 to C6"></svg>
<svg id="staff" role="img" aria-label="Treble staff"></svg>
<div class="row chips" id="chips" role="list" aria-label="The steps of the scale in half steps"></div>
<div class="letters" id="letters" role="list" aria-label="The notes of the scale"></div>
<div class="row"><button type="button" id="play" disabled>Play</button><button type="button" id="again">New exercise</button><span id="hint"></span></div>
<div class="score"><span id="counter"></span><button id="reset" class="linkbtn" type="button">Reset</button></div>
<div id="board" aria-label="Score of each level"></div>
<span id="sr" class="sr" role="status" aria-live="polite"></span>
</div>
<script>
(function () {
  "use strict";
  // ==== config BEGIN (2026-11-17-2003): the scales this exercise offers: the ONLY lines that differ between the scale exercise files (and the <title>); a test pins everything else identical ====
  var SCALES = ["ionian", "dorian", "phrygian", "lydian", "mixolydian", "aeolian", "locrian", "natural_minor", "harmonic_minor", "melodic_minor"];
  // ==== config END ====================================================================================================================
  // 2026-11-17-2003 - the SCALE EXERCISE: build a scale on the piano, with the staff filling in beside it. Choose a tonic (and, when the page offers more than one scale, a scale) or press Random; the tonic is marked; tap the other notes of the scale on the keys, in any order, up to the octave. Each right key lights and puts its note on the treble staff with the scale's proper spelling (one letter per degree for the seven-note scales); a wrong key is marked and puts nothing on the staff. Easy / Medium / Hard allow 5 / 3 / 1 wrong taps. When the exercise ends (built, or out of wrong taps) the whole scale is on the staff (the notes you missed dashed), the letters and the whole and half steps appear (they are the answer, so only now) and Play plays the scale up.
  // It looks like the Scales hub player (scale_player.html) and shares its blocks, byte for byte (pinned by a test): the scale core, the piano voice and the scale view (strip and staff). Memory only: the sandboxed page has no storage.
  // ---- pure functions (no DOM; the node harness exports them) ------------------------------------------------------------------------------------------
  var BASE = 60, LOW = 60, HIGH = 84, A4_HZ = 440, STEP_SECONDS = 0.45, NOTE_LEN = 0.7;                 // the strip is C4..C6; a scale sits on the tonic's pitch class in the octave from C4 (so the staff and the strip agree)
  function midiToHz(m) { return A4_HZ * Math.pow(2, (m - 69) / 12); }
  function isBlack(m) { return [1, 3, 6, 8, 10].indexOf(((m % 12) + 12) % 12) >= 0; }
  // ==== scale core BEGIN (2026-11-15-2102) ========================================================================================================
  // The SAME block is in scale_player.html and scale_ear.html (each gadget is one self-contained file, so it is copied; a test pins them identical). Pure: no DOM, no Web Audio.
  // A scale is a tonic (a pitch class 0..11, C = 0) and a step pattern in half steps (W = 2, H = 1, 3H = 3). SPELLING: a scale of seven notes takes ONE LETTER PER DEGREE, the letters in order from the tonic's (G-sharp harmonic minor is G# A# B C# D# E F-double-sharp, not G# A# B C# D# E G),
  // with a double sharp or double flat where the key needs it. The tonic's own spelling is the conventional one for its KEY: a scale belongs to a parent major key (D Dorian to C major, G# minor to B major), the tonic is the right degree of that key, and the parent is the major key with the fewest
  // accidentals (C, D-flat, D, E-flat, E, F, F-sharp, G, A-flat, A, B-flat, B). Pentatonic and blues scales keep the spelling of the seven-note scale they are cut from (major pentatonic from the major scale, minor pentatonic and blues from the natural minor; the blues' extra note is the flat fifth).
  // The whole-tone and the two diminished scales have no parent: their notes go by sharps when the scale goes UP and by flats when it comes DOWN (the tonic as in its major key). The melodic minor goes up with a raised 6th and 7th and comes down as the natural minor.
  var SC_SCALES = [
    { id: "major",         name: "major",            group: "Major and minor", steps: [2, 2, 1, 2, 2, 2, 1], parent: 0, from: null },
    { id: "natural_minor", name: "natural minor",    group: "Major and minor", steps: [2, 1, 2, 2, 1, 2, 2], parent: 9, from: null },
    { id: "harmonic_minor", name: "harmonic minor",  group: "Major and minor", steps: [2, 1, 2, 2, 1, 3, 1], parent: 9, from: null },
    { id: "melodic_minor", name: "melodic minor",    group: "Major and minor", steps: [2, 1, 2, 2, 2, 2, 1], down: [2, 1, 2, 2, 1, 2, 2], parent: 9, from: null },
    { id: "ionian",        name: "Ionian",           group: "Modes", steps: [2, 2, 1, 2, 2, 2, 1], parent: 0, from: null },
    { id: "dorian",        name: "Dorian",           group: "Modes", steps: [2, 1, 2, 2, 2, 1, 2], parent: 2, from: null },
    { id: "phrygian",      name: "Phrygian",         group: "Modes", steps: [1, 2, 2, 2, 1, 2, 2], parent: 4, from: null },
    { id: "lydian",        name: "Lydian",           group: "Modes", steps: [2, 2, 2, 1, 2, 2, 1], parent: 5, from: null },
    { id: "mixolydian",    name: "Mixolydian",       group: "Modes", steps: [2, 2, 1, 2, 2, 1, 2], parent: 7, from: null },
    { id: "aeolian",       name: "Aeolian",          group: "Modes", steps: [2, 1, 2, 2, 1, 2, 2], parent: 9, from: null },
    { id: "locrian",       name: "Locrian",          group: "Modes", steps: [1, 2, 2, 1, 2, 2, 2], parent: 11, from: null },
    { id: "major_pentatonic", name: "major pentatonic", group: "Pentatonic and blues", steps: [2, 2, 3, 2, 3], parent: 0, from: { scale: "major", degrees: [0, 1, 2, 4, 5] } },
    { id: "minor_pentatonic", name: "minor pentatonic", group: "Pentatonic and blues", steps: [3, 2, 2, 3, 2], parent: 9, from: { scale: "natural_minor", degrees: [0, 2, 3, 4, 6] } },
    { id: "blues",         name: "blues",            group: "Pentatonic and blues", steps: [3, 2, 1, 1, 3, 2], parent: 9, from: { scale: "natural_minor", degrees: [0, 2, 3, 4, 4, 6], flatten: 3 } },
    { id: "whole_tone",    name: "whole-tone",       group: "Symmetric", steps: [2, 2, 2, 2, 2, 2], parent: 0, from: null, symmetric: true },
    { id: "diminished_wh", name: "diminished (whole-half)", group: "Symmetric", steps: [2, 1, 2, 1, 2, 1, 2, 1], parent: 0, from: null, symmetric: true },
    { id: "diminished_hw", name: "diminished (half-whole)", group: "Symmetric", steps: [1, 2, 1, 2, 1, 2, 1, 2], parent: 0, from: null, symmetric: true }
  ];
  var SC_LETTERS = ["C", "D", "E", "F", "G", "A", "B"], SC_LETTER_PC = [0, 2, 4, 5, 7, 9, 11];
  var SC_MAJOR_KEYS = [{ l: 0, a: 0 }, { l: 1, a: -1 }, { l: 1, a: 0 }, { l: 2, a: -1 }, { l: 2, a: 0 }, { l: 3, a: 0 }, { l: 3, a: 1 }, { l: 4, a: 0 }, { l: 5, a: -1 }, { l: 5, a: 0 }, { l: 6, a: -1 }, { l: 6, a: 0 }];    // C D-flat D E-flat E F F-sharp G A-flat A B-flat B, by pitch class
  function scMod(n, m) { return ((n % m) + m) % m; }
  function scScale(id) { for (var i = 0; i < SC_SCALES.length; i++) if (SC_SCALES[i].id === id) return SC_SCALES[i]; return SC_SCALES[0]; }
  function scSteps(id, form) { var s = scScale(id); return form === "down" && s.down ? s.down : s.steps; }
  // The pitch classes of a scale from a tonic, in order, WITHOUT the octave note (the tonic again): [0, 2, 4, 5, 7, 9, 11] for C major.
  function scaleNotes(tonic, id, form) {
    var steps = scSteps(id, form), out = [], pc = scMod(tonic, 12), i;
    for (i = 0; i < steps.length; i++) { out.push(pc); pc = scMod(pc + steps[i], 12); }
    return out;
  }
  // The accidental that turns a letter into a pitch class, wrapped into -6..6 (a double sharp is +2).
  function scAcc(letterIndex, pc) { var d = scMod(pc - SC_LETTER_PC[scMod(letterIndex, 7)], 12); return d > 6 ? d - 12 : d; }
  // The seven-note spelling of a (tonic spelling, steps) pair: one letter per degree, in order from the tonic's letter.
  function scHeptatonic(tonicLetter, tonicPc, steps) {
    var out = [], pc = tonicPc, i;
    for (i = 0; i < 7; i++) { out.push({ l: scMod(tonicLetter + i, 7), a: scAcc(tonicLetter + i, pc) }); pc = scMod(pc + steps[i], 12); }
    return out;
  }
  // The conventional spelling of a tonic for a scale: the degree of its parent major key (the major key with the fewest accidentals) that the tonic is. Only the parent F-sharp / G-flat major ties (six each): then the key that gives the tonic the FEWEST accidentals wins
  // (F Locrian is F, not E-sharp), and when that ties too, the minor family (natural, harmonic and melodic minor, Aeolian, the pentatonic minor, the blues) takes G-flat (E-flat minor) and every other scale F-sharp (F-sharp major).
  function scTonicSpelling(tonic, id) {
    var s = scScale(id), t = scMod(tonic, 12);
    if (s.symmetric) return SC_MAJOR_KEYS[t];
    var degree = [0, 2, 4, 5, 7, 9, 11].indexOf(s.parent), parentPc = scMod(t - s.parent, 12);
    var cands = parentPc === 6 ? [{ l: 3, a: 1 }, { l: 4, a: -1 }] : [SC_MAJOR_KEYS[parentPc]], preferred = parentPc === 6 && s.parent === 9 ? 1 : 0, best = null, i, tn;
    for (i = 0; i < cands.length; i++) {
      tn = scHeptatonic(cands[i].l, parentPc, [2, 2, 1, 2, 2, 2, 1])[degree];
      if (best === null || Math.abs(tn.a) < Math.abs(best.t.a) || (Math.abs(tn.a) === Math.abs(best.t.a) && i === preferred)) best = { t: tn, i: i };
    }
    return best.t;
  }
  // The spelled notes of a scale: [{ l (letter index 0..6 = C..B), a (accidental -2..2), pc }], one per note (no octave note). `form` is "up" (default) or "down": the melodic minor's descending form is the natural minor, and the symmetric scales are written with sharps going up and flats going down.
  function spellScale(tonic, id, form) {
    var s = scScale(id), pcs = scaleNotes(tonic, id, form), tp = scTonicSpelling(tonic, id), out = [], i;
    if (s.symmetric) {
      var names = form === "down" ? [[0, 0], [1, -1], [1, 0], [2, -1], [2, 0], [3, 0], [4, -1], [4, 0], [5, -1], [5, 0], [6, -1], [6, 0]] : [[0, 0], [0, 1], [1, 0], [1, 1], [2, 0], [3, 0], [3, 1], [4, 0], [4, 1], [5, 0], [5, 1], [6, 0]];
      for (i = 0; i < pcs.length; i++) { var n = i === 0 ? tp : { l: names[pcs[i]][0], a: names[pcs[i]][1] }; out.push({ l: n.l, a: n.a, pc: pcs[i] }); }
      return out;
    }
    if (s.from) {
      var parent = scScale(s.from.scale), seven = scHeptatonic(tp.l, scMod(tonic, 12), scSteps(parent.id, form));
      var tp7 = scTonicSpelling(tonic, parent.id); seven = scHeptatonic(tp7.l, scMod(tonic, 12), scSteps(parent.id, form));
      for (i = 0; i < s.from.degrees.length; i++) {
        var d = seven[s.from.degrees[i]], a = d.a - (s.from.flatten === i ? 1 : 0);
        out.push({ l: d.l, a: a, pc: pcs[i] });
      }
      return out;
    }
    var hp = scHeptatonic(tp.l, scMod(tonic, 12), scSteps(id, form));
    for (i = 0; i < hp.length; i++) out.push({ l: hp[i].l, a: hp[i].a, pc: pcs[i] });
    return out;
  }
  function scAccText(a) { return a === 0 ? "" : a === 1 ? "♯" : a === -1 ? "♭" : a === 2 ? "♯♯" : a === -2 ? "♭♭" : ""; }
  function scAccWords(a) { return a === 0 ? "" : a === 1 ? " sharp" : a === -1 ? " flat" : a === 2 ? " double sharp" : a === -2 ? " double flat" : ""; }
  function noteName(n) { return SC_LETTERS[n.l] + scAccText(n.a); }                      // "G♯"
  function noteWords(n) { return SC_LETTERS[n.l] + scAccWords(n.a); }                     // "G sharp"
  function tonicName(tonic, id) { var t = scTonicSpelling(tonic, id); return noteName(t); }
  function scaleTitle(tonic, id) { return tonicName(tonic, id) + " " + scScale(id).name; }
  function scaleWords(tonic, id) { return noteWords(scTonicSpelling(tonic, id)) + " " + scScale(id).name; }
  // The step recipe as chips: 2 -> "W", 1 -> "H", 3 -> "3H" (half steps 2, 1, 3), including the last step back up to the tonic.
  function recipeOf(id, form) { var steps = scSteps(id, form); return steps.map(function (st) { return st === 2 ? "W" : st === 1 ? "H" : st === 3 ? "3H" : String(st); }); }
  // MIDI numbers of a scale from a tonic placed at `base` (the octave note included): the tonic's pitch class sits at base + pc.
  function scaleMidis(tonic, id, form, base) {
    var steps = scSteps(id, form), m = base + scMod(tonic, 12), out = [m], i;
    for (i = 0; i < steps.length; i++) { m += steps[i]; out.push(m); }
    return out;
  }
  // ==== scale core END =============================================================================================================================
  // ==== exercise core BEGIN (2026-11-17-2003) ======================================================================================================
  // The state of one exercise, pure. `notes` are the midis of the scale from the tonic up to its octave (the tonic placed from C4, the same as the player); the tonic is given and the octave note is not asked, so the notes to find are `notes` without its ends.
  var EX_LEVELS = ["easy", "medium", "hard"], EX_ATTEMPTS = { easy: 5, medium: 3, hard: 1 }, EX_DEFAULT_LEVEL = "medium";
  function exLevelName(l) { return l.charAt(0).toUpperCase() + l.slice(1); }
  function exAttempts(level) { return EX_ATTEMPTS.hasOwnProperty(level) ? EX_ATTEMPTS[level] : EX_ATTEMPTS[EX_DEFAULT_LEVEL]; }
  function exCopy(s, patch) { var o = {}, k; for (k in s) o[k] = s[k]; for (k in patch) o[k] = patch[k]; return o; }
  // A fresh exercise: phase "building" until it is built or the wrong taps run out ("done").
  function exStart(tonic, scaleId, level) { return { phase: "building", tonic: tonic, scale: scaleId, level: level, notes: scaleMidis(tonic, scaleId, "up", BASE), left: exAttempts(level), found: [], wrong: [], outcome: null }; }
  function exTargets(s) { return s.notes.slice(1, s.notes.length - 1); }
  // One tapped key. Ignored: the exercise is over, the tonic, the octave note, a key outside the octave above the tonic, a key already marked. A key of the scale is found (free); another key is a wrong tap; the last note found builds it; the last wrong tap ends it. `first`: this was the exercise's first tap.
  function exTap(s, midi) {
    if (s.phase !== "building" || midi <= s.notes[0] || midi >= s.notes[s.notes.length - 1] || s.found.indexOf(midi) >= 0 || s.wrong.indexOf(midi) >= 0) return { state: s, event: "ignored", first: false };
    var first = s.found.length === 0 && s.wrong.length === 0;
    if (exTargets(s).indexOf(midi) >= 0) {
      var found = s.found.concat([midi]), built = found.length === exTargets(s).length;
      return { state: exCopy(s, { phase: built ? "done" : "building", found: found, outcome: built ? "built" : null }), event: built ? "built" : "right", first: first };
    }
    var wrong = s.wrong.concat([midi]), left = s.left - 1;
    return { state: exCopy(s, { phase: left <= 0 ? "done" : "building", wrong: wrong, left: Math.max(0, left), outcome: left <= 0 ? "gaveup" : null }), event: left <= 0 ? "gaveup" : "wrong", first: first };
  }
  function exRemaining(s) { return exTargets(s).length - s.found.length; }
  // The octave note is the tonic again: its spelling is the tonic's, one octave up (the player's `withOctave`).
  function exWithOctave(spelled) { return spelled.concat([{ l: spelled[0].l, a: spelled[0].a, pc: spelled[0].pc }]); }
  // The notes of the staff, in order, with the octave note last: `hidden` = not found yet (not drawn: the staff never shows an answer early); `ghost` = missed, shown dashed once the exercise is over.
  function exStaffNotes(s) {
    var spelled = exWithOctave(spellScale(s.tonic, s.scale, "up")), done = s.phase === "done";
    return spelled.map(function (n, i) {
      var o = { l: n.l, a: n.a, pc: n.pc }, ends = i === 0 || i === spelled.length - 1, got = s.found.indexOf(s.notes[i]) >= 0;
      if (i === 0 || done || got) { if (done && !ends && !got) o.ghost = true; } else o.hidden = true;
      return o;
    });
  }
  // A random tonic and scale from the page's list, never the pair that is on screen (a list of one scale still changes the tonic).
  function exRandom(scales, rng, current) {
    var t, id, tries = 0;
    do { t = Math.min(11, Math.floor(rng() * 12)); id = scales[Math.min(scales.length - 1, Math.floor(rng() * scales.length))]; tries++; } while (current && current.tonic === t && current.scale === id && tries < 50);
    return { tonic: t, scale: id };
  }
  // The words. An exercise, never a test: "wrong taps" are what the level allows.
  function exTitle(s) { return scaleTitle(s.tonic, s.scale); }

  function fresh(announce) { stopTimers(); state = exStart(tonic, scaleId, level); render(announce === false ? undefined : exAnnounce(state, "start")); }
  for (var pc = 0; pc < 12; pc++) { var o = document.createElement("option"); o.value = String(pc); $("tonic").appendChild(o); }
  SCALES.forEach(function (id) { var op = document.createElement("option"); op.value = id; op.textContent = scScale(id).name; $("scale").appendChild(op); });
  if (SCALES.length < 2) { $("scale").style.display = "none"; $("scale-label").style.display = "none"; }
  $("tonic").addEventListener("change", function () { tonic = +$("tonic").value; fresh(); });
  $("scale").addEventListener("change", function () { scaleId = $("scale").value; fresh(); });
  $("random").addEventListener("click", function () { var r = exRandom(SCALES, rng, { tonic: tonic, scale: scaleId }); tonic = r.tonic; scaleId = r.scale; fresh(); });
  $("again").addEventListener("click", function () { fresh(); });
  $("play").addEventListener("click", function () { play(); });
  $("reset").addEventListener("click", function () { scores = exEmptyScores(); render("Score cleared."); });
  EX_LEVELS.forEach(function (l) {
    var b = document.createElement("button"); b.type = "button"; b.id = "level-" + l; b.textContent = exLevelName(l); b.title = exLevelName(l) + ": " + EX_ATTEMPTS[l] + (EX_ATTEMPTS[l] === 1 ? " wrong tap" : " wrong taps") + " allowed";
    b.addEventListener("click", function () { if (l === level) return; level = l; fresh(); });         // a new level starts a fresh exercise; each level keeps its own score
    $("levels").appendChild(b);
  });
  fresh(false);
})();
</script>
</body>
</html>
