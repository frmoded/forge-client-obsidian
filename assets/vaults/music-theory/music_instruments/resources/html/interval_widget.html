<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interval widget</title>
<style>
  /* Palette: forge_music_theory_style_guide.md, "Color scheme" (revised 2026-09-25).
     Same values as piano_keyboard.html and mandolin_fretboard.html. */
  :root {
    --paper: #FDFCFA;   /* Vault Background (Paper) */
    --ink: #2B2B2B;     /* Title Text */
    --muted: #555555;   /* Body Text / Plot Labels */
    --axis: #666666;    /* Axis Lines / Strong Ticks */
    --grid: #F2F2EC;    /* Faint Gridlines / Fine Ticks */
    --left: #2B2B2B;    /* Primary Signal / Input 1 */
    --right: #B39373;   /* Secondary Signal / Input 2 */
    --right-text: #7A644E; /* --right darkened for legible TEXT on the paper background */
    --derived: #64748B; /* Combined / Derived Series */
    --highlight: #F8C54B; /* Highlight: the root (anchor) key */
    --accent: #D72027;  /* Primary Accent: keyboard focus */
    --good: #2F7D4F;    /* a right answer */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--muted);
    padding: 8px 10px 14px;
    -webkit-text-size-adjust: 100%;
  }
  [hidden] { display: none !important; }
  .wrap { max-width: 760px; margin: 0 auto; }
  /* ---- the tab row: Explore / Chart / Trainer / Shift on the left, the tuning dropdown on the right ---- */
  .top { display: flex; flex-wrap: nowrap; gap: 6px; align-items: center; margin: 0 0 10px; }
  .top select { margin-left: auto; }
  button, select {
    font: inherit; font-size: 13px; color: var(--ink);
    background: #fff; border: 1px solid var(--axis); border-radius: 6px;
    padding: 6px 10px; cursor: pointer; min-height: 36px;
  }
  button:hover, select:hover { border-color: var(--ink); }
  button:active { background: var(--grid); }
  button:focus-visible, select:focus-visible, .key:focus, .minisvg:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .tab { flex: 0 0 auto; font-weight: 600; }
  .tab[aria-selected="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  select { flex: 1 1 auto; min-width: 0; max-width: 280px; text-overflow: ellipsis; padding: 6px 8px; }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; align-items: center; }
  button.left  { border-color: var(--left);  color: var(--left); }
  /* Role shows in COLOR only (same weight on every button); --right-text is the text-safe shade of the tan. */
  button.right { border-color: var(--right-text); color: var(--right-text); }
  button.both  { border-color: var(--derived); color: var(--derived); }
  button[aria-pressed="true"] { background: var(--grid); border-color: var(--ink); }
  /* ---- the piano strips ---- */
  .scroller { overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; }
  svg.strip { display: block; width: 100%; max-width: 660px; min-width: 520px; height: auto; margin: 0 auto; user-select: none; -webkit-user-select: none; }
  .key { cursor: pointer; }
  .key:focus { outline: none; }
  .key.white rect { fill: #FFFFFF; stroke: var(--axis); stroke-width: 1; }
  .key.black rect { fill: var(--ink); stroke: var(--ink); stroke-width: 1; }
  .key.white.span rect { fill: #F4E6BE; }                       /* the span between the two notes */
  .key.black.span rect { fill: #6B5B2E; }
  .key.root rect { fill: var(--highlight); stroke: var(--ink); stroke-width: 2.5; }
  .key.up rect   { fill: var(--right); stroke: var(--ink); stroke-width: 2.5; }
  .key.down rect { fill: var(--derived); stroke: var(--ink); stroke-width: 2.5; }
  .key:focus rect { stroke: var(--accent); stroke-width: 3; }
  .key text { pointer-events: none; }
  .key.white text { fill: var(--muted); font-size: 11px; }
  .key.black text { fill: var(--paper); font-size: 8.5px; }
  .key.up text, .key.down text { fill: #fff; }                 /* after the white/black rules: the label on a coloured target stays legible */
  .key.black.root text { fill: var(--ink); }
  .strip.masked .key text { opacity: 0; }                        /* the Trainer's Hide switch: labels masked until the answer */
  .strip.static .key { cursor: default; }
  /* ---- readout / plain text ---- */
  .readout { margin: 6px 0 2px; min-height: 3.2em; color: var(--ink); }
  .readout .big { font-size: 17px; font-weight: 600; }
  .readout .plain { display: block; margin-top: 2px; color: var(--muted); font-size: 14px; }
  .note { font-size: 12px; color: var(--muted); margin: 2px 0 6px; }
  .legend { font-size: 12px; margin: 2px 0 6px; }
  .sw { display: inline-block; width: 11px; height: 11px; border: 1px solid var(--ink); vertical-align: -1px; margin: 0 3px 0 8px; }
  /* ---- the 13 name buttons ---- */
  .names { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0; }
  .names button { min-width: 62px; padding: 4px 6px; line-height: 1.15; text-align: center; }
  .names button .sym { display: block; font-weight: 700; font-size: 14px; }
  .names button .nm { display: block; font-size: 10.5px; color: var(--muted); }
  .names button.right-answer { background: #E3F2E8; border-color: var(--good); }
  .names button.wrong-answer { background: #FBE4E5; border-color: var(--accent); }
  /* ---- the Chart ---- */
  table.chart { width: 100%; border-collapse: collapse; font-size: 13px; }
  .chart th { text-align: left; font-weight: 600; color: var(--ink); border-bottom: 1px solid var(--axis); padding: 3px 6px; }
  .chart td { border-bottom: 1px solid var(--grid); padding: 2px 6px; vertical-align: middle; }
  .chart td.n { text-align: right; width: 2.2em; }
  .chart td.cue { color: var(--muted); }
  .chart td.cue:empty::after { content: "\2014"; color: var(--grid); }
  svg.minisvg { display: block; width: 168px; height: 34px; cursor: pointer; }
  .chart button.rowplay { min-height: 30px; padding: 2px 8px; }
  /* ---- the Trainer ---- */
  .score { margin: 6px 0; color: var(--ink); }
  .done { display: inline-block; margin-left: 8px; padding: 2px 10px; border-radius: 12px; background: var(--good); color: #fff; font-weight: 700; }
  .feedback { min-height: 2.6em; margin: 6px 0; color: var(--ink); font-size: 15px; }
  .feedback.right { color: var(--good); }
  .feedback.wrong { color: var(--accent); }
  /* ---- the Shift tab: the tune's notes lit in the highlight colour, the raised note of "Break one interval" in the accent colour ---- */
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button:disabled:hover { border-color: var(--axis); }
  .key.tune rect { fill: var(--highlight); stroke: var(--ink); stroke-width: 2; }
  .key.broken rect { fill: var(--accent); stroke: var(--ink); stroke-width: 2.5; }
  .key.black.tune text { fill: var(--ink); }
  .key.broken text { fill: #fff; }
  .irow { margin: 2px 0 4px; color: var(--ink); font-size: 16px; font-variant-numeric: tabular-nums; line-height: 1.6; }
  .irow .iv { display: inline-block; min-width: 1.9em; text-align: center; }
  .irow .iv.chg { color: var(--accent); font-weight: 700; text-decoration: underline; }   /* the raised note's two intervals: colour AND bold AND underlined, never colour alone */
</style>
</head>
<body>
<div class="wrap">

<div class="top">
  <button class="tab" id="tabExplore" role="tab" aria-selected="true" aria-controls="pExplore" title="Explore: pick two keys, or an interval name, and see it">Explore</button>
  <button class="tab" id="tabChart" role="tab" aria-selected="false" tabindex="-1" aria-controls="pChart" title="Chart: all 13 intervals with a song to remember each by">Chart</button>
  <button class="tab" id="tabTrainer" role="tab" aria-selected="false" tabindex="-1" aria-controls="pTrainer" title="Trainer: hear an interval and name it">Trainer</button>
  <button class="tab" id="tabShift" role="tab" aria-selected="false" tabindex="-1" aria-controls="pShift" title="Shift: move a tune up and down the piano; the notes change, the intervals do not">Shift</button>
  <select id="tuning" aria-label="Tuning system" title="Equal temperament: 12 identical semitones. Pythagorean: pure 3:2 fifths from C. Meantone: quarter-comma. Well temperament: Werckmeister III. The same four tunings as the Piano gadget; the notes always keep their names, only the sound moves.">
    <option value="equal" selected>Equal temperament</option>
    <option value="pythagorean">Pythagorean</option>
    <option value="meantone">Meantone (1/4-comma)</option>
    <option value="well">Well temperament (Werckmeister III)</option>
  </select>
</div>

<!-- ============ EXPLORE ============ -->
<section id="pExplore" role="tabpanel" aria-labelledby="tabExplore">
  <div class="scroller"><svg class="strip" id="exSvg" role="group" aria-label="Piano strip, C3 to C5. Click a key to make it the root, then click a second key to read the interval between them. Nothing plays until you press Together, Up or Down."></svg></div>
  <div class="legend" aria-hidden="true"><span class="sw" style="background:var(--highlight)"></span>root<span class="sw" style="background:var(--right)"></span>up target<span class="sw" style="background:var(--derived)"></span>down target<span class="sw" style="background:#F4E6BE"></span>span</div>
  <div class="readout" id="exReadout" aria-live="polite"></div>
  <div class="names" id="exNames" role="group" aria-label="Pick an interval: both the ascending and the descending note light up"></div>
  <div class="controls">
    <button class="both"  id="exT" aria-label="Play together" title="Play together: the root and the other note at once">Together</button>
    <button class="left"  id="exU" aria-label="Play up" title="Play up: the root, then the other note (with a name picked: the note above)">Up</button>
    <button class="right" id="exD" aria-label="Play down" title="Play down: the other note, then the root (with a name picked: the root, then the note below)">Down</button>
    <button id="exC" aria-label="Clear" title="Clear: forget the root and the interval">Clear</button>
  </div>
  <!-- NOTE (author): only the tritone shows two names (d5 / A4). Other aliases (a minor third is also an augmented second, a major third a diminished fourth, ...) depend on how the notes are SPELLED, which this widget does not model; the spelling page covers them. -->
</section>

<!-- ============ CHART ============ -->
<section id="pChart" role="tabpanel" aria-labelledby="tabChart" hidden>
  <table class="chart" id="chartTable">
    <thead><tr><th class="n" scope="col" title="half steps">Half steps</th><th scope="col">Interval</th><th scope="col">Symbol</th><th scope="col">From C</th><th scope="col">Play</th><th scope="col">Song cue</th></tr></thead>
    <tbody></tbody>
  </table>
</section>

<!-- ============ TRAINER ============ -->
<section id="pTrainer" role="tabpanel" aria-labelledby="tabTrainer" hidden>
  <div class="controls">
    <label for="tDir" style="color:var(--ink)">Direction</label>
    <select id="tDir" aria-label="Direction of the interval" style="flex:0 0 auto;margin-left:0">
      <option value="up" selected>Up</option><option value="down">Down</option><option value="together">Together</option>
    </select>
    <button id="tW" title="Widen: from the easy set (3, 4 and 7 half steps) to every interval, 0 to 12">Widen</button>
    <span id="tLevel" style="color:var(--ink)"></span>
    <button id="tH" aria-pressed="false" title="Hide labels: mask the strip's note names and the lit span until you have answered">Hide labels</button>
  </div>
  <div class="controls">
    <button class="both" id="tP" aria-label="Play again" title="Play the interval again">Play</button>
    <button id="tN" aria-label="Next interval" title="Next: a new interval, played">Next</button>
    <span class="score" id="tScore" aria-live="polite"></span><span class="done" id="tDone" hidden>Done: 10 in a row on All</span>
  </div>
  <div class="scroller"><svg class="strip static" id="trSvg" role="img" aria-label="Piano strip, C3 to C5, for the trainer."></svg></div>
  <div class="feedback" id="tFb" aria-live="polite"></div>
  <div class="names" id="tNames" role="group" aria-label="Name the interval you heard"></div>
</section>

<!-- ============ SHIFT ============ -->
<section id="pShift" role="tabpanel" aria-labelledby="tabShift" hidden>
  <div class="controls">
    <label for="shTune" style="color:var(--ink)">Tune</label>
    <select id="shTune" aria-label="Tune" style="flex:0 0 auto;margin-left:0;max-width:290px"></select>
    <button id="shDn" aria-label="Shift down one half step">Shift down</button>
    <button id="shUp" aria-label="Shift up one half step">Shift up</button>
    <button id="shOd" aria-label="Octave down">Octave down</button>
    <button id="shOu" aria-label="Octave up">Octave up</button>
  </div>
  <div class="controls">
    <button class="both" id="shPlay" aria-label="Play the tune from its current position" title="Play the tune from where it is now">Play</button>
    <button id="shReset" aria-label="Back to start" title="Back to start: the tune where it began, the true tune">Back to start</button>
    <button id="shBreak" aria-pressed="false" aria-label="Break one interval" title="Break one interval: replay the tune with its middle note raised a half step, then press again to restore the true tune">Break one interval</button>
  </div>
  <div class="scroller"><svg class="strip static" id="shSvg" role="img" aria-label="Piano strip, C3 to C5, for the Shift tab."></svg></div>
  <div class="legend" aria-hidden="true"><span class="sw" style="background:var(--highlight)"></span>the tune's notes<span class="sw" style="background:var(--accent)"></span>the raised note</div>
  <div class="readout" id="shReadout" aria-live="polite" style="min-height:3em"><span class="big" id="shStart"></span><span class="plain" id="shNames"></span></div>
  <div class="note">Between each pair of neighbouring notes, in half steps (+ up, - down):</div>
  <div class="irow" id="shIntervals" role="group" aria-label="Interval sizes in half steps between neighbouring notes"></div>
  <div class="note" id="shCaption" hidden>the notes changed, the intervals did not</div>
</section>

</div>
<script>
(function () {
  "use strict";

  // --- pure functions (no DOM) -------------------------------------------
  // Tuning math COPIED from piano_keyboard.html (same tables, same fifth-chain construction, same midiToHz), so the four tunings
  // here are the Piano gadget's: copied, not imported, because a gadget is a self-contained iframe that cannot load a sibling.
  var A4_HZ = 440;
  var LOW = 48, HIGH = 72;                       // C3 .. C5 inclusive (MIDI numbers): the Piano gadget's range
  var STAGGER = 0.2;                             // seconds between arpeggio onsets (the Piano gadget's)
  var INTERVAL_GAP = 0.6;                        // seconds between the two notes of an interval, long enough to hear each
  var NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
  var PYTH_CENTS = [0, 113.69, 203.91, 294.13, 407.82, 498.04, 611.73, 701.96, 815.64, 905.87, 996.09, 1109.78];
  var PURE_FIFTH = 1200 * Math.log2(3 / 2);                 // 701.9550... cents
  var SYNTONIC_COMMA = 1200 * Math.log2(81 / 80);            // 21.5063... cents
  var MEANTONE_FIFTH = PURE_FIFTH - SYNTONIC_COMMA / 4;       // ~696.578 cents
  function fifthChainCents(fifthCents) {
    var PC_ORDER = [3, 10, 5, 0, 7, 2, 9, 4, 11, 6, 1, 8];   // chain Eb Bb F C G D A E B F# C# G# -> pitch class
    var cents = new Array(12);
    for (var i = 0; i < 12; i++) {
      var raw = (i - 3) * fifthCents;
      cents[PC_ORDER[i]] = ((raw % 1200) + 1200) % 1200;
    }
    return cents;
  }
  var MEAN_CENTS = fifthChainCents(MEANTONE_FIFTH);
  var WERCK_CENTS = [0, 90.225, 192.180, 294.135, 390.225, 498.045, 588.270, 696.090, 792.180, 888.270, 996.090, 1092.180];
  var TUNING_TABLES = { pythagorean: PYTH_CENTS, meantone: MEAN_CENTS, well: WERCK_CENTS };
  var TUNINGS = ["equal", "pythagorean", "meantone", "well"];
  function midiToHz(m, system) {
    var table = TUNING_TABLES[system];
    if (!table) return A4_HZ * Math.pow(2, (m - 69) / 12);          // "equal", or no system given
    var pc = m % 12, oct = Math.floor(m / 12) - 1;                   // C4 = MIDI 60 -> oct 4
    return A4_HZ * Math.pow(2, (table[pc] - table[9]) / 1200 + (oct - 4));   // anchored at A4 = 440
  }
  function midiToName(m) { return NAMES[m % 12] + (Math.floor(m / 12) - 1); }   // scientific pitch notation: the key labels use SHARPS, like the Piano gadget
  function isBlack(m) { return NAMES[m % 12].length === 2; }

  // The 13 intervals, 0 to 12 half steps. `symbols` has TWO entries only for the tritone (d5 / A4, both shown); every other
  // alias (m3 = A2, M3 = d4, ...) depends on how the notes are spelled, which this widget does not model, so it is NOT shown.
  var INTERVALS = [
    { n: 0,  name: "unison",         short: "unison",    symbols: ["P1"] },
    { n: 1,  name: "minor second",   short: "minor 2nd", symbols: ["m2"] },
    { n: 2,  name: "major second",   short: "major 2nd", symbols: ["M2"] },
    { n: 3,  name: "minor third",    short: "minor 3rd", symbols: ["m3"] },
    { n: 4,  name: "major third",    short: "major 3rd", symbols: ["M3"] },
    { n: 5,  name: "perfect fourth", short: "perfect 4th", symbols: ["P4"] },
    { n: 6,  name: "tritone",        short: "tritone",   symbols: ["d5", "A4"] },
    { n: 7,  name: "perfect fifth",  short: "perfect 5th", symbols: ["P5"] },
    { n: 8,  name: "minor sixth",    short: "minor 6th", symbols: ["m6"] },
    { n: 9,  name: "major sixth",    short: "major 6th", symbols: ["M6"] },
    { n: 10, name: "minor seventh",  short: "minor 7th", symbols: ["m7"] },
    { n: 11, name: "major seventh",  short: "major 7th", symbols: ["M7"] },
    { n: 12, name: "octave",         short: "octave",    symbols: ["P8"] }
  ];
  // Song cues, TITLES ONLY (never lyrics), the interval from the first two notes of the tune, ascending. ONE named array: edit the
  // cues here and nowhere else. The two blanks stay blank on purpose (forge-core is not certain of a cue for the minor sixth or the major seventh).
  var SONG_CUES = [
    "Happy Birthday (its first two notes)",   // 0  unison
    "Jaws",                                    // 1  minor second
    "Frère Jacques",                      // 2  major second
    "Greensleeves",                            // 3  minor third
    "When the Saints Go Marching In",          // 4  major third
    "Here Comes the Bride",                    // 5  perfect fourth
    "Maria (West Side Story)",                 // 6  tritone
    "Twinkle Twinkle Little Star",             // 7  perfect fifth
    "",                                        // 8  minor sixth (blank)
    "My Bonnie Lies Over the Ocean",           // 9  major sixth
    "Somewhere (West Side Story)",             // 10 minor seventh
    "",                                        // 11 major seventh (blank)
    "Somewhere Over the Rainbow"               // 12 octave
  ];
  // The facts about a half-step count: {count, name, symbol, symbols}; ABOVE 12 it is "more than an octave" and is NOT named.
  function intervalInfo(n) {
    if (n >= 0 && n <= 12) {
      var i = INTERVALS[n];
      return { count: n, name: i.name, symbol: i.symbols.join(" / "), symbols: i.symbols.slice(), over: false };
    }
    return { count: n, name: null, symbol: null, symbols: [], over: true };
  }
  // Where the two notes land from a root: {up, down}, each null when it falls outside the strip (C3-C5), so it is simply not drawn.
  function targetsFor(root, n, low, high) {
    low = low === undefined ? LOW : low; high = high === undefined ? HIGH : high;
    var up = root + n, down = root - n;
    return { up: up <= high ? up : null, down: down >= low ? down : null };
  }
  // Every key from a to b inclusive (either order): the SPAN to highlight.
  function spanKeys(a, b) {
    var lo = Math.min(a, b), hi = Math.max(a, b), out = [];
    for (var m = lo; m <= hi; m++) out.push(m);
    return out;
  }
  // Plain reading of a note. ONE rule: black keys are spoken as FLATS ("E-flat"), because an interval is read up from its root and
  // the common ones (m3, m6, m7) name the flat; the strip's own key labels stay sharps, like the Piano gadget.
  var FLAT_WORDS = ["C", "D-flat", "D", "E-flat", "E", "F", "G-flat", "G", "A-flat", "A", "B-flat", "B"];
  function plainName(m) { return FLAT_WORDS[m % 12]; }
  function steps(n) { return n + (n === 1 ? " half step" : " half steps"); }
  // "3 half steps up from C: E-flat" (more than an octave: the same line ends "(more than an octave)", no interval name).
  function reading(root, other) {
    var n = Math.abs(other - root);
    if (n === 0) return "0 half steps: the same note, " + plainName(root);
    var dir = other > root ? "up" : "down";
    return steps(n) + " " + dir + " from " + plainName(root) + ": " + plainName(other) + (n > 12 ? " (more than an octave)" : "");
  }
  // Both targets of a picked interval, in one line: "3 half steps up from C: E-flat; down: A" (a side outside the strip is left out).
  function readingForPick(root, n) {
    var t = targetsFor(root, n);
    if (n === 0) return reading(root, root);
    var parts = [];
    if (t.up !== null) parts.push(steps(n) + " up from " + plainName(root) + ": " + plainName(t.up));
    if (t.down !== null) parts.push((parts.length ? "down: " : steps(n) + " down from " + plainName(root) + ": ") + plainName(t.down));
    return parts.length ? parts.join("; ") : steps(n) + " from " + plainName(root) + ": outside C3 to C5";
  }
  // --- Explore: the state machine {root, target, pick} -------------------
  // A click on a key: the first is the ROOT; the second (a different key) the TARGET; clicking the root again clears it; with both
  // chosen, the next click starts over with that key as the new root. A picked name resets target, keeps the root (C4 if there is none).
  function exploreClick(st, midi) {
    if (st.root === null) return { root: midi, target: null, pick: null };
    if (st.target === null && st.pick === null) return midi === st.root ? { root: null, target: null, pick: null } : { root: st.root, target: midi, pick: null };
    return { root: midi, target: null, pick: null };
  }
  function explorePick(st, n) { return { root: st.root === null ? 60 : st.root, target: null, pick: n }; }
  // What the readout and the strip show for a state: {count, info, text, root, up, down, span:[midi...]} or null with nothing chosen.
  function exploreView(st) {
    if (st.root === null) return null;
    if (st.target !== null) {
      var n = Math.abs(st.target - st.root);
      return { count: n, info: intervalInfo(n), text: reading(st.root, st.target), root: st.root, up: st.target > st.root ? st.target : null, down: st.target < st.root ? st.target : null, span: spanKeys(st.root, st.target) };
    }
    if (st.pick !== null) {
      var t = targetsFor(st.root, st.pick), span = [st.root];
      if (t.up !== null) span = span.concat(spanKeys(st.root, t.up));
      if (t.down !== null) span = span.concat(spanKeys(t.down, st.root));
      return { count: st.pick, info: intervalInfo(st.pick), text: readingForPick(st.root, st.pick), root: st.root, up: t.up, down: t.down, span: span };
    }
    return { count: null, info: null, text: "Root " + midiToName(st.root) + ". Click a second key, or pick an interval below.", root: st.root, up: null, down: null, span: [st.root] };
  }

    for (var k in keys) { keys[k].classList.toggle("span", !!span[+k] && +k !== 60 && +k !== 60 + i.n); keys[k].classList.toggle("root", +k === 60); keys[k].classList.toggle("up", +k === 60 + i.n && i.n > 0); }
    var play = function () { playPlan(chartPlan(i.n, tuning)); };
    svg.addEventListener("click", play);
    svg.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); play(); } });
    var pb = html("td", {}, tr), btn = html("button", { "class": "rowplay", "aria-label": "Play the " + i.name, title: "Play: C then the upper note, then both together" }, pb, "Play");
    btn.addEventListener("click", play);
    html("td", { "class": "cue", "data-cue": SONG_CUES[i.n] ? "1" : "0" }, tr, SONG_CUES[i.n]);
  });

  // --- TRAINER ---------------------------------------------------------------------------------------------------------------
  var tr = { level: "easy", direction: "up", hide: false, q: null, answered: false, score: { streak: 0, best: 0, allStreak: 0, done: false } };
  var rnd = function () { return (typeof window.__intervalRandom === "function" ? window.__intervalRandom : Math.random)(); };   // injectable: a test sets window.__intervalRandom
  var trKeys = buildStrip($("trSvg"), LOW, HIGH, { WW: 40, WH: 150, BW: 24, BH: 92, PAD: 2, labels: true }, null);
  var tNames = $("tNames");
  INTERVALS.forEach(function (i) {
    var b = html("button", { id: "tA" + i.n, "data-count": i.n, "aria-label": i.name + ", " + i.symbols.join(" or "), title: i.name + " (" + i.symbols.join(" / ") + ")" }, tNames);
    html("span", { "class": "sym" }, b, i.symbols.join("/"));
    html("span", { "class": "nm" }, b, i.short);
    b.addEventListener("click", function () { answer(i.n); });
  });
  function newQuestion(play) {
    tr.q = nextQuestion(tr.level, tr.direction, tr.q ? tr.q.count : null, rnd);
    tr.answered = false;
    INTERVALS.forEach(function (i) { $("tA" + i.n).classList.remove("right-answer", "wrong-answer"); });
    $("tFb").className = "feedback"; $("tFb").textContent = play ? "Which interval was that?" : "Press Play to hear an interval, then choose its name.";
    renderTrainer();
    if (play) playPlan(trainerPlan(tr.q, tuning));
  }
  function answer(n) {
    if (!tr.q || tr.answered) return;
    tr.answered = true;
    var ok = n === tr.q.count;
    tr.score = scoreAnswer(tr.score, ok, tr.level);
    $("tA" + n).classList.add(ok ? "right-answer" : "wrong-answer");
    if (!ok) $("tA" + tr.q.count).classList.add("right-answer");
    $("tFb").className = "feedback " + (ok ? "right" : "wrong"); $("tFb").textContent = answerText(tr.q, n);
    renderTrainer();
  }
  function renderTrainer() {
    var q = tr.q;
    // before the answer: Reveal shows the labels and the ROOT key; Hide masks the labels and lights nothing. After it: everything shows.
    var view = null;
    if (q) {
      if (tr.answered) view = { root: q.root, up: q.target > q.root ? q.target : null, down: q.target < q.root ? q.target : null, span: spanKeys(q.root, q.target) };
      else if (!tr.hide) view = { root: q.root, up: null, down: null, span: [q.root] };
    }
    paintStrip(trKeys, view);
    $("trSvg").classList.toggle("masked", tr.hide && !tr.answered);
    $("trSvg").setAttribute("aria-label", tr.answered && q ? "Piano strip: " + midiToName(Math.min(q.root, q.target)) + " to " + midiToName(Math.max(q.root, q.target)) + ", " + steps(q.count) + "." : "Piano strip, C3 to C5, for the trainer.");
    $("tLevel").textContent = tr.level === "easy" ? "Easy: 3, 4 and 7 half steps" : "All: 0 to 12 half steps";
    $("tW").textContent = tr.level === "easy" ? "Widen" : "Narrow";
    $("tW").setAttribute("title", tr.level === "easy" ? "Widen: every interval, 0 to 12 half steps" : "Narrow: back to the easy set, 3, 4 and 7 half steps");
    $("tH").setAttribute("aria-pressed", tr.hide ? "true" : "false");
    $("tH").textContent = tr.hide ? "Reveal labels" : "Hide labels";
    $("tScore").textContent = "Streak " + tr.score.streak + " · Best " + tr.score.best;
    $("tDone").hidden = !tr.score.done;
  }
  $("tP").addEventListener("click", function () { if (tr.q) playPlan(trainerPlan(tr.q, tuning)); });
  $("tN").addEventListener("click", function () { newQuestion(true); });
  $("tDir").addEventListener("change", function (e) { tr.direction = e.target.value; newQuestion(false); });
  $("tW").addEventListener("click", function () {
    tr.level = tr.level === "easy" ? "all" : "easy";
    if (tr.level === "easy") tr.score = { streak: tr.score.streak, best: tr.score.best, allStreak: 0, done: tr.score.done };
    newQuestion(false);
  });
  $("tH").addEventListener("click", function () { tr.hide = !tr.hide; renderTrainer(); });

  // --- SHIFT -----------------------------------------------------------------------------------------------------------------
  // State: the tune, how far it has been moved (`offset`, half steps), whether it has been moved at all (`shifted`, for the caption), and
  // whether the raised note is on (`broken`). Nothing here plays except Play and Break one interval; a shift is silent.
  var sh = { tune: TUNES[0], offset: 0, shifted: false, broken: false };
  var shKeys = buildStrip($("shSvg"), LOW, HIGH, { WW: 40, WH: 150, BW: 24, BH: 92, PAD: 2, labels: true }, null);
  TUNES.forEach(function (t) { html("option", { value: t.id }, $("shTune"), t.title); });
  function shBase() { return shiftTune(sh.tune.notes, sh.offset); }
  function shShown() { var n = shBase(); return sh.broken ? breakOne(n) : n; }
  function shiftButton(id, ok, enabledTitle, disabledTitle) {           // a shift that would leave the strip is disabled (grey) and its title says why
    var b = $(id); b.disabled = !ok;
    b.setAttribute("title", ok ? enabledTitle : disabledTitle);
  }
  function renderShift() {
    var base = shBase(), shown = sh.broken ? breakOne(base) : base, bi = breakIndex(base), raised = sh.broken ? shown[bi] : null, lit = {};
    shown.forEach(function (m, i) { if (!(sh.broken && i === bi)) lit[m] = true; });
    for (var k in shKeys) { var m = +k, c = shKeys[k].classList; c.toggle("broken", raised === m); c.toggle("tune", !!lit[m] && raised !== m); }
    $("shSvg").setAttribute("aria-label", "Piano strip, C3 to C5: " + sh.tune.title + " starting on " + plainName(base[0]) + (sh.broken ? ", with one note raised a half step" : "") + ".");
    $("shStart").textContent = "starts on " + plainName(base[0]) + " (octave " + (Math.floor(base[0] / 12) - 1) + ")";
    $("shNames").textContent = noteNames(shown).join(" ");
    var row = $("shIntervals"), was = tuneIntervals(base), now = tuneIntervals(shown);
    while (row.firstChild) row.removeChild(row.firstChild);
    now.forEach(function (d, i) {
      var changed = sh.broken && d !== was[i];
      var span = html("span", changed ? { "class": "iv chg", "aria-label": signed(d) + ", changed by the raised note", title: "changed by the raised note (it was " + signed(was[i]) + ")" } : { "class": "iv" }, row, signed(d));
      if (i < now.length - 1) row.appendChild(document.createTextNode(" "));
    });
    $("shCaption").hidden = !sh.shifted || sh.broken;           // once shifted at least once; not while the tune is broken (then the intervals DID change)
    $("shBreak").setAttribute("aria-pressed", sh.broken ? "true" : "false");
    shiftButton("shDn", canShift(sh.tune.notes, sh.offset - 1, LOW, HIGH), "Shift down: every note one half step lower", "Can't shift down: the lowest note would go below C3");
    shiftButton("shUp", canShift(sh.tune.notes, sh.offset + 1, LOW, HIGH), "Shift up: every note one half step higher", "Can't shift up: the highest note would go above C5");
    shiftButton("shOd", canShift(sh.tune.notes, sh.offset - 12, LOW, HIGH), "Octave down: every note twelve half steps lower", "Can't go an octave down: the lowest note would go below C3");
    shiftButton("shOu", canShift(sh.tune.notes, sh.offset + 12, LOW, HIGH), "Octave up: every note twelve half steps higher", "Can't go an octave up: the highest note would go above C5");
  }
  function moveBy(d) {
    if (!canShift(sh.tune.notes, sh.offset + d, LOW, HIGH)) return;       // a disabled button never gets here from a click; a keyboard or a script might
    sh.offset += d; sh.shifted = true; renderShift();
  }
  $("shDn").addEventListener("click", function () { moveBy(-1); });
  $("shUp").addEventListener("click", function () { moveBy(1); });
  $("shOd").addEventListener("click", function () { moveBy(-12); });
  $("shOu").addEventListener("click", function () { moveBy(12); });
  $("shPlay").addEventListener("click", function () { playTune(tunePlan(shShown(), tuning, sh.tune.step)); });
  $("shReset").addEventListener("click", function () { sh.offset = 0; sh.broken = false; renderShift(); });   // the tune where it began, the TRUE tune
  $("shBreak").addEventListener("click", function () { sh.broken = !sh.broken; renderShift(); playTune(tunePlan(shShown(), tuning, sh.tune.step)); });   // on: the raised note; again: the true tune, and it sounds too
  $("shTune").addEventListener("change", function (e) {
    var t = TUNES.filter(function (x) { return x.id === e.target.value; })[0] || TUNES[0];
    sh = { tune: t, offset: 0, shifted: false, broken: false }; renderShift();
  });

  renderExplore();
  newQuestion(false);
  renderShift();
})();
</script>
</body>
</html>
