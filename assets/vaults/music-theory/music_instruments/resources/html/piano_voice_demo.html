<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piano voice: Old / New</title>
<style>
  /* Palette: the same values as piano_keyboard.html. NOT embedded in any page: open it to compare the two sounds by ear. */
  :root { --paper: #FDFCFA; --ink: #2B2B2B; --muted: #555555; --axis: #666666; --grid: #F2F2EC; --accent: #D72027; --highlight: #F8C54B; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--muted); padding: 10px 12px 14px; }
  .wrap { max-width: 660px; margin: 0 auto; }
  h1 { font-size: 16px; color: var(--ink); margin: 0 0 4px; }
  p { margin: 0 0 8px; font-size: 13px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .row .label { flex: 0 0 11em; font-size: 13px; color: var(--ink); }
  button { font: inherit; font-size: 13px; color: var(--ink); background: #fff; border: 1px solid var(--axis); border-radius: 6px; padding: 6px 14px; cursor: pointer; min-height: 36px; }
  button:hover { border-color: var(--ink); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
  button.new { background: var(--highlight); }
  pre { margin: 10px 0 0; padding: 8px 10px; background: #fff; border: 1px solid var(--grid); border-radius: 6px; font-size: 12px; white-space: pre-wrap; min-height: 2em; }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #1f1f1f; --ink: #ececec; --muted: #b8b8b8; --axis: #8a8a8a; --grid: #333; }
    button, pre { background: #2a2a2a; color: var(--ink); }
    button.new { background: #8a6a1f; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Piano voice: Old and New</h1>
  <p>The same notes, two voices. <b>Old</b> is the single-oscillator beep the gadgets had; <b>New</b> is the additive piano voice (ten partials, two strings, a hammer, a limiter). Listen on headphones or speakers.</p>
  <div id="rows"></div>
  <div class="row"><button id="measure" type="button">Measure Old and New (offline render)</button></div>
  <pre id="numbers" aria-live="polite"></pre>
</div>
<script>
(function () {
  "use strict";
  // --- the same math the Piano gadget uses (equal temperament is enough here) ---------------------------------------------------------------------
  function hzOf(m) { return 440 * Math.pow(2, (m - 69) / 12); }

  // ==== piano voice BEGIN (2026-11-13-1214-1) ====================================================================================================
  // The SAME block is in piano_voice_demo.html, piano_keyboard.html and interval_widget.html (each gadget is one self-contained file, so it is copied; a test pins the three identical).
  // A piano-like note by ADDITIVE SYNTHESIS: 10 partials per string with a slight inharmonic stretch (stiff strings: partial n at n*f*sqrt(1 + B*n*n), B from about 0.0003 in the treble to about 0.001
  // in the bass, normalised so the fundamental is exactly f), each partial with its own decay (higher ones die faster, bass notes ring longer), TWO strings a couple of cents apart (the natural beating), a few
  // ms of band-passed hammer noise scaled by velocity, a low-pass whose cutoff rises with velocity and falls with pitch, a quick release at the end of the note, and a soft limiter on the shared bus so a chord does not clip.
  // `when` is an absolute time on the context's clock; `hz` is the pitch the gadget's tuning asks for (the pitch-dependent parts use the note number it is nearest to). Per note: 20 oscillators (string 1's partials 1..10, then string 2's) and no other source but the hammer noise.
  var PIANO_PARTIALS = 10;
  var PIANO_STRINGS = 2;
  var PIANO_OSC_PER_NOTE = PIANO_PARTIALS * PIANO_STRINGS;
  var PIANO_DETUNE_CENTS = [0, 2];                     // string 1 true, string 2 two cents sharp
  var PIANO_ATTACK = 0.004;                            // s, the rise of the note
  var PIANO_RELEASE = 0.02;                            // s, the end of a note is a quick fade, never a cut
  function pianoClamp(x, lo, hi) { return Math.min(hi, Math.max(lo, x)); }
  function pianoMidi(hz) { return 69 + 12 * Math.log(hz / 440) / Math.LN2; }
  function pianoB(midi) { return 0.0003 + 0.0007 * pianoClamp((84 - midi) / 60, 0, 1); }                               // C6 and above 0.0003, rising toward the bass (C2 about 0.00086, C1 and below 0.001)
  function pianoPartialHz(f, n, B) { return n * f * Math.sqrt((1 + B * n * n) / (1 + B)); }                            // n = 1 is exactly f
  function pianoDecay(midi, n) { return pianoClamp(4.2 - 0.045 * (midi - 36), 0.7, 4.2) / (1 + 0.8 * (n - 1)); }       // the time constant (s) of partial n: the bass rings longer, each higher partial dies faster
  function pianoPartialAmp(n) { return 1 / Math.pow(n, 1.1); }                                                         // the spectrum falls off gently: a hammer-struck string keeps its upper partials
  function pianoCutoff(midi, velocity) { return pianoClamp(1800 + 7200 * velocity - 35 * (midi - 60), 500, 12000); }  // Hz: harder = brighter, higher = darker
  var pianoNoiseCache = null, pianoBusCache = null;
  function pianoNoiseBuffer(ctx) {
    if (!pianoNoiseCache || pianoNoiseCache.ctx !== ctx) {
      var n = Math.max(1, Math.round(ctx.sampleRate * 0.012)), b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0), seed = 1;
      for (var i = 0; i < n; i++) { seed = (seed * 16807) % 2147483647; d[i] = seed / 1073741823.5 - 1; }        // a fixed noise burst: the same every time
      pianoNoiseCache = { ctx: ctx, buffer: b };
    }
    return pianoNoiseCache.buffer;
  }
  function pianoBus(ctx) {                                                                                             // the shared output: a soft limiter, so a four-note chord does not clip
    if (!pianoBusCache || pianoBusCache.ctx !== ctx) {
      var comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -10; comp.knee.value = 8; comp.ratio.value = 12; comp.attack.value = 0.002; comp.release.value = 0.12;
      comp.connect(ctx.destination);
      pianoBusCache = { ctx: ctx, node: comp };
    }
    return pianoBusCache.node;
  }
  function pianoVoice(ctx, destination, hz, when, length, velocity, level) {
    var t0 = when, end = when + Math.max(0.05, length), midi = pianoMidi(hz), B = pianoB(midi);
    var v = pianoClamp(velocity == null ? 0.8 : velocity, 0.05, 1), peak = pianoClamp(level == null ? 1 : level, 0, 2) * (0.1 + 0.2 * v);
    var sumA = 0, n, s;
    for (n = 1; n <= PIANO_PARTIALS; n++) sumA += pianoPartialAmp(n);
    var out = ctx.createGain(), lp = ctx.createBiquadFilter();
    lp.type = "lowpass"; lp.frequency.value = pianoCutoff(midi, v); lp.Q.value = 0.7;
    out.gain.setValueAtTime(0.0001, t0);
    out.gain.linearRampToValueAtTime(peak, t0 + PIANO_ATTACK);
    out.gain.setValueAtTime(peak, Math.max(end, t0 + PIANO_ATTACK + 0.001));
    out.gain.setTargetAtTime(0, Math.max(end, t0 + PIANO_ATTACK + 0.001), PIANO_RELEASE / 4);                          // the quick release (about 20 ms to silence)
    out.gain.setValueAtTime(0, Math.max(end, t0 + PIANO_ATTACK + 0.001) + 0.15);
    lp.connect(out); out.connect(destination);
    for (s = 0; s < PIANO_STRINGS; s++) {
      var fs = hz * Math.pow(2, PIANO_DETUNE_CENTS[s] / 1200);
      for (n = 1; n <= PIANO_PARTIALS; n++) {
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.type = "sine"; o.frequency.value = pianoPartialHz(fs, n, B);
        g.gain.setValueAtTime(pianoPartialAmp(n) / sumA / PIANO_STRINGS, t0);
        g.gain.setTargetAtTime(0, t0 + PIANO_ATTACK, pianoDecay(midi, n));
        o.connect(g); g.connect(lp);
        o.start(t0); o.stop(Math.max(end, t0 + PIANO_ATTACK + 0.001) + 0.2);
      }
    }
    var ns = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), ng = ctx.createGain();                          // the hammer: a few ms of band-passed noise, harder = louder
    ns.buffer = pianoNoiseBuffer(ctx);
    bp.type = "bandpass"; bp.frequency.value = pianoClamp(1200 + 2400 * v + 12 * (midi - 60), 600, 6000); bp.Q.value = 1;
    ng.gain.setValueAtTime(0.2 * v * v, t0); ng.gain.setTargetAtTime(0, t0 + 0.001, 0.003);
    ns.connect(bp); bp.connect(ng); ng.connect(lp);
    ns.start(t0); ns.stop(t0 + 0.02);
  }
  // ==== piano voice END ===========================================================================================================================

  if (typeof document === "undefined") { module.exports = { pianoVoice: pianoVoice, oldPluck: null }; return; }

  // --- the OLD voice, kept here only for the comparison: one oscillator, a 1/n^2 periodic wave, an envelope (the gadgets' pluck before 2026-11-13-1214-1) ---------
  function oldWave(ctx) {
    var re = new Float32Array(7), im = new Float32Array(7);
    for (var n = 1; n < 7; n++) im[n] = 1 / (n * n);
    return ctx.createPeriodicWave(re, im);
  }
  function oldPluck(ctx, wave, destination, hz, when, peak, len) {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.setPeriodicWave(wave); o.frequency.value = hz;
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(peak, when + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, when + len);
    o.connect(g); g.connect(destination);
    o.start(when); o.stop(when + len + 0.2);
  }
  // A snippet is a list of [midi, offset seconds, length seconds, level] and is played by either voice into any context (live or offline).
  var SNIPPETS = [
    ["A single middle C", [[60, 0, 1.0, 1]]],
    ["A rising C major arpeggio", [[60, 0, 0.9, 1], [64, 0.3, 0.9, 1], [67, 0.6, 0.9, 1], [72, 0.9, 1.4, 1]]],
    ["A C-E-G chord", [[60, 0, 1.4, 0.58], [64, 0, 1.4, 0.58], [67, 0, 1.4, 0.58]]],
    ["A low C2", [[36, 0, 1.6, 1]]],
    ["A high C6", [[84, 0, 1.2, 1]]]
  ];
  function playSnippet(ctx, which, notes, t0, destinationOld, destinationNew, wave) {
    notes.forEach(function (n) {
      if (which === "old") oldPluck(ctx, wave, destinationOld, hzOf(n[0]), t0 + n[1], 0.28 * n[3], 2.4);
      else pianoVoice(ctx, destinationNew, hzOf(n[0]), t0 + n[1], n[2], 0.8, n[3]);
    });
  }
  var live = null, liveWave = null;
  function liveCtx() {
    if (!live) { var AC = window.AudioContext || window.webkitAudioContext; live = new AC(); liveWave = oldWave(live); }
    if (live.state === "suspended") live.resume();
    return live;
  }
  var rows = document.getElementById("rows");
  SNIPPETS.forEach(function (s) {
    var row = document.createElement("div"); row.className = "row";
    var label = document.createElement("span"); label.className = "label"; label.textContent = s[0];
    row.appendChild(label);
    ["old", "new"].forEach(function (which) {
      var b = document.createElement("button"); b.type = "button"; b.className = which; b.textContent = which === "old" ? "Old" : "New";
      b.setAttribute("aria-label", s[0] + ", " + which + " voice");
      b.addEventListener("click", function () { var c = liveCtx(); playSnippet(c, which, s[1], c.currentTime + 0.02, c.destination, pianoBus(c), liveWave); });
      row.appendChild(b);
    });
    rows.appendChild(row);
  });

  // --- the measurement: the middle C rendered offline for 1.5 s with each voice; numbers a person can read and a test can check --------------------------------
  function fft(re, im) {                                      // in-place radix-2 FFT (length a power of two)
    var n = re.length, i, j, k, m, t;
    for (i = 1, j = 0; i < n; i++) { var bit = n >> 1; for (; j & bit; bit >>= 1) j ^= bit; j ^= bit; if (i < j) { t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; } }
    for (var len = 2; len <= n; len <<= 1) {
      var ang = -2 * Math.PI / len, wr = Math.cos(ang), wi = Math.sin(ang);
      for (i = 0; i < n; i += len) {
        var cr = 1, ci = 0;
        for (k = 0; k < len / 2; k++) {
          var ur = re[i + k], ui = im[i + k], vr = re[i + k + len / 2] * cr - im[i + k + len / 2] * ci, vi = re[i + k + len / 2] * ci + im[i + k + len / 2] * cr;
          re[i + k] = ur + vr; im[i + k] = ui + vi; re[i + k + len / 2] = ur - vr; im[i + k + len / 2] = ui - vi;
          t = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = t;
        }
      }
    }
  }
  function rms(d, from, to) { var s = 0, a = Math.round(from * 44100), b = Math.round(to * 44100); for (var i = a; i < b; i++) s += d[i] * d[i]; return Math.sqrt(s / Math.max(1, b - a)); }
  function analyse(d) {
    var N = 16384, re = new Float64Array(N), im = new Float64Array(N), start = Math.round(0.02 * 44100);
    for (var i = 0; i < N; i++) re[i] = (d[start + i] || 0) * (0.5 - 0.5 * Math.cos(2 * Math.PI * i / (N - 1)));
    fft(re, im);
    var tot = 0, wsum = 0, hi = 0, hz;
    for (var k = 1; k < N / 2; k++) { var e = re[k] * re[k] + im[k] * im[k]; hz = k * 44100 / N; tot += e; wsum += e * hz; if (hz >= 1000) hi += e; }
    var peak = 0, jump = 0; for (var j = 0; j < d.length; j++) { if (Math.abs(d[j]) > peak) peak = Math.abs(d[j]); if (j > 0 && j > 44100 * 1.0 && Math.abs(d[j] - d[j - 1]) > jump) jump = Math.abs(d[j] - d[j - 1]); }
    return { centroidHz: wsum / tot, shareAbove1kHz: hi / tot, peak: peak, rmsAt0_1s: rms(d, 0.075, 0.125), rmsAt1_0s: rms(d, 0.95, 1.0), lastFiveMsRms: rms(d, 1.5 - 0.005, 1.5), maxStepAfter1s: jump };
  }
  function render(which, notes, seconds) {
    var oc = new OfflineAudioContext(1, Math.round(seconds * 44100), 44100);
    var bus = pianoBus(oc);                                    // the New voice's bus (the Old one plays straight to the output, as it always did)
    playSnippet(oc, which, notes, 0, oc.destination, bus, oldWave(oc));
    return oc.startRendering().then(function (buf) { return buf.getChannelData(0); });
  }
  window.__measure = function () {
    var c = SNIPPETS[0][1], chord = SNIPPETS[2][1];
    return Promise.all([render("old", c, 1.5), render("new", c, 1.5), render("old", chord, 2), render("new", chord, 2)]).then(function (r) {
      var o = analyse(r[0]), n = analyse(r[1]);
      var chordPeak = function (d) { var p = 0; for (var i = 0; i < d.length; i++) if (Math.abs(d[i]) > p) p = Math.abs(d[i]); return p; };
      return { old: o, nu: n, chordPeakOld: chordPeak(r[2]), chordPeakNew: chordPeak(r[3]) };
    });
  };
  document.getElementById("measure").addEventListener("click", function () {
    window.__measure().then(function (m) {
      var f = function (x) { return (Math.round(x * 1000) / 1000).toString(); };
      document.getElementById("numbers").textContent =
        "middle C, 1.5 s (Old -> New)\n" +
        "  spectral centroid: " + f(m.old.centroidHz) + " Hz -> " + f(m.nu.centroidHz) + " Hz\n" +
        "  share of energy above 1 kHz: " + f(m.old.shareAbove1kHz) + " -> " + f(m.nu.shareAbove1kHz) + "\n" +
        "  RMS at 0.1 s -> at 1.0 s: " + f(m.old.rmsAt0_1s) + " -> " + f(m.old.rmsAt1_0s) + " (Old); " + f(m.nu.rmsAt0_1s) + " -> " + f(m.nu.rmsAt1_0s) + " (New)\n" +
        "  peak: " + f(m.old.peak) + " (Old), " + f(m.nu.peak) + " (New); the last 5 ms RMS of New: " + f(m.nu.lastFiveMsRms) + "\n" +
        "C-E-G chord, peak: " + f(m.chordPeakOld) + " (Old), " + f(m.chordPeakNew) + " (New); 1.0 would clip";
    });
  });
})();
</script>
</body>
</html>
