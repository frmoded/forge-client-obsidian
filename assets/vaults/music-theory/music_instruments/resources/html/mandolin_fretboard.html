<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mandolin fretboard</title>
<style>
  /* Palette: forge_music_theory_style_guide.md, "Color scheme" (revised 2026-09-25).
     Same values as monochord.html, piano_keyboard.html, guitar_fretboard.html and lute_fretboard.html. */
  :root {
    --paper: #FDFCFA;   /* Vault Background (Paper) */
    --ink: #2B2B2B;     /* Title Text */
    --muted: #555555;   /* Body Text / Plot Labels */
    --axis: #666666;    /* Axis Lines / Strong Ticks */
    --grid: #F2F2EC;    /* Faint Gridlines / Fine Ticks */
    --left: #2B2B2B;    /* Primary Signal / Input 1 */
    --right: #B39373;   /* Secondary Signal / Input 2 */
    --right-text: #7A644E; /* --right darkened for legible TEXT on the paper background */
    --derived: #64748B; /* Combined / Derived Series */
    --highlight: #F8C54B; /* Highlight: a held position */
    --accent: #D72027;  /* Primary Accent: keyboard focus */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--muted);
    padding: 8px 10px 14px;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  /* Sixteen positions per course do not fit a phone at a tappable size, so the
     fretboard keeps a minimum width and scrolls sideways there. */
  .scroller { overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; }
  svg { display: block; width: 100%; min-width: 660px; height: auto; user-select: none; -webkit-user-select: none; }
  .pt { cursor: pointer; }
  .pt:focus { outline: none; }
  /* Each position is a small dot; hovering, focusing or holding it swaps in a
     disc that carries the note name, so 64 labels never clutter the board. */
  .pt .dot { fill: var(--axis); opacity: 0.35; }
  .pt .disc { fill: #FFFFFF; stroke: var(--axis); stroke-width: 1; opacity: 0; }
  .pt text { fill: var(--ink); font-size: 9px; opacity: 0; pointer-events: none; }
  .pt:hover .disc, .pt:hover text { opacity: 1; }
  .pt:hover .dot { opacity: 0; }
  .pt.held .disc { opacity: 1; fill: var(--highlight); stroke: var(--ink); stroke-width: 1.5; }
  .pt.held text { opacity: 1; }
  .pt.held .dot { opacity: 0; }
  /* Plain :focus (not :focus-visible): a mouse click focuses the point too, and
     :focus-visible would hide the ring exactly when the user clicked it. */
  .pt:focus .disc { opacity: 1; stroke: var(--accent); stroke-width: 3; }
  .pt:focus text { opacity: 1; }
  .pt:focus .dot { opacity: 0; }
  /* Every fret wire SEGMENT (one per course) and clickable point slides to its own position under
     the chosen tuning system independently, so a fret visibly breaks into a zigzag when the system
     is not rotationally symmetric (Pythagorean, meantone, well temperament). */
  .wire-seg, .pt, .inlay { transition: transform 400ms ease-out; }
  /* Position markers (the inlay dots on the neck): very subtle, the text colour at a low opacity with
     no stroke, drawn BEHIND the strings, fret wires and clickable points, and never a click target. */
  .inlay { fill: var(--ink); fill-opacity: 0.16; stroke: none; pointer-events: none; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 10px; align-items: center; }
  button {
    font: inherit; font-size: 13px; color: var(--ink);
    background: #fff; border: 1px solid var(--axis); border-radius: 6px;
    padding: 8px 12px; cursor: pointer; min-height: 40px;
  }
  button:hover { border-color: var(--ink); }
  button:active { background: var(--grid); }
  button.left  { border-color: var(--left);  color: var(--left); }
  /* Role shows in COLOR only: same border weight, radius and text weight on every button.
     The Secondary-Signal tan (--right) is a line/fill color and is only 2.9:1 against white as a
     1px border, so it read as a thinner, washed-out border; use its text-safe darker shade. */
  button.right { border-color: var(--right-text); color: var(--right-text); }
  button.both  { border-color: var(--derived); color: var(--derived); }
  select {
    font: inherit; font-size: 13px; color: var(--ink);
    background: #fff; border: 1px solid var(--axis); border-radius: 6px;
    padding: 8px 12px; cursor: pointer; min-height: 40px;
  }
  select:hover { border-color: var(--ink); }
</style>
</head>
<body>
<div class="wrap">

<div class="scroller"><svg id="svg" role="group" aria-label="Mandolin fretboard, four courses tuned G3 D4 A4 E5, frets 0 to 15. Click a position to hold it, then play the held notes. Arrow keys move between positions. In Pythagorean, meantone or well temperament each fret breaks into a zigzag, a different position per course, because one straight fret cannot be exactly right for four differently-tuned strings at once."></svg></div>

<div class="controls">
  <button class="both"  id="bT" title="All held notes at once, as a chord">Play together</button>
  <button class="left"  id="bU" title="Held notes one at a time, lowest to highest">Play ascending</button>
  <button class="right" id="bD" title="Held notes one at a time, highest to lowest">Play descending</button>
  <button id="bC" title="Release every held position">Clear</button>
  <select id="tuning" aria-label="Tuning system" title="Equal temperament is rotationally symmetric, so one straight fret is correct for every course. Pythagorean, quarter-comma meantone and Werckmeister III well temperament are NOT: each course's own open pitch class determines where ITS fret lands, so the frets break into a zigzag. A real limitation of fretted instruments in a non-equal tuning, not a simplification.">
    <option value="equal" selected>Equal temperament</option>
    <option value="pythagorean">Pythagorean</option>
    <option value="meantone">Meantone (1/4-comma)</option>
    <option value="well">Well temperament (Werckmeister III)</option>
  </select>
</div>

</div>
<script>
(function () {
  "use strict";

  // --- pure math (no DOM) ------------------------------------------------
  // Standard concert pitch: A4 (MIDI 69) = 440 Hz. The OPEN courses and the note-name labels are
  // 12-tone equal temperament; the tuning dropdown only moves where each fret lands.
  var A4_HZ = 440;
  // Mandolin: four COURSES of doubled strings, tuned in perfect fifths like a violin. Low course to
  // high (MIDI numbers): G3 D4 A4 E5 = 55 62 69 76. Each course is a pair of unison strings; for
  // this tool a course sounds as ONE pitch (the two strings are not modelled separately).
  // Checked against an independent source, not memory alone: Wikipedia, "Mandolin" (the courses
  // are tuned in perfect fifths, G3 D4 A4 E5, the same as a violin; four courses of doubled strings;
  // about 20 frets on a modern instrument; scale length about 13 inches / 330 mm, up to about
  // 13 7/8 inches / 350 mm on Gibson-style American instruments).
  var TUNING = [55, 62, 69, 76];
  var FRETS = 15;                                // frets 0 (open) .. 15 drawn (a real neck has 17 to 20)
  var STAGGER = 0.2;                             // seconds between arpeggio onsets
  var NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
  function midiToHz(m) { return A4_HZ * Math.pow(2, (m - 69) / 12); }
  function midiToName(m) { return NAMES[m % 12] + (Math.floor(m / 12) - 1); }   // scientific pitch notation

  // A fret is a single physical bar shared by every course, so it shortens all four strings by the
  // same FRACTION of their own length. That lands on the same number of CENTS above each open pitch
  // only in a rotationally symmetric tuning system (every semitone the same size whichever pitch
  // class you start from): equal temperament is. Pythagorean, meantone and well temperament are not,
  // so fretCents needs the course's own open pitch class (`openPC`). Same construction as
  // lute_fretboard.html, whose tables these are.
  var PYTH_CENTS = [0, 113.69, 203.91, 294.13, 407.82, 498.04, 611.73, 701.96, 815.64, 905.87, 996.09, 1109.78];
  var WERCK_CENTS = [0, 90.225, 192.180, 294.135, 390.225, 498.045, 588.270, 696.090, 792.180, 888.270, 996.090, 1092.180];
  // Quarter-comma meantone: the Eb-Bb-F-C-G-D-A-E-B-F#-C#-G# chain with each fifth narrowed by 1/4 of
  // the SYNTONIC comma (~696.58 cents), so four fifths land on a pure major third.
  var PURE_FIFTH = 1200 * Math.log2(3 / 2);                 // 701.955... cents
  var SYNTONIC_COMMA = 1200 * Math.log2(81 / 80);            // 21.506... cents
  var MEANTONE_FIFTH = PURE_FIFTH - SYNTONIC_COMMA / 4;       // ~696.578 cents
  function fifthChainCents(fifthCents) {
    // Position i (0..11) is `i - 3` fifths from C in the chain Eb Bb F C G D A E B F# C# G#;
    // PC_ORDER maps that chain position to the pitch-class index (0=C .. 11=B) it lands on.
    var PC_ORDER = [3, 10, 5, 0, 7, 2, 9, 4, 11, 6, 1, 8];
    var cents = new Array(12);
    for (var i = 0; i < 12; i++) {
      var raw = (i - 3) * fifthCents;
      cents[PC_ORDER[i]] = ((raw % 1200) + 1200) % 1200;
    }
    return cents;
  }
  var MEAN_CENTS = fifthChainCents(MEANTONE_FIFTH);
  var SYSTEMS = ["equal", "pythagorean", "meantone", "well"];
  // `openPC` = the fretting course's own open pitch class (0=C .. 11=B). Ignored by "equal".
  function fretCents(n, system, openPC) {
    if (system === "pythagorean" || system === "meantone" || system === "well") {
      var table = system === "pythagorean" ? PYTH_CENTS : system === "meantone" ? MEAN_CENTS : WERCK_CENTS;
      var p = openPC % 12;
      var targetPC = (p + n) % 12;
      var octaves = Math.floor((p + n) / 12);
      return table[targetPC] - table[p] + 1200 * octaves;
    }
    return n * 100;                                                      // "equal", and the default
  }
  function fretFraction(n, system, openPC) { return Math.pow(2, -fretCents(n, system, openPC) / 1200); }   // remaining length
  // The label on each fret is the nearest EQUAL-TEMPERED semitone name (open course + n semitones),
  // whichever system is sounding. The SOUND (hzAt) is the real pitch under the selected system.
  function midiAt(s, f) { return TUNING[s] + f; }
  function hzAt(s, f, system) { return midiToHz(TUNING[s]) * Math.pow(2, fretCents(f, system, TUNING[s] % 12) / 1200); }
  function posKey(s, f) { return s + ":" + f; }
  function parseKey(k) { var p = k.split(":"); return { s: +p[0], f: +p[1] }; }
  // A held position set (keys "course:fret") in ascending pitch order; equal
  // pitches keep the lower course first.
  function sortedHeld(held) {
    return Array.from(held).map(parseKey).sort(function (a, b) {
      return (midiAt(a.s, a.f) - midiAt(b.s, b.f)) || (a.s - b.s);
    });
  }
  // What to sound for a held set: [{s, f, midi, hz, when}] with `when` in seconds
  // from the button press. An empty set gives an empty plan, i.e. nothing happens.
  function planPlay(held, mode, system) {
    var ps = sortedHeld(held);
    if (mode === "down") ps.reverse();
    return ps.map(function (p, i) {
      return { s: p.s, f: p.f, midi: midiAt(p.s, p.f), hz: hzAt(p.s, p.f, system), when: mode === "together" ? 0 : i * STAGGER };
    });
  }
  // Position markers: the classic inlay dots at frets 3 5 7 9 12 15, a DOUBLE dot at the octave (12).
  // Each dot sits between two ADJACENT courses (0 = G3 .. 3 = E5): singles between D4 and A4 (1, 2); the
  // octave's two dots one between each outer pair, A4/E5 (2, 3) and D4/A4 (1, 2).
  var INLAY_FRETS = [3, 5, 7, 9, 12, 15];
  function inlayPlan() {
    var out = [];
    INLAY_FRETS.forEach(function (f) {
      if (f === 12) { out.push({ fret: f, between: [2, 3] }); out.push({ fret: f, between: [1, 2] }); }
      else out.push({ fret: f, between: [1, 2] });
    });
    return out;
  }
  // --- end pure math -----------------------------------------------------

  if (typeof document === "undefined") {           // node test harness
    module.exports = { INLAY_FRETS: INLAY_FRETS, inlayPlan: inlayPlan, A4_HZ: A4_HZ, TUNING: TUNING, FRETS: FRETS, STAGGER: STAGGER, SYSTEMS: SYSTEMS, PYTH_CENTS: PYTH_CENTS, MEAN_CENTS: MEAN_CENTS, WERCK_CENTS: WERCK_CENTS, fifthChainCents: fifthChainCents, PURE_FIFTH: PURE_FIFTH, MEANTONE_FIFTH: MEANTONE_FIFTH, midiToHz: midiToHz, midiToName: midiToName, fretFraction: fretFraction, fretCents: fretCents, midiAt: midiAt, hzAt: hzAt, posKey: posKey, planPlay: planPlay };
    return;
  }

  var NS = "http://www.w3.org/2000/svg";
  var $ = function (id) { return document.getElementById(id); };
  var svg = $("svg"), held = new Set(), pts = {}, wireSegs = {};
  var NS_ = TUNING.length;
  var system = "equal";                          // default: equal temperament (a mandolin has fixed metal frets)

  // Geometry (viewBox units). BASE_SYSTEM fixes the coordinates every element is actually DRAWN
  // at; switching `system` moves each course's own fret 1..15 (its wire segment and its one
  // clickable point) by a CSS `transform: translateX`, independently per course, so the DOM
  // never rebuilds and a fret can visibly zigzag. Frets are spaced like a real neck: fret n sits
  // at NUT + L * (1 - fraction), with L chosen so fret 12 (half the scale) is at NUT + BOARD.
  var BASE_SYSTEM = "equal";                     // rotationally symmetric: same geometry for every course
  var NUT = 72, BOARD = 560, L = 2 * BOARD, TOP = 40, GAP = 28, W = 760, H = 186;
  function fretX(n, sys, openPC) { return NUT + L * (1 - fretFraction(n, sys, openPC)); }
  // Base (undrifted) geometry does not depend on which course, since BASE_SYSTEM is rotationally
  // symmetric; course 0's openPC is an arbitrary, harmless stand-in.
  function fretXBase(n) { return fretX(n, BASE_SYSTEM, TUNING[0] % 12); }
  // The clickable position for fret n: the middle of its cell (at the BASE geometry), or (open
  // course) just left of the nut.
  function posX(f) { return f === 0 ? NUT - 22 : (fretXBase(f - 1) + fretXBase(f)) / 2; }
  function stringY(s) { return TOP + (NS_ - 1 - s) * GAP; }     // high course on top, like tablature
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);

  function el(tag, attrs, parent) {
    var n = document.createElementNS(NS, tag);
    for (var a in attrs) n.setAttribute(a, attrs[a]);
    if (parent) parent.appendChild(n);
    return n;
  }

  // Static drawing first (under the clickable positions). Fret numbers and neck markers are
  // physical decorations on the neck, so they stay fixed at the BASE_SYSTEM geometry.
  var MARKS = [0].concat(INLAY_FRETS);
  MARKS.forEach(function (f) {           // fret numbers, top, in the Axis color
    var t = el("text", { x: posX(f), y: 16, "text-anchor": "middle", "font-size": 11, fill: "#666666" }, svg);
    t.textContent = String(f);          // String(): a bare 0 must still draw "0"
  });
  // Position markers (see inlayPlan): drawn here, before the strings, wires and points, so they sit behind all
  // of them. `.inlay` is subtle and has pointer-events: none (the attribute too, for a renderer without the CSS).
  var inlays = [];
  inlayPlan().forEach(function (d) {
    var c = el("circle", { "class": "inlay", "data-fret": d.fret, cx: posX(d.fret),
                           cy: (stringY(d.between[0]) + stringY(d.between[1])) / 2, r: 5, "pointer-events": "none" }, svg);
    inlays.push({ el: c, fret: d.fret, between: d.between });
  });
  el("line", { id: "nut", x1: NUT, y1: TOP - 10, x2: NUT, y2: stringY(0) + 10, stroke: "#2B2B2B", "stroke-width": 4 }, svg);   // the nut
  var END = fretXBase(FRETS) + 30;       // the drawn board ends a little past the last fret
  for (var s = 0; s < NS_; s++) {        // courses: lower ones are thicker
    el("line", { x1: NUT, y1: stringY(s), x2: END, y2: stringY(s), stroke: "#666666", "stroke-width": 2.2 - s * 0.4 }, svg);
    var lb = el("text", { x: 34, y: stringY(s) + 4, "text-anchor": "end", "font-size": 11, fill: "#555555" }, svg);
    lb.textContent = midiToName(TUNING[s]);
  }

  // Roving tabindex: 64 Tab stops would be unusable, so the fretboard is a single
  // Tab stop and the arrow keys move between positions.
  var cur = { s: 0, f: 0 };
  function setCur(s, f, focus) {
    pts[posKey(cur.s, cur.f)].setAttribute("tabindex", "-1");
    cur = { s: s, f: f };
    var g = pts[posKey(s, f)];
    g.setAttribute("tabindex", "0");
    if (focus) { try { g.focus({ preventScroll: false }); } catch (_) {} }
  }
  function makePoint(s, f) {
    var m = midiAt(s, f), x = posX(f), y = stringY(s), key = posKey(s, f);
    var g = el("g", { "class": "pt", tabindex: "-1", role: "button", "aria-pressed": "false",
                      "aria-label": midiToName(m) + ", course " + (s + 1) + ", fret " + f }, svg);
    el("circle", { "class": "disc", cx: x, cy: y, r: 12 }, g);
    el("circle", { "class": "dot", cx: x, cy: y, r: 3.5 }, g);
    // A generous invisible hit target: the whole fret cell, one course row tall.
    var half = f === 0 ? 14 : (fretXBase(f) - fretXBase(f - 1)) / 2 - 1;
    el("rect", { x: x - half, y: y - 13, width: half * 2, height: 26, fill: "transparent" }, g);
    var t = el("text", { x: x, y: y + 3, "text-anchor": "middle" }, g);
    t.textContent = midiToName(m);
    pts[key] = g;
    return g;
  }
  for (s = 0; s < NS_; s++) for (var f = 0; f <= FRETS; f++) makePoint(s, f);
  // Fret wires 1..15: one short SEGMENT per course, at that course's own base x, so frets can
  // zigzag independently per course once a non-symmetric system moves each segment by its own amount.
  for (f = 1; f <= FRETS; f++) {
    wireSegs[f] = [];
    for (s = 0; s < NS_; s++) {
      var half2 = GAP / 2 + 3;   // a touch past the midpoint toward the next course, so segments visually meet
      var wy = stringY(s);
      var seg = el("line", { "class": "wire-seg", "data-fret": f, "data-string": s,
                             x1: fretXBase(f), y1: wy - half2, x2: fretXBase(f), y2: wy + half2,
                             stroke: "#A69B91", "stroke-width": 1 }, svg);
      wireSegs[f][s] = seg;
    }
  }
  Object.keys(pts).forEach(function (key) {
    var p = parseKey(key), g = pts[key];
    g.addEventListener("click", function () { setCur(p.s, p.f, false); toggle(key); try { g.focus({ preventScroll: true }); } catch (_) {} });
    g.addEventListener("focus", function () { if (cur.s !== p.s || cur.f !== p.f) setCur(p.s, p.f, false); });
    g.addEventListener("keydown", function (e) {
      if (e.altKey || e.ctrlKey || e.metaKey) return;
      var ns = p.s, nf = p.f;
      if (e.key === "Enter" || e.key === " ") { toggle(key); e.preventDefault(); return; }   // Space would otherwise scroll
      if (e.key === "ArrowRight") nf = Math.min(FRETS, p.f + 1);
      else if (e.key === "ArrowLeft") nf = Math.max(0, p.f - 1);
      else if (e.key === "ArrowUp") ns = Math.min(NS_ - 1, p.s + 1);      // toward the high course
      else if (e.key === "ArrowDown") ns = Math.max(0, p.s - 1);
      else return;
      e.preventDefault();
      setCur(ns, nf, true);
    });
  });
  pts[posKey(0, 0)].setAttribute("tabindex", "0");

  // Slide every course's own fret 1..15 (wire segment + clickable point) to its position under
  // the newly selected system. `held` and the DOM elements themselves are untouched, so a held
  // note survives a switch.
  function updateGeometry(sys) {
    for (var f = 1; f <= FRETS; f++) {
      for (var s = 0; s < NS_; s++) {
        var openPC = TUNING[s] % 12;
        var delta = fretX(f, sys, openPC) - fretXBase(f);
        wireSegs[f][s].style.transform = "translateX(" + delta + "px)";
        pts[posKey(s, f)].style.transform = "translateX(" + delta + "px)";
      }
    }
    // A position marker follows its fret too: the mean of the two courses it sits between, so it stays
    // centred in the cell its neighbouring points and wire segments have moved to.
    inlays.forEach(function (d) {
      var a = fretX(d.fret, sys, TUNING[d.between[0]] % 12), b = fretX(d.fret, sys, TUNING[d.between[1]] % 12);
      d.el.style.transform = "translateX(" + ((a + b) / 2 - fretXBase(d.fret)) + "px)";
    });
  }

  function toggle(key) {
    if (held.has(key)) held.delete(key); else held.add(key);
    render();
  }
  function render() {
    for (var k in pts) {
      var on = held.has(k);
      pts[k].classList.toggle("held", on);
      pts[k].setAttribute("aria-pressed", on ? "true" : "false");
    }
  }

  // --- Web Audio: OscillatorNode notes ----------------------------------
  var ctx = null, wave = null;
  function audio() {
    if (!ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      // same plucked-string-ish spectrum as the monochord, piano, guitar and lute
      var re = new Float32Array(7), im = new Float32Array(7);
      for (var n = 1; n < 7; n++) im[n] = 1 / (n * n);
      wave = ctx.createPeriodicWave(re, im);
    }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function pluck(hz, when, peak) {
    var c = audio(); if (!c) return;
    var t0 = c.currentTime + (when || 0);
    var o = c.createOscillator(), g = c.createGain();
    o.setPeriodicWave(wave); o.frequency.value = hz;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + 0.01);   // quick attack
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 4.4);  // ring out
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0 + 4.6);
  }
  function play(mode) {
    var plan = planPlay(held, mode, system);                  // reads the CURRENT system at play time
    if (!plan.length) return;                                 // nothing held: do nothing
    // Chords stack partials, so scale each voice down to keep the sum from clipping.
    var peak = 0.28 / Math.sqrt(mode === "together" ? plan.length : 1);
    plan.forEach(function (n) { pluck(n.hz, n.when, peak); });
  }
  $("bT").addEventListener("click", function () { play("together"); });
  $("bU").addEventListener("click", function () { play("up"); });
  $("bD").addEventListener("click", function () { play("down"); });
  $("bC").addEventListener("click", function () { held.clear(); render(); });
  $("tuning").addEventListener("change", function (e) { system = e.target.value; updateGeometry(system); });

  render();
})();
</script>
</body>
</html>
