<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rhythm Box</title>
<style>
  /* Palette: forge_music_theory_style_guide.md, "Color scheme" (revised 2026-09-25).
     Same values as monochord.html, piano_keyboard.html, guitar_fretboard.html, lute_fretboard.html. */
  :root {
    --paper: #FDFCFA;   /* Vault Background (Paper) */
    --ink: #2B2B2B;     /* Title Text */
    --muted: #555555;   /* Body Text / Plot Labels */
    --axis: #666666;    /* Axis Lines / Strong Ticks */
    --grid: #F2F2EC;    /* Faint Gridlines / Fine Ticks */
    --zero: #A69B91;    /* Zero-line / beat divider */
    --left: #2B2B2B;    /* Primary Signal (kick) */
    --right: #B39373;   /* Secondary Signal */
    --right-text: #7A644E; /* --right darkened for legible TEXT on the paper background */
    --derived: #64748B; /* Combined / Derived Series (hi-hat) */
    --highlight: #F8C54B; /* Highlight: a held/active step */
    --accent: #D72027;  /* Primary Accent: keyboard focus, playing-step indicator */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--muted);
    padding: 6px 8px 8px;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  .scroller { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .transport { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; margin-bottom: 6px; }
  button {
    font: inherit; font-size: 13px; color: var(--ink);
    background: #fff; border: 1px solid var(--axis); border-radius: 6px;
    padding: 5px 10px; cursor: pointer; min-height: 32px;
  }
  button:hover { border-color: var(--ink); }
  button:active { background: var(--grid); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.play { border-color: var(--derived); color: var(--derived); font-weight: 600; min-width: 76px; }
  button.play.playing { background: var(--derived); color: #fff; }
  .bpm { display: flex; align-items: center; gap: 4px; border: 1px solid var(--axis); border-radius: 6px; padding: 2px; }
  .bpm button { border: none; min-width: 30px; min-height: 28px; padding: 2px; }
  .bpm .val { min-width: 54px; text-align: center; font-variant-numeric: tabular-nums; font-size: 14px; color: var(--ink); }
  .step-pos { min-width: 62px; text-align: center; font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted); }
  .sliders { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-bottom: 6px; align-items: center; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .slider-field { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .slider-field-wrap { display: flex; flex-direction: column; gap: 2px; }
  .swing-caption { margin: 0; font-size: 11px; color: var(--muted); max-width: 320px; }
  .slider-field input[type="range"] { width: 96px; }
  .banks { display: flex; gap: 4px; margin-bottom: 6px; align-items: center; }
  .banks[hidden] { display: none; }
  .banks button { min-width: 36px; min-height: 30px; padding: 3px 8px; }
  .banks button[hidden] { display: none; }
  .banks button.active { background: var(--highlight); border-color: var(--ink); font-weight: 600; }
  #timeSig {
    font: inherit; font-size: 13px; color: var(--ink);
    background: #fff; border: 1px solid var(--axis); border-radius: 6px;
    padding: 4px 8px; cursor: pointer; min-height: 32px;
  }
  #timeSig:hover { border-color: var(--ink); }
  .grid-wrap { min-width: 620px; }
  .channel-row { display: grid; grid-template-columns: 110px repeat(16, 1fr); gap: 3px; align-items: center; margin-bottom: 2px; }
  .channel-label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
  .mini-btn {
    min-width: 22px; min-height: 22px; padding: 0; font-size: 10px; border-radius: 4px;
    border: 1px solid var(--axis); background: #fff; color: var(--muted); line-height: 1;
  }
  .mini-btn.remove { color: var(--muted); }
  .mini-btn.remove:disabled { opacity: 0.35; cursor: default; }
  /* ONE toolbar for both views (drain 2026-10-20-0900): Add instrument first, then the five transforms (shift left / right, mirror, rotate counter-clockwise /
     clockwise), then, in Circle only, the extras. It sits above the views, so it is the same row in Grid and in Circle. */
  .rhythm-tools { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; margin: 2px 0 4px; font-size: 13px; }
  .rhythm-tools[hidden], .tool-group[hidden] { display: none; }
  .tool-group { display: inline-flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
  .rhythm-tools button { min-width: 34px; padding: 3px 8px; font-size: 15px; line-height: 1.1; }
  .rhythm-tools button.ring-pick { min-width: 0; font-size: 12px; line-height: normal; }
  .rhythm-tools select { font: inherit; font-size: 13px; color: var(--ink); background: #fff; border: 1px solid var(--axis); border-radius: 6px; padding: 4px 6px; min-height: 32px; }
  .rhythm-tools select:disabled { opacity: 0.5; cursor: not-allowed; }
  /* The grid's row selector (the circle's is the ring chips): the instrument's name is a button; the selected one is highlighted like a chip. */
  .channel-label .row-pick { flex: 1; min-width: 0; min-height: 24px; padding: 1px 6px; font-size: 12px; text-align: left; color: var(--muted); background: transparent; border: 1px solid transparent; border-radius: 4px; }
  .channel-label .row-pick:hover { border-color: var(--axis); }
  .channel-label .row-pick[aria-pressed="true"] { background: var(--highlight); border-color: var(--ink); color: var(--ink); font-weight: 600; }
  .mini-btn.on.mute { background: var(--right-text); color: #fff; border-color: var(--right-text); }
  .mini-btn.on.solo { background: var(--accent); color: #fff; border-color: var(--accent); }
  .step {
    min-height: 28px; border: 1px solid var(--grid); border-radius: 4px; background: #fff;
    cursor: pointer; padding: 0; position: relative;
    transition: transform 150ms ease-out;   /* smooths the swing-preview nudge as the slider moves */
  }
  .step:hover { border-color: var(--axis); }
  .step:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  /* Hover-link (drain 2026-10-21-1230): only ever present when the host asked for it (`hoverLink: true`) — an outline, so it never moves anything. */
  .step.link-hot { outline: 2px solid var(--accent); outline-offset: -1px; }
  .cell.link-hot .dot { stroke: var(--accent); stroke-width: 3; }
  .step.on { background: var(--right); border-color: var(--right-text); }
  .step.beat-start { border-left: 2px solid var(--zero); }
  .step.playing::after {
    /* Was --accent (#D72027, saturated red) -- driver: "a bit harsh". #F8C54B (the guide's
       --highlight gold) was tried first since it's the guide's own "active step" vocabulary, but
       it measures only 1.57:1 contrast against the paper background as a thin border -- nearly
       invisible, the same class of bug the piano/guitar/lute button-border fix caught earlier
       this session. This desaturated red keeps "red = position marker" recognizable (distinct
       from the gold/tan/slate "on" colors below) while dropping saturation, at 5.04:1 contrast. */
    content: ""; position: absolute; inset: -2px; border: 1.5px solid rgba(181, 74, 80, 0.8); border-radius: 6px; pointer-events: none;
  }
  /* Was var(--left) #2B2B2B (near-black, same value as Title Text) -- driver: "same but less so".
     var(--muted) #555555 (already used for Body Text) is visibly softer while staying clearly
     "on" against the paper background (7.27:1) and against the other two channels' on-colors. */
  .step[data-channel="kick"].on { background: var(--muted); border-color: var(--ink); }
  .step[data-channel="hihat"].on { background: var(--derived); border-color: #4b5a70; }
  /* Beat-as-data Phase 5: a cell holding a velocity >= 100 (e.g. from accent_mask) is drawn with a double ring so the accents
     are visible. Shown on top of the channel colour, so it reads on kick, snare and hi-hat alike. */
  .step.on.accent { box-shadow: inset 0 0 0 2px #fff, inset 0 0 0 4px var(--ink); }
  /* Host mode only (the widget was opened by the plugin's "Open as Beat Box"): note name + autosave indicator. Hidden standalone. */
  .host-bar { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; margin-bottom: 6px; font-size: 13px; color: var(--ink); }
  .host-bar .note { font-weight: 600; }
  #bReload { background: var(--highlight); border-color: var(--ink); font-weight: 600; }
  .confirm-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 8px; padding: 6px 10px; font-size: 13px; border: 1px solid var(--ink); border-radius: 6px; background: var(--highlight); }
  .host-bar[hidden], .confirm-bar[hidden], #bReload[hidden] { display: none; }   /* an author `display` beats the browser's [hidden]; .host-bar[hidden] was missing, so the bar showed a stray "Editing" row before any load (drain 2026-10-20-0900) */
  .host-msg { font-size: 12px; color: var(--muted); min-height: 16px; }
  .host-msg.error { color: #B54A50; }
  .host-bar [hidden] { display: none; }
  /* Phase 8, playground mode (the plugin's `forge-rhythm` embed): a label and Reset replace the autosave controls (Open note is the host toolbar's). Since drain
     2026-10-20-0900 a host that says `resetInHost` draws Reset and the "not saved" reminder in ITS toolbar row and this whole bar is hidden; an older host gets them here. */
  .host-bar .playground-label { font-weight: 600; }
  /* Circle mode (rhythm necklace): a second drawing of the SAME data. Colours are the grid's own (kick = --muted, hi-hat = --derived,
     the rest = --right), so a channel reads the same in both views. */
  .view-switch { display: inline-flex; border: 1px solid var(--axis); border-radius: 6px; overflow: hidden; }
  .view-switch button { border: none; border-radius: 0; min-width: 60px; min-height: 30px; padding: 3px 10px; }
  .view-switch button + button { border-left: 1px solid var(--axis); }
  .view-switch button[aria-pressed="true"] { background: var(--highlight); font-weight: 600; }
  .view-msg { font-size: 12px; color: var(--muted); min-height: 16px; }
  .circle-view[hidden], .grid-view[hidden] { display: none; }
  .ring-legend { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .ring-legend .ring-pick { min-height: 26px; padding: 2px 8px; font-size: 12px; min-width: 0; }
  .ring-legend .ring-pick[aria-pressed="true"] { background: var(--highlight); border-color: var(--ink); font-weight: 600; }
  button[aria-pressed="true"].shape-toggle { background: var(--grid); border-color: var(--ink); }
  /* The width is set by the script to what the ring count needs (circleSizeFor), so the viewBox units are CSS pixels and the targets are real
     pixels; max-width keeps it inside a narrow pane, where it scales down as before. */
  svg.circle-svg { display: block; max-width: 100%; height: auto; margin: 0 auto; touch-action: manipulation; }
  svg.circle-svg .dot { stroke-width: 1.5; }
  svg.circle-svg .dot.rest { fill: #fff; stroke: var(--axis); }
  svg.circle-svg .dot.hit { fill: var(--right); stroke: var(--right-text); }
  svg.circle-svg .dot.hit.ch-kick { fill: var(--muted); stroke: var(--ink); }
  svg.circle-svg .dot.hit.ch-hihat { fill: var(--derived); stroke: #4b5a70; }
  svg.circle-svg .dot.accent { stroke-width: 3; stroke: var(--ink); }
  /* The active dot: a lighter ring and a soft warm tint — it reads, but no longer shouts over the shape. */
  svg.circle-svg .dot.playing { stroke: rgba(181, 74, 80, 0.7); stroke-width: 2; fill-opacity: 0.85; filter: drop-shadow(0 0 3px rgba(181, 74, 80, 0.45)); }
  svg.circle-svg .target { fill: transparent; stroke: none; cursor: pointer; }
  svg.circle-svg .cell:focus { outline: none; }
  svg.circle-svg .cell:focus-visible .dot, svg.circle-svg .cell.focused .dot { stroke: var(--accent); stroke-width: 3; }
  svg.circle-svg .ring-guide { fill: none; stroke: var(--grid); stroke-width: 1; }
  svg.circle-svg .tick { stroke: var(--zero); stroke-width: 2; stroke-linecap: round; }
  svg.circle-svg .step-label { font-size: 10px; fill: var(--muted); text-anchor: middle; dominant-baseline: middle; font-variant-numeric: tabular-nums; }
  svg.circle-svg .shape { fill: rgba(179, 147, 115, 0.18); stroke: var(--right-text); stroke-width: 2; stroke-linejoin: round; pointer-events: none; }
  /* A hairline, not a spoke: thin and translucent. It is drawn last (on top) but never takes a click and no longer hides a dot or the shape. */
  svg.circle-svg .playhead { stroke: #B54A50; stroke-width: 1; opacity: 0.45; stroke-linecap: round; pointer-events: none; }
  svg.circle-svg .playhead[data-step=""] { visibility: hidden; }
</style>
</head>
<body>
<div class="wrap">

<div class="host-bar" id="hostBar" hidden>
  <span id="hostEditing">Editing</span> <span class="note" id="hostNote"></span>
  <span class="host-msg playground-label" id="playgroundLabel" hidden>Playground &mdash; edits are not saved</span>
  <span class="host-msg" id="loadMsg" role="status" aria-live="polite"></span>
  <span class="host-msg" id="saveMsg" role="status" aria-live="polite"></span>
  <button id="bReload" hidden title="Discard what is on screen and load the note as it is on disk now">Reload from note</button>
  <button id="bReset" hidden title="Put the rhythm back exactly as it is in the note">Reset</button>
</div>
<div class="confirm-bar" id="confirmBar" role="alertdialog" aria-label="Confirm change to the note" hidden>
  <span id="confirmText"></span>
  <button id="confirmOk">Continue</button>
  <button id="confirmCancel">Cancel</button>
</div>

<div class="transport">
  <button class="play" id="bPlay" title="Start or stop the sequencer" aria-pressed="false">Play</button>
  <div class="bpm">
    <button id="bBpmDown" title="Decrease BPM" aria-label="Decrease BPM">−</button>
    <span class="val" id="bpmVal">120 BPM</span>
    <button id="bBpmUp" title="Increase BPM" aria-label="Increase BPM">+</button>
  </div>
  <span class="step-pos" id="stepPos" aria-live="polite">-- / 16</span>
  <select id="timeSig" aria-label="Time signature" title="Switching time signature stops playback and clears all four pattern banks (a 4/4 pattern has no meaningful 3/4 equivalent to preserve). Applies to every bank, not just the current one.">
    <option value="4/4" selected>4/4</option>
    <option value="4/4@8">4/4 (eighth notes)</option>
    <option value="3/4">3/4 (waltz)</option>
    <option value="12/8">12/8</option>
    <option value="6/8">6/8</option>
    <option value="5/4">5/4</option>
  </select>
  <div class="view-switch" id="viewSwitch" role="group" aria-label="View">
    <button type="button" id="bViewGrid" aria-pressed="true" title="Show the pattern as a step grid">Grid</button>
    <button type="button" id="bViewCircle" aria-pressed="false" title="Show the same pattern as a circle (a rhythm necklace)">Circle</button>
  </div>
  <span class="view-msg" id="viewMsg" role="status" aria-live="polite"></span>
</div>

<div class="sliders">
  <label class="slider-field" title="Swing: delays every off-beat 16th note. Try 50&ndash;100% while playing a steady pattern to hear the shuffle. The off-beat step cells nudge right as a preview, even while stopped.">Swing
    <input type="range" id="swing" min="0" max="100" value="0" aria-label="Swing amount" aria-describedby="swingCaption" title="Swing: delays every off-beat 16th note. Try 50&ndash;100% while playing a steady pattern to hear the shuffle. The off-beat step cells nudge right as a preview, even while stopped.">
    <span id="swingVal">0%</span>
  </label>
  <p class="swing-caption sr-only" id="swingCaption">Delays every off-beat 16th note &mdash; try 50&ndash;100% while playing a steady pattern to hear the shuffle. The off-beat step cells below nudge right as a preview, even while stopped.</p>
  <label class="slider-field">Volume
    <input type="range" id="volume" min="0" max="100" value="80" aria-label="Volume">
    <span id="volumeVal">80%</span>
  </label>
</div>

<div class="banks" role="group" aria-label="Pattern bank">
  <button data-bank="A" class="active">A</button>
  <button data-bank="B">B</button>
  <button data-bank="C">C</button>
  <button data-bank="D">D</button>
</div>

<div class="rhythm-tools" id="rhythmTools" role="toolbar" aria-label="Rhythm tools">
  <select id="addInstrument" aria-label="Add instrument" title="Add a row for another instrument (bell, claves, congas)"></select>
  <span class="tool-group" id="transformTools" role="group" aria-label="Transform the pattern"></span>
  <span class="tool-group" id="circleExtras" role="group" aria-label="Circle tools" hidden>
    <button type="button" id="bRingOut" title="Move this ring outward (one place toward the outer edge)" aria-label="Move this ring outward">&#8593;</button>
    <button type="button" id="bRingIn" title="Move this ring inward (one place toward the center)" aria-label="Move this ring inward">&#8595;</button>
    <button type="button" id="bShape" class="shape-toggle" aria-pressed="true" title="Show shape: draw the polygon through the selected ring's hits" aria-label="Show shape">&#9651;</button>
    <span class="ring-legend" id="ringLegend" role="group" aria-label="Pick a ring (its hits make the shape)"></span>
  </span>
</div>

<div class="grid-view" id="gridView">
<div class="scroller">
  <div class="grid-wrap" id="grid" role="group" aria-label="16-step pattern grid, kick, snare, hi-hat"></div>
</div>
</div>

<div class="circle-view" id="circleView" hidden>
  <svg class="circle-svg" id="circle" role="group" aria-label="Rhythm circle" viewBox="0 0 460 460" tabindex="-1"></svg>
</div>


</div>
<script>
// --- pure math (no DOM) -- BEGIN pure-core -------------------------------------------------
var STEPS = 16;                                  // default (4/4) step count; a parameter everywhere it matters
var GROUP_SIZE = 4;                              // 16th notes per beat, same for every signature this ship supports
// Every channel the widget knows — exactly the engine's `_RHYTHM_CHANNEL_INSTRUMENTS` keys (a parity test reads them from the bundled
// lib.py). A note shows one row per channel IT contains; DEFAULT_ROWS is what the standalone widget (no note) starts with.
var CHANNELS = ["kick", "snare", "hihat", "bell", "claves", "conga_high", "conga_low"];
var DEFAULT_ROWS = ["kick", "snare", "hihat"];
var BANKS = ["A", "B", "C", "D"];
var MIN_BPM = 40, MAX_BPM = 240;
// A fixed menu of signatures (no UI for arbitrary beats-per-bar). `steps = beatsPerBar * subdivision`, `groupSize = subdivision` — the
// grid and every pure function below are written generically against these numbers, so another signature is a new entry here, not a
// parallel set of functions. `stepQl` is how long ONE step lasts in quarter notes (what the engine's bar length / steps works out to,
// and what playback speed needs): a sixteenth = 0.25 in the simple meters, an eighth = 0.5 in the compound ones (12/8, 6/8).
// The engine proves each of these (tests/music/test_rhythm_world_vocabulary.py): 12/8 = 12 steps / group 3, 6/8 = 6 / 3, 5/4 = 20 / 4.
var TIME_SIGNATURES = {
  "4/4": { label: "4/4", beatsPerBar: 4, subdivision: 4, steps: 16, groupSize: 4, stepQl: 0.25 },
  "3/4": { label: "3/4 (waltz)", beatsPerBar: 3, subdivision: 4, steps: 12, groupSize: 4, stepQl: 0.25 },
  "12/8": { label: "12/8", beatsPerBar: 4, subdivision: 3, steps: 12, groupSize: 3, stepQl: 0.5 },
  "6/8": { label: "6/8", beatsPerBar: 2, subdivision: 3, steps: 6, groupSize: 3, stepQl: 0.5 },
  "5/4": { label: "5/4", beatsPerBar: 5, subdivision: 4, steps: 20, groupSize: 4, stepQl: 0.25 }
};

// Eighth-note resolution (drain 2026-10-14-1200): 4/4 may ALSO be written as 8 steps (one step = an eighth, 0.5 quarter) in groups of 2 (a
// beat) or 4 (a half bar). The engine already scores it (step = bar / steps); only this widget refused it. Nothing else gains a second grid.
// A note keeps the group_size it was written with — it is carried in state and written back, not replaced by the menu default.
var EIGHTH_GRIDS = { "4/4": { steps: 8, groupSizes: [2, 4], stepQl: 0.5 } };
// The meter menu: its VALUE is a grid key, not a time_signature (4/4 appears twice: sixteenth and eighth resolution). `timeSig` in state
// stays the data's own time_signature string.
var MENU_GRIDS = {
  "4/4": { timeSig: "4/4", steps: 16, groupSize: 4, stepQl: 0.25, label: "4/4" },
  "4/4@8": { timeSig: "4/4", steps: 8, groupSize: 2, stepQl: 0.5, label: "4/4 (eighth notes)" },
  "3/4": { timeSig: "3/4", steps: 12, groupSize: 4, stepQl: 0.25, label: "3/4 (waltz)" },
  "12/8": { timeSig: "12/8", steps: 12, groupSize: 3, stepQl: 0.5, label: "12/8" },
  "6/8": { timeSig: "6/8", steps: 6, groupSize: 3, stepQl: 0.5, label: "6/8" },
  "5/4": { timeSig: "5/4", steps: 20, groupSize: 4, stepQl: 0.25, label: "5/4" }
};
// The grid a (time_signature, steps, group_size) triple means, or null when this widget cannot save it back unchanged.
function resolveGrid(sigKey, steps, groupSize) {
  if (!Object.prototype.hasOwnProperty.call(TIME_SIGNATURES, sigKey)) return null;
  var sig = TIME_SIGNATURES[sigKey];
  if (steps === sig.steps && groupSize === sig.groupSize) return { steps: sig.steps, groupSize: sig.groupSize, stepQl: sig.stepQl };
  var alt = EIGHTH_GRIDS[sigKey];
  if (alt && steps === alt.steps && alt.groupSizes.indexOf(groupSize) >= 0) return { steps: alt.steps, groupSize: groupSize, stepQl: alt.stepQl };
  return null;
}
// The menu key for the grid a note is in (so the select shows what is in force after a load).
function menuKeyFor(sigKey, steps) {
  var alt = EIGHTH_GRIDS[sigKey];
  return alt && steps === alt.steps ? sigKey + "@8" : sigKey;
}

function clampBpm(bpm) { return Math.max(MIN_BPM, Math.min(MAX_BPM, bpm)); }
// One step, in seconds, at a given BPM (BPM is quarter notes per minute). `stepQl` = the step's length in quarter notes: 0.25 (a 16th,
// the default — every simple meter) or 0.5 (an eighth — the compound meters 12/8 and 6/8).
function stepSeconds(bpm, stepQl) { return 60 / bpm * (stepQl == null ? 0.25 : stepQl); }

// Standard swing: delay every SECOND 16th of each eighth-note pair (steps 1,3,5,... 0-indexed —
// the "off" 16th) by a fraction of one 16th-note's duration. 0% = straight grid; 100% = the off
// 16th sits halfway to the NEXT 16th (a gentle, non-extreme swing feel; some DAWs push further
// toward a full triplet feel at 100% — this implementation caps at +0.5 step, a defensible,
// commonly-used middle ground, stated explicitly here rather than left ambiguous).
function swingOffsetSeconds(bpm, swingPct, stepIndex, stepQl) {
  var pct = Math.max(0, Math.min(100, swingPct));
  if (stepIndex % 2 === 0) return 0;                 // only the "off" 16th of each pair swings
  return (pct / 100) * 0.5 * stepSeconds(bpm, stepQl);
}

function emptyPattern(steps) {
  steps = steps == null ? STEPS : steps;
  var pattern = {};
  CHANNELS.forEach(function (ch) { pattern[ch] = new Array(steps).fill(false); });
  return pattern;
}

// Mute/solo: standard behavior — if ANY channel is soloed, only soloed channels are audible

  // World-rhythm voices (Phase 7): all synthesised, no samples — recognisably different, none harsh. Gains stay at or below the kick's.
  function playBell(c, t) {                        // cowbell: two detuned square partials through a band-pass, medium-short decay
    var mg = masterGain(c);
    var bp = c.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 760; bp.Q.value = 1.1;
    var g = c.createGain(); g.gain.setValueAtTime(0.35, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
    [562, 845].forEach(function (f) {
      var o = c.createOscillator(); o.type = "square"; o.frequency.value = f;
      o.connect(bp); o.start(t); o.stop(t + 0.32);
    });
    bp.connect(g); g.connect(mg);
  }
  function playClaves(c, t) {                      // claves: a short, high, woody click — one sine "tok" plus a tick of filtered noise
    var mg = masterGain(c);
    var o = c.createOscillator(), g = c.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(2500, t); o.frequency.exponentialRampToValueAtTime(1900, t + 0.04);
    g.gain.setValueAtTime(0.6, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
    o.connect(g); g.connect(mg); o.start(t); o.stop(t + 0.08);
    var n = c.createBufferSource(); n.buffer = noiseBuffer(c, 0.02);
    var hp = c.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 3500;
    var ng = c.createGain(); ng.gain.setValueAtTime(0.15, t); ng.gain.exponentialRampToValueAtTime(0.001, t + 0.02);
    n.connect(hp); hp.connect(ng); ng.connect(mg); n.start(t); n.stop(t + 0.03);
  }
  function playCongaHigh(c, t) {                   // muted high conga: a short mid-high pitched thump with a slap of band-passed noise
    var mg = masterGain(c);
    var o = c.createOscillator(), g = c.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(420, t); o.frequency.exponentialRampToValueAtTime(330, t + 0.08);
    g.gain.setValueAtTime(0.7, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.13);
    o.connect(g); g.connect(mg); o.start(t); o.stop(t + 0.15);
    var n = c.createBufferSource(); n.buffer = noiseBuffer(c, 0.03);
    var bp = c.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 1500; bp.Q.value = 0.9;
    var ng = c.createGain(); ng.gain.setValueAtTime(0.18, t); ng.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
    n.connect(bp); bp.connect(ng); ng.connect(mg); n.start(t); n.stop(t + 0.04);
  }
  function playCongaLow(c, t) {                    // low conga: a lower, longer thump
    var mg = masterGain(c);
    var o = c.createOscillator(), g = c.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(230, t); o.frequency.exponentialRampToValueAtTime(150, t + 0.14);
    g.gain.setValueAtTime(0.85, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
    o.connect(g); g.connect(mg); o.start(t); o.stop(t + 0.32);
  }
  var VOICE = { kick: playKick, snare: playSnare, hihat: playHihat, bell: playBell, claves: playClaves, conga_high: playCongaHigh, conga_low: playCongaLow };

  function scheduleStep(step, time) {
    var c = audio(); if (!c) return;
    rows.forEach(function (ch) {
      if (patterns[bank][ch][step] && isChannelAudible(ch, muted, soloed)) VOICE[ch](c, time);
    });
  }

  function schedulerTick() {
    var c = audio(); if (!c) return;
    var out = advanceScheduler(schedulerState, c.currentTime, bpm, swingPct, SCHEDULE_AHEAD_S, steps, gridStepQl);
    out.events.forEach(function (ev) {
      scheduleStep(ev.step, ev.time);
      // Update the visual step indicator on its OWN loose timer (setTimeout keyed off the
      // *scheduled* audio time), not off the lookahead loop itself — the lookahead loop runs
      // every LOOKAHEAD_MS regardless of note timing, so driving the visual off IT would jitter.
      var delayMs = Math.max(0, (ev.time - c.currentTime) * 1000);
      setTimeout(function () { if (playing) { currentStep = ev.step; renderPlayhead(); } }, delayMs);
    });
    schedulerState = out.state;
  }

  function start() {
    var c = audio(); if (!c) return;
    playing = true;
    schedulerState = { currentStep: 0, nextNoteTime: c.currentTime + 0.05 };
    $("bPlay").textContent = "Stop"; $("bPlay").classList.add("playing"); $("bPlay").setAttribute("aria-pressed", "true");
    timerId = setInterval(schedulerTick, LOOKAHEAD_MS);
    schedulerTick();
    announcePlaying(true);
  }
  function stop() {
    playing = false;
    if (timerId) { clearInterval(timerId); timerId = null; }
    currentStep = -1; renderPlayhead();
    $("bPlay").textContent = "Play"; $("bPlay").classList.remove("playing"); $("bPlay").setAttribute("aria-pressed", "false");
    announcePlaying(false);
  }
  $("bPlay").addEventListener("click", function () { if (playing) stop(); else start(); });

  // --- host protocol (Beat-as-data Phase 5 + 5b): edit a rhythm data NOTE through this widget ------------------------
  // Standalone (opened directly, or embedded by an html-embed block) nothing below is visible and behaviour is unchanged: no
  // messages are posted, no autosave. When the plugin hosts this page it replies to our `ready` with `forge-rhythm-load`; only
  // THEN does the host bar appear and autosave switch on. Every action that changes pattern data calls commitChange() — the ONE
  // place a `forge-rhythm-save` is posted (the plugin debounces and writes). Play, mute, solo, volume and bank selection never
  // call it. The plugin answers with `forge-rhythm-status` (saving / saved / error / conflict / idle). Messages are accepted only
  // from the embedding window (e.source === window.parent); the plugin makes the mirror check on its side.
  //
  // Phase 8 (the plugin's `forge-rhythm` embed) adds a second HOST MODE, chosen by the load message's `mode`: "playground". There the
  // widget is a toy over a COPY of the note's data: commitChange() posts `forge-rhythm-edited` (no data) and NEVER a save; a
  // time-signature change applies at once; Reset puts the loaded data back (the host's toolbar owns "Open note", and — when the load says `resetInHost: true` —
  // "Reset" and the "not saved" reminder too, so this page draws neither); playing / stopping is announced so the host can keep one sound at a time.
  // Any `mode` other than the exact string "playground" is "edit".
  var hostNote = "", hostLoaded = false;
  var hostMode = "edit";             // "edit" | "playground"
  var resetInHost = false;           // playground only, per load: the HOST's toolbar draws Reset and the "not saved" reminder, so this page draws neither (drain 2026-10-20-0900)
  var loadedData = null;             // playground: a private copy of the last loaded data, what Reset restores
  function hostWindow() { return window.parent && window.parent !== window ? window.parent : null; }
  function postToHost(msg) { var h = hostWindow(); if (h) { try { h.postMessage(msg, "*"); } catch (e) { /* host gone */ } } }
  function commitChange() {
    dismissConfirm();                              // any data edit ends a pending time-signature / remove-row question (without applying it)
    if (!hostWindow() || !hostLoaded) return;      // standalone, or a note that has not loaded (or was refused): never write
    if (hostMode === "playground") { postToHost({ type: "forge-rhythm-edited" }); return; }   // a playground NEVER saves
    postToHost({ type: "forge-rhythm-save", data: buildRhythmData(timeSig, swingPct, bpm, patterns[bank], rows, { steps: steps, groupSize: groupSize }) });   // hosted: `bank` is always "A" — the note's one pattern
  }
  function announcePlaying(on) {
    if (hostMode === "playground" && hostLoaded) postToHost({ type: "forge-rhythm-playing", playing: !!on });
  }
  // The host bar shows exactly one of the two mode's sets of controls.
  // `resetInHost` (the exact boolean true, in a playground load only): the host's own toolbar — one row with Open note, Score, Reset and "not saved" — owns those,
  // so the label, Reset and the note name come off this page and the bar that held them goes with them: one row instead of two. Without the flag (an older
  // plugin) everything is drawn here as it always was. A refused load still shows its message (applyLoad's error branch shows the bar by itself).
  function renderHostBar() {
    var pg = hostMode === "playground";
    $("hostBar").hidden = resetInHost;
    $("hostEditing").hidden = pg;
    $("playgroundLabel").hidden = !pg || resetInHost;
    $("bReset").hidden = !pg || resetInHost;
    $("saveMsg").hidden = pg;
    if (pg) { $("bReload").hidden = true; setHostMsg("saveMsg", "", false); }
  }
  function setHostMsg(id, text, isError) {
    var el = $(id); el.textContent = text; el.classList.toggle("error", !!isError);
  }
  // --- auto height (generic: a widget that wants its iframe sized to its content does exactly this) --------------------------------
  // The host opts in with `autoHeight: true` on the load message (an embed with an explicit `height:` never does). The widget then measures its
  // BODY — whose height is its content's, not the iframe's, so this cannot feed back on itself — and posts {type: "resize", height}
  // at most once per animation frame, and only when the plan says the height really changed. The host clamps and rate-limits on its side too.
  // Standalone (no host window) never gets here: a load message is only accepted from the embedding window.
  var autoHeightOn = false, lastPostedHeight = null, autoHeightFrame = 0, autoHeightObserver = null;
  function postHeightNow() {
    autoHeightFrame = 0;
    if (!autoHeightOn) return;
    var h = autoHeightPlan(document.body.getBoundingClientRect().height, lastPostedHeight);
    if (h === null) return;
    lastPostedHeight = h;
    postToHost({ type: "resize", height: h });
  }
  function scheduleHeight() {
    if (!autoHeightOn || autoHeightFrame) return;
    var raf = window.requestAnimationFrame || function (f) { return setTimeout(f, 16); };
    autoHeightFrame = raf(postHeightNow);
  }
  function setAutoHeight(on) {
    if (on === autoHeightOn) { if (on) scheduleHeight(); return; }
    autoHeightOn = on;
    if (on) {
      lastPostedHeight = null;
      if (typeof ResizeObserver === "function" && !autoHeightObserver) {
        autoHeightObserver = new ResizeObserver(scheduleHeight);
        autoHeightObserver.observe(document.body);
      }
      scheduleHeight();
    } else if (autoHeightObserver) { autoHeightObserver.disconnect(); autoHeightObserver = null; }
  }
  // Hover-link (drain 2026-10-21-1230, score_first M3). A host that says `hoverLink: true` on the load message gets two things: (1) `forge-rhythm-hover`
  // {channel, step} when the pointer is over a grid step or ring cell, and {channel: null} when it leaves; (2) `forge-rhythm-highlight` {channel, step} from the
  // host lights that step (an outline, never a layout change), {channel: null} clears it. Without the flag NOTHING here runs: no listener acts, no message is
  // posted, a highlight message is ignored. (Every other vault's host never sends it.)
  var hoverLink = false, lastHover = "", linkHot = [];
  function stepTarget(t) {
    var el = t && t.closest ? t.closest(".step, .cell") : null;
    if (!el) return null;
    var ch = el.getAttribute("data-channel"), st = el.getAttribute("data-step");
    return ch === null || st === null ? null : { channel: ch, step: Number(st) };
  }
  function reportHover(t) {
    if (!hoverLink) return;
    var x = stepTarget(t), key = x ? x.channel + ":" + x.step : "";
    if (key === lastHover) return;
    lastHover = key;
    postToHost({ type: "forge-rhythm-hover", channel: x ? x.channel : null, step: x ? x.step : null });
  }
  function clearHighlight() {
    linkHot.forEach(function (el) { el.classList.remove("link-hot"); });
    linkHot = [];
  }
  function applyHighlight(channel, step) {
    clearHighlight();
    if (typeof channel !== "string" || typeof step !== "number") return;
    Array.prototype.forEach.call(document.querySelectorAll(".step, .cell"), function (el) {
      if (el.getAttribute("data-channel") === channel && Number(el.getAttribute("data-step")) === step) { el.classList.add("link-hot"); linkHot.push(el); }
    });
  }
  function setHoverLink(on) {
    if (on === hoverLink) return;
    hoverLink = on;
    lastHover = "";
    if (!on) clearHighlight();
  }
  document.addEventListener("mouseover", function (e) { reportHover(e.target); });
  document.addEventListener("mouseout", function (e) { if (!e.relatedTarget) reportHover(null); else reportHover(e.relatedTarget); });
  function applyLoad(msg) {
    setAutoHeight(msg.autoHeight === true);          // only the exact true; a later load without it switches it off again. BEFORE the parse: a refused note's message needs room too
    var r = parseRhythmLoad(msg.data);
    if (!r.ok) { hostLoaded = false; dismissConfirm(); $("hostBar").hidden = false; setHostMsg("loadMsg", "Could not load this note: " + r.message, true); return; }
    hostMode = msg.mode === "playground" ? "playground" : "edit";
    resetInHost = hostMode === "playground" && msg.resetInHost === true;
    setHoverLink(msg.hoverLink === true);              // only the exact true; a load without it switches the link off again
    loadedData = hostMode === "playground" ? JSON.parse(JSON.stringify(msg.data)) : null;
    hostLoaded = true;                                // set BEFORE showLoaded so a stop() inside it is announced consistently
    showLoaded(r.state);
    clearHighlight();                                  // a (re)load rebuilds the grid: nothing stays lit
    // The host may suggest the FIRST view (`view: circle` on a forge-rhythm block). Only the exact strings count, and only once: a later
    // load (Reset, the note changed on disk) must not undo what the student chose since. Never written to the note.
    if (!viewInit) {
      viewInit = true;
      if (msg.view === "circle" || msg.view === "grid") setView(msg.view);
    }
    hostNote = typeof msg.noteName === "string" ? msg.noteName : "";
    $("hostNote").textContent = hostNote;
    $("hostBar").hidden = false; $("bReload").hidden = true;
    renderHostBar();
    setHostMsg("loadMsg", "", false); setHostMsg("saveMsg", "", false);
  }
  // Put a validated state on screen (a load, or a playground's Reset). Never posts a save: loading is not a data change.
  function showLoaded(state) {
    if (playing) stop();
    dismissConfirm();
    var r = { state: state };
    timeSig = r.state.timeSig; steps = r.state.steps; groupSize = r.state.groupSize; gridStepQl = r.state.stepQl;
    $("timeSig").value = menuKeyFor(timeSig, steps);
    setBpm(r.state.bpm);
    swingPct = r.state.swingPct; $("swing").value = swingPct; $("swingVal").textContent = swingPct + "%";
    BANKS.forEach(function (b) { patterns[b] = emptyPattern(steps); });      // the other banks are cleared, as on a time-signature change
    patterns["A"] = r.state.pattern;
    rows = r.state.rows.slice();                      // one row per channel in the note, in the note's order
    bank = "A";
    Array.prototype.forEach.call(document.querySelectorAll(".banks button"), function (x) { x.classList.toggle("active", x.getAttribute("data-bank") === "A"); });
    buildGrid(); renderGrid(); renderMuteSolo(); renderPlayhead(); renderSwingPreview(); syncView();
  }
  // The autosave indicator. "Saved" and errors both PERSIST (an error until the next successful save replaces it).
  function showStatus(state, message) {
    if (hostMode === "playground") return;            // a playground has no autosave indicator, whatever the host says
    var text = String(message || "");
    if (state === "saving") setHostMsg("saveMsg", "Saving…", false);
    else if (state === "saved") setHostMsg("saveMsg", "Saved", false);
    else if (state === "error") setHostMsg("saveMsg", text || "Not saved", true);
    else if (state === "conflict") setHostMsg("saveMsg", text || "The note changed on disk — your latest edit was not saved.", true);
    else if (state === "idle") setHostMsg("saveMsg", "", false);
    else return;
    $("bReload").hidden = state !== "conflict";
  }
  window.addEventListener("message", function (e) {
    var h = hostWindow();
    if (!h || e.source !== h) return;
    var m = e.data;
    if (!m || typeof m !== "object") return;
    if (m.type === "forge-rhythm-load") applyLoad(m);
    else if (m.type === "forge-rhythm-status") showStatus(m.state, m.message);
    else if (m.type === "forge-rhythm-save-result") showStatus(m.ok ? "saved" : "error", m.message);     // Phase 5 reply, still understood
    else if (m.type === "forge-rhythm-request-data") {      // Phase 8: a READ of the current state (what the embed's Score toggle engraves)
      postToHost({ type: "forge-rhythm-current-data", data: hostLoaded ? buildRhythmData(timeSig, swingPct, bpm, patterns[bank], rows, { steps: steps, groupSize: groupSize }) : null });
    }
    else if (m.type === "forge-rhythm-stop") { if (playing) stop(); }
    else if (m.type === "forge-rhythm-highlight") { if (hoverLink) applyHighlight(m.channel, m.step); }   // ignored unless the load asked for hover-link
  });
  $("bReset").addEventListener("click", function () {
    if (hostMode !== "playground" || !hostLoaded || !loadedData) return;
    var r = parseRhythmLoad(loadedData);
    if (r.ok) showLoaded(r.state);
    postToHost({ type: "forge-rhythm-reset" });         // the host re-reads the note and answers with a fresh load (picks up a changed note)
  });
  $("bReload").addEventListener("click", function () { postToHost({ type: "forge-rhythm-reload" }); });
  // Hosted (editing a note) there are no banks: the note holds one pattern, and a variation is another note. The bank buttons are hidden
  // from the first paint (before any load) and their handler is inert while hosted. Standalone keeps all four banks, as always.
  if (hostWindow()) {
    Array.prototype.forEach.call(document.querySelectorAll(".banks button[data-bank]"), function (b) { b.hidden = true; });
    document.querySelector(".banks").hidden = true;      // the (now empty) row takes no space
  }

  setBpm(bpm);
  renderGrid();
  renderMuteSolo();
  renderPlayhead();
  renderSwingPreview();
  renderSelection();
  postToHost({ type: "forge-rhythm-ready" });
})();
}
</script>
</body>
</html>
