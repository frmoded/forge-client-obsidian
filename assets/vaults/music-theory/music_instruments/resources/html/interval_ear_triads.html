<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find the triad notes</title>
<style>

  .wrap { max-width: 360px; }
  .wrap > :not(.switch) { max-width: 334px; }                    /* the strip and the rows are 334 px at most; the two switch rows are allowed 360 so that their buttons stay on ONE row */

  .switch { margin: 0 0 3px; gap: 4px; min-height: 26px; }
  button { font: inherit; color: var(--ink); background: #fff; border: 1px solid var(--axis); border-radius: 6px; padding: 4px 14px; cursor: pointer; min-height: 30px; }
  button:disabled { opacity: 0.45; cursor: default; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
  .switch button { padding: 3px 6px; min-height: 26px; font-size: 11px; white-space: nowrap; }
  .switch button[aria-pressed="true"] { background: var(--highlight); border-color: var(--ink); }
  #hint { color: var(--ink); }
  .sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .key { cursor: pointer; }
  .key:focus { outline: none; }
  .key.white rect { fill: #FFFFFF; stroke: var(--axis); stroke-width: 1; }
  .key.black rect { fill: var(--ink); stroke: var(--ink); stroke-width: 1; }
  .key.first rect { fill: var(--highlight); stroke: var(--ink); stroke-width: 2; }
  .key.right rect { fill: #BFE3CD; stroke: var(--right); stroke-width: 3; }
  .key.black.right rect { fill: var(--right); stroke: #1B5E3A; }
  .key.wrong rect { fill: #F6C9CB; stroke: var(--wrong); stroke-width: 3; stroke-dasharray: 3 2; }
  .key.black.wrong rect { fill: #8B1C20; stroke: var(--wrong); }
  .key.idle { cursor: default; }
  .key.inactive { cursor: not-allowed; }
  .key.black.inactive rect { fill: #B9B9B9; stroke: #9A9A9A; }
  .key:focus rect { stroke: var(--accent); stroke-width: 3; }
  .key.right:focus rect { stroke: var(--right); }

  .key text.mark { font-size: 15px; font-weight: 700; fill: var(--ink); }
  .key.black text { fill: var(--paper); }
  .key.black text.mark { fill: #fff; }
  .arc { fill: none; stroke: var(--axis); stroke-width: 1.4; }
  .arrowhead { fill: var(--axis); }

  .score { display: flex; align-items: center; gap: 10px; margin: 3px 0 0; min-height: 22px; font-size: 12px; }
  #counter { color: var(--ink); }
  .linkbtn { background: none; border: 0; padding: 0; min-height: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 12px; }
  #board { margin: 1px 0 0; min-height: 18px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  #board b { color: var(--ink); }
</style>
</head>
<body>
<div class="wrap">
<div class="row switch" id="levels" role="group" aria-label="Choose a level"></div>
<svg id="strip" role="group" aria-label="Piano keys, C3 to C5. Press Play, listen, then click the key or keys you hear."></svg>
<div class="row"><button id="next" type="button">Play</button><button id="replay" type="button" disabled>Replay</button><span id="hint"></span></div>
<div class="score"><span id="counter"></span><button id="reset" class="linkbtn" type="button">Reset score</button></div>
<div id="board" aria-label="Score of each level in this game"></div>
<span id="sr" class="sr" role="status" aria-live="polite"></span>
</div>

  // ---- the page ---------------------------------------------------------------------------------------------------------------------------------------
  var NS = "http://www.w3.org/2000/svg";
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, attrs, parent) { var n = document.createElementNS(NS, tag); for (var a in attrs) n.setAttribute(a, attrs[a]); if (parent) parent.appendChild(n); return n; }
  var rng = function () { return (window.__earRandom || Math.random)(); };               // an injected random source for tests; the page's own is Math.random
  var WW = 22, WH = 60, BW = 13, BH = 36, PAD = 1, TOP = 0, keys = {}, whites = [], blacks = [], wi = 0, m;       // TOP: a thin band above the keys for the arc between the two notes (always there, so the page never jumps)
  for (m = LOW; m <= HIGH; m++) { if (isBlack(m)) blacks.push({ m: m, x: PAD + wi * WW - BW / 2 }); else { whites.push({ m: m, x: PAD + wi * WW }); wi++; } }
  var strip = $("strip");
  strip.setAttribute("viewBox", "0 0 " + (wi * WW + 2 * PAD) + " " + (TOP + WH + 2 * PAD));
  var arcLayer = el("g", { "class": "arcs", "aria-hidden": "true" }, strip);
  function centreOf(mm) { var k = keys[mm]; var r = k.firstChild; return +r.getAttribute("x") + +r.getAttribute("width") / 2; }
  function makeKey(k, black) {
    var g = el("g", { "class": "key " + (black ? "black" : "white") + " idle", "data-midi": k.m, tabindex: "0", role: "button", "aria-label": nameOf(k.m) }, strip);
    el("rect", { x: k.x, y: TOP + PAD, width: black ? BW : WW, height: black ? BH : WH, rx: black ? 2 : 3 }, g);
    keys[k.m] = g;
    g.addEventListener("click", function () { press(k.m); try { g.focus({ preventScroll: true }); } catch (_) {} });
    g.addEventListener("keydown", function (e) { if (e.altKey || e.ctrlKey || e.metaKey) return; if (e.key === "Enter" || e.key === " ") { e.preventDefault(); press(k.m); } });
  }
  whites.forEach(function (k) { makeKey(k, false); });
  blacks.forEach(function (k) { makeKey(k, true); });
  // Each game keeps its own open question and its own previous question; the LEVEL is one setting for the page and the scores are kept per game and level.
  var GAME = 3;                                        // 2026-11-16-0900: THIS file is one game; there is no game switch, the level switch is all there is
  var GAMES = [{ id: 3, title: "3 Three at once", tip: "Three notes together: find the other two" }];
  var games = {}, current = GAME, level = DEFAULT_LEVEL, scores = emptyScores();
  GAMES.forEach(function (g) { games[g.id] = { state: initial(), previous: null }; });
  function mark(mm, ch) { var g = keys[mm], r = g.firstChild, black = isBlack(mm); var t = el("text", { "class": "mark", x: +r.getAttribute("x") + +r.getAttribute("width") / 2, y: TOP + PAD + (black ? 26 : 50), "text-anchor": "middle" }, g); t.textContent = ch; }
  function renderScore() {
    $("counter").textContent = counterText(scores, current, level);
    var board = $("board"), parts = boardText(scores, current); board.textContent = "";
    parts.forEach(function (p, i) { var n = document.createElement(LEVELS[i] === level ? "b" : "span"); n.textContent = p; board.appendChild(n); if (i < parts.length - 1) board.appendChild(document.createTextNode(" · ")); });
    board.setAttribute("aria-label", "Score of each level in this game: " + parts.join(", "));
  }
  function render(announce) {
    var state = games[current].state, q = state.question;
    arcLayer.textContent = "";
    for (var k in keys) { var g = keys[k]; var ts = g.querySelectorAll("text"); for (var i = 0; i < ts.length; i++) g.removeChild(ts[i]); g.setAttribute("class", "key " + (isBlack(+k) ? "black" : "white") + (state.phase === "asked" ? "" : " idle") + (isInactive(level, +k) ? " inactive" : ""));
      if (isInactive(level, +k)) { g.setAttribute("aria-disabled", "true"); g.setAttribute("tabindex", "-1"); } else { g.removeAttribute("aria-disabled"); g.setAttribute("tabindex", "0"); } }
    if (state.phase !== "idle") {
      keys[q.lit].classList.add("first");
      state.found.forEach(function (mm) { keys[mm].classList.add("right"); mark(mm, "✓"); });
      state.wrong.forEach(function (mm) { keys[mm].classList.add("wrong"); mark(mm, "×"); });
      if (state.phase === "answered" && q.game !== 3) {
        var x1 = centreOf(q.lit), x2 = centreOf(q.targets[0]), top = 3;
        el("path", { "class": "arc", d: "M" + x1 + " " + (TOP - 1) + " Q" + ((x1 + x2) / 2) + " " + (top - 4) + " " + x2 + " " + (TOP - 1) }, arcLayer);   // a thin arc between the two keys (the answer is over)
        el("path", { "class": "arrowhead", d: "M" + x2 + " " + (TOP + 1) + " l-3 -5 l6 0 z" }, arcLayer);
      }
    }
    $("hint").textContent = hintText(state);
    $("replay").disabled = state.phase === "idle";
    LEVELS.forEach(function (l) { $("level-" + l).setAttribute("aria-pressed", l === level ? "true" : "false"); });
    renderScore();
    if (announce !== undefined) $("sr").textContent = announce;
  }
  // ---- sound: the piano voice (the block above, the same as the other gadgets) ------------------------------------------------------------------------------
  var ctx = null;
  function audio() {
    if (!ctx) { var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; ctx = new AC(); }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function sound(plan, together) { var c = audio(); if (!c || !plan.length) return; var t0 = c.currentTime; plan.forEach(function (n) { pianoVoice(c, pianoBus(c), midiToHz(n.midi), t0 + n.when, NOTE_LEN * (together ? 1.4 : 1), 0.8, together ? 0.58 : 1); }); }
  function attemptsText(s) { return s.attemptsLeft + (s.attemptsLeft === 1 ? " attempt left." : " attempts left."); }
  function press(mm) {
    if (isInactive(level, mm)) return;                                                      // easy: a black key is off: no sound, no attempt, nothing said
    var gm = games[current];
    var r = guess(gm.state, mm);
    if (r.event === "ignored") { sound(replayPlan(gm.state, mm, level), false); return; }   // a repeated click: the note again (easy, medium), no attempt, no score                                                     // no question open, the lit note, or a key already marked: nothing
    gm.state = r.state;
    if (r.scored) scores = award(scores, current, gm.state.question.level);
    var q = gm.state.question, text;
    if (r.event === "solved") text = "Correct. Press Play.";
    else if (r.event === "right") text = "That note is right. " + attemptsText(gm.state) + " Find the other.";
    else if (r.event === "gaveup") text = "Out of attempts. The notes were " + q.targets.map(nameOf).join(" and ") + ". Press Play.";
    else text = "Not that one. " + attemptsText(gm.state);                                  // a wrong guess never says what the answer is
    render(text);
    sound(planFeedback(q, mm, r.event), r.event === "gaveup" && q.game !== 1);
  }
  $("next").addEventListener("click", function () {
    var gm = games[current], q = pickQuestion(current, rng, gm.previous, LOW, HIGH, level === "easy");
    q.level = level; gm.previous = q; gm.state = ask(q, attemptsFor(current, level)); scores = markAsked(scores, current, level);
    render((current === 3 ? "Three notes were played. The lowest is " + nameOf(q.lit) + ". Click the other two." : current === 2 ? "Two notes were played together. The lower is " + nameOf(q.lit) + ". Click the other." : "Two notes were played. The first is " + nameOf(q.lit) + ". Click the second.") + " " + attemptsText(gm.state));
    sound(q.sound, current !== 1);
  });
  $("replay").addEventListener("click", function () { var q = games[current].state.question; if (q) sound(q.sound, current !== 1); });       // never reveals the answer
  $("reset").addEventListener("click", function () { scores = resetGame(scores, current); render("Score cleared for this game."); });
  LEVELS.forEach(function (l) {
    var b = document.createElement("button"); b.type = "button"; b.id = "level-" + l; b.textContent = levelName(l); b.setAttribute("aria-description", levelName(l) + ": " + BASE_ATTEMPTS[l] + (BASE_ATTEMPTS[l] === 1 ? " attempt" : " attempts") + " a question (" + (BASE_ATTEMPTS[l] + 1) + " for three notes)"); b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", function () {                                                            // a new level: every open question ends (it counted as asked, with no point), each level keeps its own score
      if (l === level) return;
      level = l; GAMES.forEach(function (g) { games[g.id].state = initial(); });
      render(levelName(l) + ": " + attemptsFor(current, l) + " attempts a question. Press Play.");
    });
    $("levels").appendChild(b);
  });
  render();
})();
</script>
