<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two notes, and the distance between them</title>
<style>
  /* Palette: the same values as piano_keyboard.html (forge_music_theory_style_guide.md). No margin, no padding, no fixed height: the page is exactly its content. */
  :root { --paper: #FDFCFA; --ink: #2B2B2B; --muted: #555555; --axis: #666666; --highlight: #F8C54B; --accent: #D72027; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--muted); font-size: 13px; -webkit-text-size-adjust: 100%; }
  svg { display: block; width: 100%; max-width: 262px; height: auto; user-select: none; -webkit-user-select: none; }
  .key { cursor: pointer; }
  .key:focus { outline: none; }
  .key.white rect { fill: #FFFFFF; stroke: var(--axis); stroke-width: 1; }
  .key.black rect { fill: var(--ink); stroke: var(--ink); stroke-width: 1; }
  .key.white.held rect { fill: var(--highlight); }
  .key.black.held rect { fill: var(--highlight); stroke: var(--ink); stroke-width: 2; }
  .key:focus rect { stroke: var(--accent); stroke-width: 3; }
  .key text { pointer-events: none; }
  .key.white text { fill: var(--muted); font-size: 10px; }
  .key.black text { fill: var(--paper); font-size: 8px; }
  .key.black.held text { fill: var(--ink); }
  .row { display: flex; align-items: center; gap: 10px; margin: 4px 0 0; min-height: 30px; flex-wrap: wrap; }
  button { font: inherit; color: var(--ink); background: #fff; border: 1px solid var(--axis); border-radius: 6px; padding: 4px 14px; cursor: pointer; min-height: 30px; }
  button:hover:not(:disabled) { border-color: var(--ink); }
  button:disabled { opacity: 0.45; cursor: default; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
  #readout { color: var(--ink); font-size: 14px; }
</style>
</head>
<body>
<svg id="strip" role="group" aria-label="Piano keys, C4 to C5. Click one note, then a second note."></svg>
<div class="row"><button id="play" type="button" disabled>Play</button><span id="readout" role="status" aria-live="polite"></span></div>
<script>
(function () {
  "use strict";
  // GADGET 1 of 2026-11-13-1215: "two notes, and the distance between them". 13 keys C4 to C5, a Play button and a one-line readout. Nothing else.
  // ---- pure functions (no DOM; the node harness exports them) ------------------------------------------------------------------------------------------
  var LOW = 60, HIGH = 72, A4_HZ = 440, GAP = 0.6, TOGETHER_AT = 1.5, NOTE_LEN = 0.9;          // C4..C5; the second note 0.6 s after the first (the big widget's gap), then both together
  var NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
  function midiToName(m) { return NAMES[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1); }
  function isBlack(m) { return NAMES[((m % 12) + 12) % 12].length === 2; }
  function midiToHz(m) { return A4_HZ * Math.pow(2, (m - 69) / 12); }                         // equal temperament: this gadget has no tuning choice
  function halfSteps(a, b) { return Math.abs(b - a); }
  // The readout, as one line. Two keys: "4 half steps" ("1 half step", "0 half steps: the same note", "12 half steps: an octave").
  function readout(state) {
    if (state.a === null) return "Click a key, then a second key.";
    if (state.b === null) return "Now click a second key.";
    var n = halfSteps(state.a, state.b);
    if (n === 0) return "0 half steps: the same note";
    if (n === 12) return "12 half steps: an octave";
    return n + (n === 1 ? " half step" : " half steps");
  }
  // The selection state machine. One key chosen: clicking it again clears it, clicking another chooses the second. Two chosen: any click starts over with that key as the first.
  function select(state, m) {
    if (state.a === null) return { a: m, b: null };
    if (state.b === null) return m === state.a ? { a: null, b: null } : { a: state.a, b: m };
    return { a: m, b: null };
  }
  // What Play sounds: the lower note, then the higher one 0.6 s later, then both together. Nothing plays until two keys are chosen.
  function planPlay(state) {
    if (state.a === null || state.b === null) return [];
    var lo = Math.min(state.a, state.b), hi = Math.max(state.a, state.b);
    return [lo, hi].map(function (m, i) { return { midi: m, hz: midiToHz(m), when: i * GAP, dur: NOTE_LEN }; })
      .concat([lo, hi].map(function (m) { return { midi: m, hz: midiToHz(m), when: TOGETHER_AT, dur: NOTE_LEN * 1.4 }; }));
  }
  // ==== piano voice BEGIN (2026-11-13-1214-1) ====================================================================================================
  // The SAME block is in piano_voice_demo.html, piano_keyboard.html and interval_widget.html (each gadget is one self-contained file, so it is copied; a test pins the three identical).
  // A piano-like note by ADDITIVE SYNTHESIS: 10 partials per string with a slight inharmonic stretch (stiff strings: partial n at n*f*sqrt(1 + B*n*n), B from about 0.0003 in the treble to about 0.001
  // in the bass, normalised so the fundamental is exactly f), each partial with its own decay (higher ones die faster, bass notes ring longer), TWO strings a couple of cents apart (the natural beating), a few
  // ms of band-passed hammer noise scaled by velocity, a low-pass whose cutoff rises with velocity and falls with pitch, a quick release at the end of the note, and a soft limiter on the shared bus so a chord does not clip.
  // `when` is an absolute time on the context's clock; `hz` is the pitch the gadget's tuning asks for (the pitch-dependent parts use the note number it is nearest to). Per note: 20 oscillators (string 1's partials 1..10, then string 2's) and no other source but the hammer noise.
  var PIANO_PARTIALS = 10;
  var PIANO_STRINGS = 2;
  var PIANO_OSC_PER_NOTE = PIANO_PARTIALS * PIANO_STRINGS;
  var PIANO_DETUNE_CENTS = [0, 2];                     // string 1 true, string 2 two cents sharp
  var PIANO_ATTACK = 0.004;                            // s, the rise of the note
  var PIANO_RELEASE = 0.02;                            // s, the end of a note is a quick fade, never a cut
  function pianoClamp(x, lo, hi) { return Math.min(hi, Math.max(lo, x)); }
  function pianoMidi(hz) { return 69 + 12 * Math.log(hz / 440) / Math.LN2; }
  function pianoB(midi) { return 0.0003 + 0.0007 * pianoClamp((84 - midi) / 60, 0, 1); }                               // C6 and above 0.0003, rising toward the bass (C2 about 0.00086, C1 and below 0.001)
  function pianoPartialHz(f, n, B) { return n * f * Math.sqrt((1 + B * n * n) / (1 + B)); }                            // n = 1 is exactly f
  function pianoDecay(midi, n) { return pianoClamp(4.2 - 0.045 * (midi - 36), 0.7, 4.2) / (1 + 0.8 * (n - 1)); }       // the time constant (s) of partial n: the bass rings longer, each higher partial dies faster
  function pianoPartialAmp(n) { return 1 / Math.pow(n, 1.1); }                                                         // the spectrum falls off gently: a hammer-struck string keeps its upper partials
  function pianoCutoff(midi, velocity) { return pianoClamp(1800 + 7200 * velocity - 35 * (midi - 60), 500, 12000); }  // Hz: harder = brighter, higher = darker
  var pianoNoiseCache = null, pianoBusCache = null;
  function pianoNoiseBuffer(ctx) {
    if (!pianoNoiseCache || pianoNoiseCache.ctx !== ctx) {
      var n = Math.max(1, Math.round(ctx.sampleRate * 0.012)), b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0), seed = 1;
      for (var i = 0; i < n; i++) { seed = (seed * 16807) % 2147483647; d[i] = seed / 1073741823.5 - 1; }        // a fixed noise burst: the same every time
      pianoNoiseCache = { ctx: ctx, buffer: b };
    }
    return pianoNoiseCache.buffer;
  }
  function pianoBus(ctx) {                                                                                             // the shared output: a soft limiter, so a four-note chord does not clip
    if (!pianoBusCache || pianoBusCache.ctx !== ctx) {
      var comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -10; comp.knee.value = 8; comp.ratio.value = 12; comp.attack.value = 0.002; comp.release.value = 0.12;
      comp.connect(ctx.destination);
      pianoBusCache = { ctx: ctx, node: comp };
    }
    return pianoBusCache.node;
  }
  function pianoVoice(ctx, destination, hz, when, length, velocity, level) {
    var t0 = when, end = when + Math.max(0.05, length), midi = pianoMidi(hz), B = pianoB(midi);
    var v = pianoClamp(velocity == null ? 0.8 : velocity, 0.05, 1), peak = pianoClamp(level == null ? 1 : level, 0, 2) * (0.1 + 0.2 * v);
    var sumA = 0, n, s;
    for (n = 1; n <= PIANO_PARTIALS; n++) sumA += pianoPartialAmp(n);
    var out = ctx.createGain(), lp = ctx.createBiquadFilter();
    lp.type = "lowpass"; lp.frequency.value = pianoCutoff(midi, v); lp.Q.value = 0.7;
    out.gain.setValueAtTime(0.0001, t0);
    out.gain.linearRampToValueAtTime(peak, t0 + PIANO_ATTACK);
    out.gain.setValueAtTime(peak, Math.max(end, t0 + PIANO_ATTACK + 0.001));
    out.gain.setTargetAtTime(0, Math.max(end, t0 + PIANO_ATTACK + 0.001), PIANO_RELEASE / 4);                          // the quick release (about 20 ms to silence)
    out.gain.setValueAtTime(0, Math.max(end, t0 + PIANO_ATTACK + 0.001) + 0.15);
    lp.connect(out); out.connect(destination);
    for (s = 0; s < PIANO_STRINGS; s++) {
      var fs = hz * Math.pow(2, PIANO_DETUNE_CENTS[s] / 1200);
      for (n = 1; n <= PIANO_PARTIALS; n++) {
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.type = "sine"; o.frequency.value = pianoPartialHz(fs, n, B);
        g.gain.setValueAtTime(pianoPartialAmp(n) / sumA / PIANO_STRINGS, t0);
        g.gain.setTargetAtTime(0, t0 + PIANO_ATTACK, pianoDecay(midi, n));
        o.connect(g); g.connect(lp);
        o.start(t0); o.stop(Math.max(end, t0 + PIANO_ATTACK + 0.001) + 0.2);
      }
    }
    var ns = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), ng = ctx.createGain();                          // the hammer: a few ms of band-passed noise, harder = louder
    ns.buffer = pianoNoiseBuffer(ctx);
    bp.type = "bandpass"; bp.frequency.value = pianoClamp(1200 + 2400 * v + 12 * (midi - 60), 600, 6000); bp.Q.value = 1;
    ng.gain.setValueAtTime(0.2 * v * v, t0); ng.gain.setTargetAtTime(0, t0 + 0.001, 0.003);
    ns.connect(bp); bp.connect(ng); ng.connect(lp);
    ns.start(t0); ns.stop(t0 + 0.02);
  }
  // ==== piano voice END ===========================================================================================================================

  if (typeof document === "undefined") {           // node test harness
    module.exports = { LOW: LOW, HIGH: HIGH, GAP: GAP, TOGETHER_AT: TOGETHER_AT, midiToName: midiToName, isBlack: isBlack, midiToHz: midiToHz, halfSteps: halfSteps, readout: readout, select: select, planPlay: planPlay, pianoVoice: pianoVoice, pianoBus: pianoBus, PIANO_OSC_PER_NOTE: PIANO_OSC_PER_NOTE };
    return;
  }
  // ---- the page ---------------------------------------------------------------------------------------------------------------------------------------
  var NS = "http://www.w3.org/2000/svg";
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, attrs, parent) { var n = document.createElementNS(NS, tag); for (var a in attrs) n.setAttribute(a, attrs[a]); if (parent) parent.appendChild(n); return n; }
  var WW = 32, WH = 78, BW = 19, BH = 48, PAD = 1;
  var keys = {}, whites = [], blacks = [], wi = 0, m;
  for (m = LOW; m <= HIGH; m++) { if (isBlack(m)) blacks.push({ m: m, x: PAD + wi * WW - BW / 2 }); else { whites.push({ m: m, x: PAD + wi * WW }); wi++; } }
  var svg = $("strip");
  svg.setAttribute("viewBox", "0 0 " + (wi * WW + 2 * PAD) + " " + (WH + 2 * PAD));
  function make(k, black) {
    var g = el("g", { "class": "key " + (black ? "black" : "white"), "data-midi": k.m, tabindex: "0", role: "button", "aria-pressed": "false", "aria-label": midiToName(k.m) + ", note number " + k.m }, svg);
    el("rect", { x: k.x, y: PAD, width: black ? BW : WW, height: black ? BH : WH, rx: black ? 2 : 3 }, g);
    var t = el("text", { x: k.x + (black ? BW : WW) / 2, y: black ? BH - 5 : WH - 6, "text-anchor": "middle" }, g); t.textContent = midiToName(k.m);
    keys[k.m] = g;
    g.addEventListener("click", function () { choose(k.m); try { g.focus({ preventScroll: true }); } catch (_) {} });
    g.addEventListener("keydown", function (e) { if (e.altKey || e.ctrlKey || e.metaKey) return; if (e.key === "Enter" || e.key === " ") { e.preventDefault(); choose(k.m); } });
  }
  whites.forEach(function (k) { make(k, false); });
  blacks.forEach(function (k) { make(k, true); });                 // black keys last, so they are on top
  var state = { a: null, b: null };
  function render() {
    for (var k in keys) { var on = +k === state.a || +k === state.b; keys[k].classList.toggle("held", on); keys[k].setAttribute("aria-pressed", on ? "true" : "false"); }
    $("readout").textContent = readout(state);
    $("play").disabled = state.a === null || state.b === null;
  }
  function choose(m) { state = select(state, m); render(); }            // choosing a key never plays
  // ---- sound: the piano voice (the block above, the same as the other gadgets) ------------------------------------------------------------------------------
  var ctx = null;
  function audio() {
    if (!ctx) { var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; ctx = new AC(); }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  $("play").addEventListener("click", function () {
    var plan = planPlay(state); if (!plan.length) return;
    var c = audio(); if (!c) return;
    plan.forEach(function (n) { pianoVoice(c, pianoBus(c), n.hz, c.currentTime + n.when, n.dur, 0.8, n.when === TOGETHER_AT ? 0.7 : 1); });
  });
  render();
})();
</script>
</body>
</html>
