<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guitar fretboard</title>
<style>
  /* Palette: forge_music_theory_style_guide.md, "Color scheme" (revised 2026-09-25).
     Same values as monochord.html and piano_keyboard.html. */
  :root {
    --paper: #FDFCFA;   /* Vault Background (Paper) */
    --ink: #2B2B2B;     /* Title Text */
    --muted: #555555;   /* Body Text / Plot Labels */
    --axis: #666666;    /* Axis Lines / Strong Ticks */
    --grid: #F2F2EC;    /* Faint Gridlines / Fine Ticks */
    --left: #2B2B2B;    /* Primary Signal / Input 1 */
    --right: #B39373;   /* Secondary Signal / Input 2 */
    --right-text: #7A644E; /* --right darkened for legible TEXT on the paper background */
    --derived: #64748B; /* Combined / Derived Series */
    --highlight: #F8C54B; /* Highlight: a held position */
    --accent: #D72027;  /* Primary Accent: keyboard focus */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--muted);
    padding: 8px 10px 14px;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 700px; margin: 0 auto; }
  /* Thirteen positions per string do not fit a phone at a tappable size, so the
     fretboard keeps a minimum width and scrolls sideways there. */
  .scroller { overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; }
  svg { display: block; width: 100%; min-width: 600px; height: auto; user-select: none; -webkit-user-select: none; }
  .pt { cursor: pointer; }
  .pt:focus { outline: none; }
  /* Each position is a small dot; hovering, focusing or holding it swaps in a
     disc that carries the note name, so 78 labels never clutter the board. */
  .pt .dot { fill: var(--axis); opacity: 0.35; }
  .pt .disc { fill: #FFFFFF; stroke: var(--axis); stroke-width: 1; opacity: 0; }
  .pt text { fill: var(--ink); font-size: 9px; opacity: 0; pointer-events: none; }
  .pt:hover .disc, .pt:hover text { opacity: 1; }
  .pt:hover .dot { opacity: 0; }
  .pt.held .disc { opacity: 1; fill: var(--highlight); stroke: var(--ink); stroke-width: 1.5; }
  .pt.held text { opacity: 1; }
  .pt.held .dot { opacity: 0; }
  /* Plain :focus (not :focus-visible): a mouse click focuses the point too, and
     :focus-visible would hide the ring exactly when the user clicked it. */
  .pt:focus .disc { opacity: 1; stroke: var(--accent); stroke-width: 3; }
  .pt:focus text { opacity: 1; }
  .pt:focus .dot { opacity: 0; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 10px; }
  button {
    font: inherit; font-size: 13px; color: var(--ink);
    background: #fff; border: 1px solid var(--axis); border-radius: 6px;
    padding: 8px 12px; cursor: pointer; min-height: 40px;
  }
  button:hover { border-color: var(--ink); }
  button:active { background: var(--grid); }
  button.left  { border-color: var(--left);  color: var(--left); }
  /* Role shows in COLOR only: same border weight, radius and text weight on every button.
     The Secondary-Signal tan (--right) is a line/fill color and is only 2.9:1 against white as a
     1px border, so it read as a thinner, washed-out border; use its text-safe darker shade. */
  button.right { border-color: var(--right-text); color: var(--right-text); }
  button.both  { border-color: var(--derived); color: var(--derived); }
</style>
</head>
<body>
<div class="wrap">

<div class="scroller"><svg id="svg" role="group" aria-label="Guitar fretboard, standard tuning, frets 0 to 12. Click a position to hold it, then play the held notes. Arrow keys move between positions."></svg></div>

<div class="controls">
  <button class="both"  id="bT" title="All held notes at once, as a chord">Play together</button>
  <button class="left"  id="bU" title="Held notes one at a time, lowest to highest">Play ascending</button>
  <button class="right" id="bD" title="Held notes one at a time, highest to lowest">Play descending</button>
  <button id="bC" title="Release every held position">Clear</button>
</div>

</div>
<script>
(function () {
  "use strict";

  // --- pure math (no DOM) ------------------------------------------------
  // Standard concert pitch, 12-tone equal temperament: A4 (MIDI 69) = 440 Hz and
  // every semitone (= one fret) multiplies the frequency by 2^(1/12).
  var A4_HZ = 440;
  // Standard tuning, low string to high (MIDI numbers): E2 A2 D3 G3 B3 E4.
  var TUNING = [40, 45, 50, 55, 59, 64];
  var FRETS = 12;                                // frets 0 (open) .. 12
  var STAGGER = 0.2;                             // seconds between arpeggio onsets
  var NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
  function midiToHz(m) { return A4_HZ * Math.pow(2, (m - 69) / 12); }
  function midiToName(m) { return NAMES[m % 12] + (Math.floor(m / 12) - 1); }   // scientific pitch notation
  // Fret n on a string sounds n semitones above the open string.
  function midiAt(s, f) { return TUNING[s] + f; }
  function posKey(s, f) { return s + ":" + f; }
  function parseKey(k) { var p = k.split(":"); return { s: +p[0], f: +p[1] }; }
  // A held position set (keys "string:fret") in ascending pitch order; equal
  // pitches (e.g. open B string and fret 4 of the G string) keep low string first.
  function sortedHeld(held) {
    return Array.from(held).map(parseKey).sort(function (a, b) {
      return (midiAt(a.s, a.f) - midiAt(b.s, b.f)) || (a.s - b.s);
    });
  }
  // What to sound for a held set: [{s, f, midi, hz, when}] with `when` in seconds
  // from the button press. An empty set gives an empty plan, i.e. nothing happens.
  function planPlay(held, mode) {
    var ps = sortedHeld(held);
    if (mode === "down") ps.reverse();
    return ps.map(function (p, i) {
      var m = midiAt(p.s, p.f);
      return { s: p.s, f: p.f, midi: m, hz: midiToHz(m), when: mode === "together" ? 0 : i * STAGGER };
    });
  }
  // --- end pure math -----------------------------------------------------

  if (typeof document === "undefined") {           // node test harness
    module.exports = { A4_HZ: A4_HZ, TUNING: TUNING, FRETS: FRETS, STAGGER: STAGGER, midiToHz: midiToHz, midiToName: midiToName, midiAt: midiAt, posKey: posKey, planPlay: planPlay };
    return;
  }

  var NS = "http://www.w3.org/2000/svg";
  var $ = function (id) { return document.getElementById(id); };
  var svg = $("svg"), held = new Set(), pts = {};
  var NS_ = TUNING.length;

  // Geometry (viewBox units). Frets are spaced like a real neck: fret n sits at
  // NUT + L * (1 - 2^(-n/12)), with L chosen so fret 12 (half the scale) is at NUT + BOARD.
  var NUT = 72, BOARD = 560, L = 2 * BOARD, TOP = 40, GAP = 28, W = 650, H = 214;
  function fretX(n) { return NUT + L * (1 - Math.pow(2, -n / 12)); }
  // The clickable position for fret n: the middle of its cell, or (open string) just left of the nut.
  function posX(f) { return f === 0 ? NUT - 22 : (fretX(f - 1) + fretX(f)) / 2; }
  function stringY(s) { return TOP + (NS_ - 1 - s) * GAP; }     // high string on top, like tablature
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);

  function el(tag, attrs, parent) {
    var n = document.createElementNS(NS, tag);
    for (var a in attrs) n.setAttribute(a, attrs[a]);
    if (parent) parent.appendChild(n);
    return n;
  }

  // Static drawing first (under the clickable positions).
  var MARKS = [0, 3, 5, 7, 9, 12];
  MARKS.forEach(function (f) {           // fret numbers, top, in the Axis color
    var t = el("text", { x: posX(f), y: 16, "text-anchor": "middle", "font-size": 11, fill: "#666666" }, svg);
    t.textContent = f;
  });
  [3, 5, 7, 9].forEach(function (f) {    // single inlay dots
    el("circle", { cx: posX(f), cy: (stringY(2) + stringY(3)) / 2, r: 5, fill: "#F2F2EC" }, svg);
  });
  [1.5, 3.5].forEach(function (i) {      // double inlay at the octave
    el("circle", { cx: posX(12), cy: TOP + i * GAP, r: 5, fill: "#F2F2EC" }, svg);
  });
  for (var f = 1; f <= FRETS; f++)       // fret wires
    el("line", { x1: fretX(f), y1: TOP - 10, x2: fretX(f), y2: stringY(0) + 10, stroke: "#A69B91", "stroke-width": 1 }, svg);
  el("line", { x1: NUT, y1: TOP - 10, x2: NUT, y2: stringY(0) + 10, stroke: "#2B2B2B", "stroke-width": 4 }, svg);   // the nut
  for (var s = 0; s < NS_; s++) {        // strings: lower ones are thicker
    el("line", { x1: NUT, y1: stringY(s), x2: NUT + BOARD, y2: stringY(s), stroke: "#666666", "stroke-width": 2.2 - s * 0.28 }, svg);
    var lb = el("text", { x: 34, y: stringY(s) + 4, "text-anchor": "end", "font-size": 11, fill: "#555555" }, svg);
    lb.textContent = midiToName(TUNING[s]);
  }

  // Roving tabindex: 78 Tab stops would be unusable, so the fretboard is a single
  // Tab stop and the arrow keys move between positions.
  var cur = { s: 0, f: 0 };
  function setCur(s, f, focus) {
    pts[posKey(cur.s, cur.f)].setAttribute("tabindex", "-1");
    cur = { s: s, f: f };
    var g = pts[posKey(s, f)];
    g.setAttribute("tabindex", "0");
    if (focus) { try { g.focus({ preventScroll: false }); } catch (_) {} }
  }
  function makePoint(s, f) {
    var m = midiAt(s, f), x = posX(f), y = stringY(s), key = posKey(s, f);
    var g = el("g", { "class": "pt", tabindex: "-1", role: "button", "aria-pressed": "false",
                      "aria-label": midiToName(m) + ", string " + (s + 1) + ", fret " + f }, svg);
    el("circle", { "class": "disc", cx: x, cy: y, r: 12 }, g);
    el("circle", { "class": "dot", cx: x, cy: y, r: 3.5 }, g);
    // A generous invisible hit target: the whole fret cell, one string row tall.
    var half = f === 0 ? 14 : (fretX(f) - fretX(f - 1)) / 2 - 1;
    el("rect", { x: x - half, y: y - 13, width: half * 2, height: 26, fill: "transparent" }, g);
    var t = el("text", { x: x, y: y + 3, "text-anchor": "middle" }, g);
    t.textContent = midiToName(m);
    pts[key] = g;
    return g;
  }
  for (s = 0; s < NS_; s++) for (f = 0; f <= FRETS; f++) makePoint(s, f);
  Object.keys(pts).forEach(function (key) {
    var p = parseKey(key), g = pts[key];
    g.addEventListener("click", function () { setCur(p.s, p.f, false); toggle(key); try { g.focus({ preventScroll: true }); } catch (_) {} });
    g.addEventListener("focus", function () { if (cur.s !== p.s || cur.f !== p.f) setCur(p.s, p.f, false); });
    g.addEventListener("keydown", function (e) {
      if (e.altKey || e.ctrlKey || e.metaKey) return;
      var ns = p.s, nf = p.f;
      if (e.key === "Enter" || e.key === " ") { toggle(key); e.preventDefault(); return; }   // Space would otherwise scroll
      if (e.key === "ArrowRight") nf = Math.min(FRETS, p.f + 1);
      else if (e.key === "ArrowLeft") nf = Math.max(0, p.f - 1);
      else if (e.key === "ArrowUp") ns = Math.min(NS_ - 1, p.s + 1);      // toward the high string
      else if (e.key === "ArrowDown") ns = Math.max(0, p.s - 1);
      else return;
      e.preventDefault();
      setCur(ns, nf, true);
    });
  });
  pts[posKey(0, 0)].setAttribute("tabindex", "0");

  function toggle(key) {
    if (held.has(key)) held.delete(key); else held.add(key);
    render();
  }
  function render() {
    for (var k in pts) {
      var on = held.has(k);
      pts[k].classList.toggle("held", on);
      pts[k].setAttribute("aria-pressed", on ? "true" : "false");
    }
  }

  // ==== plucked voice BEGIN (2026-11-15-1221) =====================================================================================================
  // The SAME block is in guitar_fretboard.html, lute_fretboard.html, mandolin_fretboard.html, monochord.html and plucked_voice_demo.html (each gadget is one self-contained file, so it is copied; a test pins them identical).
  // A plucked string by MODAL SYNTHESIS: the string is a sum of its partials, each a sine that decays on its own. The model is a physical one: a string plucked at a fraction `pos` of its length has partial n at the amplitude
  // |sin(n*pi*pos)| / n^1.2 (a pluck near the bridge is bright, one near the middle is hollow), stiffness stretches the partials a little (n*f*sqrt(1 + B*n*n)), and the string's damping makes each HIGHER partial die faster
  // (T60 of partial n = T60 of the fundamental / (1 + damp*(n-1)^1.3)), so the tone starts bright and darkens as it rings, which is what a Karplus-Strong loop does too. It is built from sines because a DelayNode feedback loop in Web Audio always adds one render quantum (128 samples) to its delay (measured in Chrome: a loop set for 220 Hz sounds at 134 Hz), so a Karplus-Strong string can be tuned
  // only below about 344 Hz at 44.1 kHz, and the high courses of a mandolin or a guitar would sound a wrong note. `kind` picks the
  // instrument: guitar, lute (softer, shorter, a touch of body resonance), mandolin (bright and short, each COURSE is TWO strings 5 cents apart, so the beating is natural: the gadget sounds one note per course and the voice makes the
  // pair), monochord (one long string, a clear fundamental). `when` is an absolute time on the context's clock; `hz` is the pitch the gadget's tuning asks for; `velocity` 0..1 sets the brightness AND the level; `level` (optional,
  // default 1) scales the note so that a strummed chord does not clip (the gadgets pass 1/sqrt(notes)); the note is allowed to ring for `length` seconds, then a quick mute (about 40 ms) ends it. Nothing is scheduled before `when`.
  // `gain` is each kind's loudness trim (the mandolin's two detuned strings add less than one string would). Per note: one oscillator per partial per string (at most 24), a few ms of band-passed noise for the pick, a low-pass, and for the lute a peaking filter for the body.
  var PLUCK_KINDS = {
    guitar:    { gain: 1.2, partials: 14, detune: [0],        t60: 2.8, damp: 0.55, pos: 0.18, B: 0.00004, noise: 0.16, cutoff: [2600, 9500],  body: null },
    lute:      { gain: 1.0, partials: 10, detune: [0],        t60: 1.6, damp: 0.90, pos: 0.22, B: 0.00008, noise: 0.10, cutoff: [1500, 5200],  body: { hz: 240, q: 3, gain: 5 } },
    mandolin:  { gain: 1.7, partials: 12, detune: [-2.5, 2.5], t60: 1.1, damp: 0.70, pos: 0.12, B: 0.00005, noise: 0.18, cutoff: [3200, 11500], body: null },
    monochord: { gain: 1.0, partials: 16, detune: [0],        t60: 6.0, damp: 0.25, pos: 0.30, B: 0.00001, noise: 0.08, cutoff: [2600, 9500],  body: null }
  };
  var PLUCK_ATTACK = 0.002;                            // s, the rise of the note: a pluck is almost instant
  var PLUCK_RELEASE = 0.04;                            // s, the mute at the end of a note is a quick fade, never a cut
  var PLUCK_MAX_OSC = 24;                              // oscillators per note, the most any kind uses
  function pluckClamp(x, lo, hi) { return Math.min(hi, Math.max(lo, x)); }
  function pluckKind(kind) { return PLUCK_KINDS.hasOwnProperty(kind) ? PLUCK_KINDS[kind] : PLUCK_KINDS.guitar; }
  function pluckPartialCount(k, hz, sampleRate) { return Math.max(1, Math.min(k.partials, Math.floor(0.45 * (sampleRate || 44100) / hz))); }   // never a partial near the Nyquist limit
  function pluckPartialHz(f, n, B) { return n * f * Math.sqrt((1 + B * n * n) / (1 + B)); }                                                  // n = 1 is exactly f
  function pluckPartialAmp(k, n) { return (0.15 + Math.abs(Math.sin(n * Math.PI * k.pos))) / 1.15 / Math.pow(n, 1.2); }                         // the pluck position's comb, with a floor so no partial is exactly silent
  function pluckT60(k, hz, n) { return k.t60 * pluckClamp(Math.pow(220 / hz, 0.35), 0.4, 2) / (1 + k.damp * Math.pow(n - 1, 1.3)); }           // seconds to fall 60 dB: lower strings ring longer, each higher partial dies faster
  function pluckCutoff(k, hz, velocity) { return pluckClamp((k.cutoff[0] + (k.cutoff[1] - k.cutoff[0]) * velocity) * (1 + 0.15 * Math.log(hz / 220) / Math.LN2), 600, 16000); }   // Hz: harder = brighter
  function pluckStringHz(f, cents) { return f * Math.pow(2, cents / 1200); }
  var pluckNoiseCache = null, pluckBusCache = null;
  function pluckNoiseBuffer(ctx) {
    if (!pluckNoiseCache || pluckNoiseCache.ctx !== ctx) {
      var n = Math.max(1, Math.round(ctx.sampleRate * 0.015)), b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0), seed = 7;
      for (var i = 0; i < n; i++) { seed = (seed * 16807) % 2147483647; d[i] = seed / 1073741823.5 - 1; }            // a fixed noise burst: the same every time
      pluckNoiseCache = { ctx: ctx, buffer: b };
    }
    return pluckNoiseCache.buffer;
  }
  function pluckedBus(ctx) {                                                                                         // the shared output: a soft limiter, so a strummed chord does not clip
    if (!pluckBusCache || pluckBusCache.ctx !== ctx) {
      var comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -10; comp.knee.value = 8; comp.ratio.value = 12; comp.attack.value = 0.002; comp.release.value = 0.12;
      comp.connect(ctx.destination);
      pluckBusCache = { ctx: ctx, node: comp };
    }
    return pluckBusCache.node;
  }
  function pluckedVoice(ctx, destination, hz, when, length, velocity, kind, level) {
    if (!isFinite(hz) || hz <= 0) return;
    var k = pluckKind(kind), t0 = when, end = Math.max(when + Math.max(0.05, length), when + PLUCK_ATTACK + 0.001);
    var v = pluckClamp(velocity == null ? 0.8 : velocity, 0.05, 1), peak = pluckClamp(level == null ? 1 : level, 0, 2) * (0.12 + 0.26 * v) * k.gain;
    var N = pluckPartialCount(k, hz, ctx.sampleRate), strings = k.detune.length, sumA = 0, n, s;
    for (n = 1; n <= N; n++) sumA += pluckPartialAmp(k, n);
    var out = ctx.createGain(), lp = ctx.createBiquadFilter(), tail = lp;
    lp.type = "lowpass"; lp.frequency.value = pluckCutoff(k, hz, v); lp.Q.value = 0.7;
    if (k.body) { var body = ctx.createBiquadFilter(); body.type = "peaking"; body.frequency.value = k.body.hz; body.Q.value = k.body.q; body.gain.value = k.body.gain; lp.connect(body); tail = body; }
    out.gain.setValueAtTime(0.0001, t0);
    out.gain.linearRampToValueAtTime(peak, t0 + PLUCK_ATTACK);
    out.gain.setValueAtTime(peak, end);
    out.gain.setTargetAtTime(0, end, PLUCK_RELEASE / 4);                                                             // the mute (about 40 ms to silence)
    out.gain.setValueAtTime(0, end + 0.25);
    tail.connect(out); out.connect(destination);
    for (s = 0; s < strings; s++) {
      var fs = pluckStringHz(hz, k.detune[s]);
      for (n = 1; n <= N; n++) {
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.type = "sine"; o.frequency.value = pluckPartialHz(fs, n, k.B);
        g.gain.setValueAtTime(pluckPartialAmp(k, n) / sumA / strings, t0);
        g.gain.setTargetAtTime(0, t0 + PLUCK_ATTACK, pluckT60(k, hz, n) / 6.9);                                      // exp(-t/tau) falls 60 dB at 6.9 tau
        o.connect(g); g.connect(lp);
        o.start(t0); o.stop(end + 0.3);
      }
    }
    var ns = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), ng = ctx.createGain();                         // the pick: a few ms of band-passed noise, harder = louder
    ns.buffer = pluckNoiseBuffer(ctx);
    bp.type = "bandpass"; bp.frequency.value = pluckClamp(1800 + 3000 * v + 0.5 * hz, 900, 7000); bp.Q.value = 0.9;
    ng.gain.setValueAtTime(k.noise * v * v, t0); ng.gain.setTargetAtTime(0, t0 + 0.001, 0.004);
    ns.connect(bp); bp.connect(ng); ng.connect(lp);
    ns.start(t0); ns.stop(t0 + 0.03);
  }
  // ==== plucked voice END =========================================================================================================================

  // --- Web Audio: the plucked voice (the block above: modal synthesis of a string, a soft limiter) ---------------------------------
  var ctx = null;
  function audio() {
    if (!ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
    }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function pluck(hz, when, peak) {
    var c = audio(); if (!c) return;
    pluckedVoice(c, pluckedBus(c), hz, c.currentTime + (when || 0), 4.4, 0.8, "guitar", peak / 0.28);   // peak 0.28 is one note; a chord passes less, so the level scales the same way as before
  }
  function play(mode) {
    var plan = planPlay(held, mode);
    if (!plan.length) return;                                // nothing held: do nothing
    // Chords stack partials, so scale each voice down to keep the sum from clipping.
    var peak = 0.28 / Math.sqrt(mode === "together" ? plan.length : 1);
    plan.forEach(function (n) { pluck(n.hz, n.when, peak); });
  }
  $("bT").addEventListener("click", function () { play("together"); });
  $("bU").addEventListener("click", function () { play("up"); });
  $("bD").addEventListener("click", function () { play("down"); });
  $("bC").addEventListener("click", function () { held.clear(); render(); });

  render();
})();
</script>
</body>
</html>
