@@HEAD@@
@@RING_CSS@@
  #counts { gap: 4px; }
  #counts button { padding: 4px 0; min-width: 31px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
<div id="prompt" aria-live="off"></div>
<div class="row" id="counts" role="group" aria-label="How many sharps or flats?"></div>
<div class="row" id="typedrow"><label for="typed">Or type it</label><input id="typed" type="text" autocomplete="off" maxlength="20" aria-label="Type the count, for example 3 sharps or 2 flats"><button type="button" id="typedgo">Enter</button></div>
<svg id="strip" role="img" aria-label="Piano keys" aria-hidden="true" style="display:none"></svg>
<svg id="staff" role="img" aria-label="Treble staff"></svg>
<div class="wheelbox"><svg id="wheel" role="group" aria-label="The circle of fifths: major keys on the outer ring, their relative minors on the inner ring, and an empty count in each sector"></svg></div>
<div class="row"><button type="button" id="startover">Start over</button></div>
<span id="sr" class="sr" role="status" aria-live="polite"></span>
</div>
<script>
(function () {
  "use strict";
  // 2026-11-23-1025 - the CIRCLE EXERCISE "add the number of sharps or flats"; 2026-11-24-1038: ONE level, the only goal is to build the circle of fifths. The wheel is complete (both rings) and every sector has an empty count. The lit sector is asked, starting at C: tap or type its count
  // (0 at C, one more sharp per step clockwise up to 6 at F-sharp, one more flat per step counter-clockwise up to 6 at G-flat; 5 flats at D-flat). The staff shows the signature of the lit sector. A wrong count says in words which note changed, or which way round the wheel goes, and costs
  // nothing: there is no limit and no way to give up. The exercise ends when every count is in, and then the whole rule is said in words. Start over clears the counts. It shares its blocks with the other circle gadgets, byte for byte (pinned by a test): the scale core, the scale view and the
  // staff block (the signature drawing of the key to signature exercise), the circle core and the wheel; the ring core and the ring page are shared with the other two ring exercises. Memory only; no sound.
  // ---- pure functions (no DOM; the node harness exports them) ------------------------------------------------------------------------------------------
  @@PRELUDE@@
@@SCALE_CORE@@
@@CIRCLE_CORE@@
@@RING_CORE@@
  // ==== signature counts core BEGIN (2026-11-23-1025, one level 2026-11-24-1038) =================================================================
  // One exercise, pure. The slots are the twelve sectors clockwise from C (0 to 11); each takes a signed count (sharps positive, flats negative: 3 sharps is +3). A right count is free; a wrong count says in words which note changed or which way round the wheel goes and costs nothing;
  // every count in = "done". Six o'clock takes 6 sharps (F-sharp) or 6 flats (G-flat): one key, two names.
  var C3_COUNTS = [0, 1, 2, 3, 4, 5, 6, -1, -2, -3, -4, -5, -6], C3_WORDS = { zero: 0, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7 };
  function c3Start() {
    var counts = [], k;
    for (k = 0; k < 12; k++) counts.push(null);
    return { counts: counts, wrong: [], note: "", say: "", phase: "playing" };
  }
  function c3Next(s) { var i; for (i = 0; i < 12; i++) if (s.counts[i] === null) return i; return -1; }
  // What was typed, as a signed count: "3 sharps", "3#", "3♯", "2 flats", "2b", "0", "none", "three sharps"; null when it is not a count.
  function c3Parse(text) {
    var t = String(text).toLowerCase().replace(/\s+/g, " ").trim(), m, n;
    if (/^(0|zero|none|no sharps or flats|no sharps|no flats)$/.exec(t)) return 0;
    m = /^(\d|zero|one|two|three|four|five|six|seven) ?(♯|#|sharps?|s|♭|b|flats?|f)$/.exec(t); if (!m) return null;
    n = /^\d$/.exec(m[1]) ? Number(m[1]) : C3_WORDS[m[1]];
    return n === 0 ? 0 : /^(♭|b|flats?|f)$/.exec(m[2]) ? -n : n;
  }
  function c3Steps(c) { return c <= 6 ? c : 12 - c; }
  function c3Wrong(s, signed) {
    var c = c3Next(s), steps = c3Steps(c), dir = c <= 6 ? 1 : -1, way = dir > 0 ? "clockwise" : "counter-clockwise", other = dir > 0 ? "counter-clockwise" : "clockwise", thing = dir > 0 ? "sharps" : "flats", otherThing = dir > 0 ? "flats" : "sharps", unit = steps === 1 ? " step " : " steps ";
    if (c === 0) return "C is at the top of the wheel, where the sharps and the flats start: it has none.";
    if (c === 6) return rgSlotName(6) + " is 6 steps from C either way round: 6 sharps clockwise (" + ciName(6, false) + "), or 6 flats counter-clockwise (" + ciName(6, true) + ").";
    if (signed === 0 || (signed > 0) !== (dir > 0)) return ciName(c, false) + " is " + steps + unit + way + " from C: " + way + " the keys add " + thing + ", " + other + " they add " + otherThing + ".";
    return ciChangeText(ciChange(dir > 0 ? c - 1 : c + 1, dir)) + " From C it is " + steps + unit + way + ", and each step " + way + " adds one " + thing.slice(0, -1) + ".";
  }
  function c3Said(c, signed) {
    if (c === 6) return signed < 0 ? ciKeyTitle(6, true) + " has 6 flats; " + ciKeyTitle(6, false) + ", the same key, has 6 sharps." : ciKeyTitle(6, false) + " has 6 sharps; " + ciKeyTitle(6, true) + ", the same key, has 6 flats.";
    return ciKeyTitle(c, false) + " has " + ciCountWords(c, false) + ".";
  }
  function c3Tap(s, signed) {
    if (s.phase !== "playing" || s.wrong.indexOf(signed) >= 0) return { state: s, event: "ignored" };
    var c = c3Next(s);
    if (c === 6 ? Math.abs(signed) === 6 : signed === ciSigned(c, false)) {
      var counts = s.counts.slice(); counts[c] = signed; var ns = rgCopy(s, { counts: counts, wrong: [], note: "", say: c3Said(c, signed) }), done = c3Next(ns) < 0;
      return { state: rgCopy(ns, { phase: done ? "done" : "playing" }), event: done ? "built" : "right" };
    }
    return { state: rgCopy(s, { wrong: s.wrong.concat([signed]), note: c3Wrong(s, signed), say: "" }), event: "wrong" };
  }
  function c3Answer() {
    var sharps = [], flats = [], k;
    for (k = 1; k <= 6; k++) sharps.push(ciName(k, false) + " " + k);
    for (k = 1; k <= 6; k++) flats.push(ciName(12 - k, k === 6) + " " + k);
    return ciName(0, false) + " has no sharps or flats. Clockwise each step adds a sharp: " + sharps.join(", ") + ". Counter-clockwise each step adds a flat: " + flats.join(", ") + ". " + ciName(6, false) + " and " + ciName(6, true) + " are the same key.";
  }
  function c3Prompt(s) {
    if (s.phase === "done") return "Exercise done. " + c3Answer();
    return "Exercise: add the number of sharps or flats. " + rgMajorTitle(c3Next(s)) + " is lit: tap or type its count." + (s.note ? " " + s.note : s.say ? " " + s.say : "");
  }
  function c3Announce(s, event) {
    var start = "Add the number of sharps or flats. C major is lit.";
    if (event === "start") return start;
    if (event === "again") return "Started over. " + start;
    if (event === "right") return "Right. " + s.say + " Next: " + rgMajorTitle(c3Next(s)) + ".";
    if (event === "wrong") return "Not that count. " + s.note;
    if (event === "built") return "Done. " + c3Answer();
    return "";
  }
  // ==== signature counts core END ===================================================================================================================
  if (typeof document === "undefined") {           // node test harness
    module.exports = { BASE: BASE, SC_SCALES: SC_SCALES, scaleNotes: scaleNotes, spellScale: spellScale, scHeptatonic: scHeptatonic, noteName: noteName, noteWords: noteWords,
      CIRCLE_TONICS: CIRCLE_TONICS, ciPc: ciPc, ciMinorPc: ciMinorPc, ciTonic: ciTonic, ciScale: ciScale, ciSigned: ciSigned, ciSignature: ciSignature, ciName: ciName, ciKeyTitle: ciKeyTitle, ciKeyWords: ciKeyWords, ciCountText: ciCountText, ciCountWords: ciCountWords,
      rgShuffle: rgShuffle, rgUp: rgUp, rgIntervalWords: rgIntervalWords, rgSlotName: rgSlotName, rgMinorSlotName: rgMinorSlotName,
      C3_COUNTS: C3_COUNTS, c3Start: c3Start, c3Next: c3Next, c3Parse: c3Parse, c3Tap: c3Tap, c3Answer: c3Answer, c3Prompt: c3Prompt, c3Announce: c3Announce };
    return;
  }
  // ---- the page ---------------------------------------------------------------------------------------------------------------------------------------
  var state = null, soundingForm = null;
@@SCALE_VIEW@@
@@CIRCLE_STAFF@@
@@CIRCLE_WHEEL@@
@@RING_PAGE@@
  var segs = buildWheel($("wheel"), { counts: true, onPick: function () {} }); rgInert(segs); var labels = rgLabels(segs);
  var countBtns = {};
  C3_COUNTS.forEach(function (n) {
    var b = document.createElement("button"); b.type = "button"; b.id = "count-" + (n < 0 ? "f" + -n : n > 0 ? "s" + n : "0"); b.textContent = n === 0 ? "0" : Math.abs(n) + (n > 0 ? "♯" : "♭"); b.setAttribute("aria-label", n === 0 ? "No sharps or flats" : Math.abs(n) + (n > 0 ? " sharp" : " flat") + (Math.abs(n) === 1 ? "" : "s"));
    b.addEventListener("click", function () { apply(c3Tap(state, n)); }); $("counts").appendChild(b); countBtns[n] = b;
  });
  function typedGo() {
    if (state.phase !== "playing") return;
    var n = c3Parse($("typed").value);
    if (n === null) { state = rgCopy(state, { note: "Type a number and sharps or flats, for example 3 sharps.", say: "" }); render("Type a number and sharps or flats, for example 3 sharps."); return; }
    $("typed").value = ""; apply(c3Tap(state, n));
  }
  $("typedgo").addEventListener("click", typedGo);
  $("typed").addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); typedGo(); } });
  function apply(r) { if (r.event === "ignored") return; state = r.state; render(c3Announce(state, r.event)); }
  function render(announce) {
    var done = state.phase === "done", next = c3Next(state), k, cls;
    for (k = 0; k < 12; k++) {
      labels.count(k, state.counts[k] !== null);
      cls = (state.counts[k] !== null ? " found" : " empty") + (!done && k === next ? " lit" : "");
      segs.major[k].setAttribute("class", "seg major" + cls); segs.minor[k].setAttribute("class", "seg minor" + cls);
      segs.major[k].setAttribute("aria-label", ciKeyTitle(k, false) + (state.counts[k] !== null ? ", " + (k === 6 ? "6 sharps or 6 flats" : ciCountWords(k, false)) : ", empty count")); segs.minor[k].setAttribute("aria-label", ciMinorTitle(k, false));
    }
    if (done || next < 0) { ciStaffBase(); staff.setAttribute("aria-label", "Treble staff, empty"); } else ciDrawSignature(next, false, "Treble staff: the key signature of the lit sector (count its sharps or flats)");
    C3_COUNTS.forEach(function (n) { var b = countBtns[n]; b.disabled = done; b.setAttribute("class", state.wrong.indexOf(n) >= 0 ? "wrongbtn" : ""); });
    $("typed").disabled = done; $("typedgo").disabled = done;
    $("prompt").textContent = c3Prompt(state);
    if (announce !== undefined) $("sr").textContent = announce;
  }
  function fresh(event) { state = c3Start(); $("typed").value = ""; render(event ? c3Announce(state, event) : undefined); }
  rgStartOver(function () { fresh("again"); });
  fresh();
})();
</script>
</body>
</html>
