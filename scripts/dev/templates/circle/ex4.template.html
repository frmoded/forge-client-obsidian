@@HEAD@@
@@RING_CSS@@
  #bank { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 3px 0 0; min-height: 64px; align-content: start; }
  #bank button { padding: 4px 0; min-width: 0; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
<div id="prompt" aria-live="off"></div>
<div class="wheelbox"><svg id="wheel" role="group" aria-label="The circle of fifths: twelve slots on the outer ring for the major keys, twelve on the inner ring for their relative minors"></svg></div>
<div id="bank" role="group" aria-label="The twelve major keys: tap the one that goes in the lit slot"></div>
<div class="row"><button type="button" id="startover">Start over</button></div>
<span id="sr" class="sr" role="status" aria-live="polite"></span>
</div>
<script>
(function () {
  "use strict";
  // 2026-11-23-1025 - the CIRCLE EXERCISE "build the outer ring"; 2026-11-24-1038: ONE level, the only goal is to build the circle of fifths. An empty wheel and a bank of the twelve major keys, shuffled. C is given at the top; the next slot clockwise is lit, and you tap the key
  // a fifth above the last one. A wrong key says in words why ("D is a whole step above C, not a fifth") and costs nothing: there is no limit and no way to give up. F-sharp and G-flat are one tile at six o'clock. The exercise ends when the ring is built, and then the ring is said in words.
  // Start over clears the ring and shuffles the tiles again. It shares its blocks with the other circle gadgets, byte for byte (pinned by a test): the scale core, the circle core and the wheel; the ring core and the ring page are shared with the other two ring exercises. Memory only; no sound.
  // ---- pure functions (no DOM; the node harness exports them) ------------------------------------------------------------------------------------------
  @@PRELUDE@@
@@SCALE_CORE@@
@@CIRCLE_CORE@@
@@RING_CORE@@
  // ==== outer ring core BEGIN (2026-11-23-1025, one level 2026-11-24-1038) =======================================================================
  // One exercise, pure. The climb is the twelve sectors clockwise from C (sector 0 to 11); a sector is "placed" when its key is on the wheel (C, given, and the keys you tapped). The tiles are the sector numbers 0..11, shuffled (the one at six o'clock reads F-sharp/G-flat: one tile,
  // one tap). A right tile is free; a wrong tile says why and costs nothing; every slot placed = "done".
  function o1Start(rng) {
    var placed = [], ids = [], k;
    for (k = 0; k < 12; k++) { placed.push(k === 0); ids.push(k); }
    return { placed: placed, bank: rgShuffle(ids, rng), wrong: [], mine: 0, note: "", phase: "playing" };
  }
  function o1Next(s) { var i; for (i = 1; i < 12; i++) if (!s.placed[i]) return i; return -1; }
  function o1Used(s, tile) { return s.placed[tile]; }
  function o1TileName(tile) { return tile === 6 ? rgSlotName(6) : ciName(tile, false); }
  function o1LastName(c) { return o1TileName(c - 1); }                                                              // the key a fifth is measured from: the one placed just before
  function o1WrongWords(s, tile) { var c = o1Next(s); return o1TileName(tile) + " is " + rgIntervalWords(rgUp(c - 1, tile)) + " above " + o1LastName(c) + ", not a fifth."; }
  function o1Tap(s, tile) {
    if (s.phase !== "playing" || o1Used(s, tile) || s.wrong.indexOf(tile) >= 0) return { state: s, event: "ignored" };
    var c = o1Next(s);
    if (tile === c) {
      var placed = s.placed.slice(); placed[c] = true;
      var ns = rgCopy(s, { placed: placed, wrong: [], mine: s.mine + 1, note: "" }), done = o1Next(ns) < 0;
      return { state: rgCopy(ns, { phase: done ? "done" : "playing" }), event: done ? "built" : "right" };
    }
    return { state: rgCopy(s, { wrong: s.wrong.concat([tile]), note: o1WrongWords(s, tile) }), event: "wrong" };
  }
  function o1Answer() { var all = [], k; for (k = 0; k < 12; k++) all.push(rgSlotName(k)); return "The outer ring, clockwise from C: " + all.join(", ") + ". Each key is a fifth above the one before it, and " + ciName(6, false) + " and " + ciName(6, true) + " are one key under two names."; }
  function o1Prompt(s) {
    if (s.phase === "done") return "Exercise done. " + o1Answer();
    return "Exercise: build the outer ring. " + (s.mine === 0 ? "C is given at the top. " : "") + "Tap the key a fifth above " + o1LastName(o1Next(s)) + "." + (s.note ? " " + s.note : "");
  }
  function o1Announce(s, event) {
    var start = "Build the outer ring. C is given at the top. Tap the key a fifth above C.";
    if (event === "start") return start;
    if (event === "again") return "Started over. " + start;
    if (event === "right") return "Right. Next: the key a fifth above " + o1LastName(o1Next(s)) + ".";
    if (event === "wrong") return "Not that one. " + s.note;
    if (event === "built") return "Done. " + o1Answer();
    return "";
  }
  // ==== outer ring core END =========================================================================================================================
  if (typeof document === "undefined") {           // node test harness
    module.exports = { BASE: BASE, SC_SCALES: SC_SCALES, scaleNotes: scaleNotes, spellScale: spellScale, scHeptatonic: scHeptatonic, noteName: noteName, noteWords: noteWords,
      CIRCLE_TONICS: CIRCLE_TONICS, ciPc: ciPc, ciMinorPc: ciMinorPc, ciTonic: ciTonic, ciScale: ciScale, ciSigned: ciSigned, ciSignature: ciSignature, ciName: ciName, ciKeyTitle: ciKeyTitle, ciKeyWords: ciKeyWords,
      rgShuffle: rgShuffle, rgUp: rgUp, rgIntervalWords: rgIntervalWords, rgSlotName: rgSlotName, rgMinorSlotName: rgMinorSlotName,
      o1Start: o1Start, o1Next: o1Next, o1Used: o1Used, o1TileName: o1TileName, o1Tap: o1Tap, o1Answer: o1Answer, o1Prompt: o1Prompt, o1Announce: o1Announce };
    return;
  }
  // ---- the page ---------------------------------------------------------------------------------------------------------------------------------------
  var rng = function () { return (window.__earRandom || Math.random)(); };                                   // an injected random source for tests
  var state = null;
  var NS = "http://www.w3.org/2000/svg";
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, attrs, parent) { var n = document.createElementNS(NS, tag); for (var a in attrs) n.setAttribute(a, attrs[a]); if (parent) parent.appendChild(n); return n; }
@@CIRCLE_WHEEL@@
@@RING_PAGE@@
  var segs = buildWheel($("wheel"), { counts: false, onPick: function () {} }); rgInert(segs); var labels = rgLabels(segs);
  function drawBank() {
    var bank = $("bank"); bank.textContent = "";
    state.bank.forEach(function (id) {
      var b = document.createElement("button"); b.type = "button"; b.id = "tile-" + id; b.textContent = o1TileName(id);
      b.setAttribute("aria-label", id === 6 ? ciWords(6, false) + " or " + ciWords(6, true) + " major" : ciWords(id, false) + " major");
      b.addEventListener("click", function () { apply(o1Tap(state, id)); }); bank.appendChild(b);
    });
  }
  function apply(r) { if (r.event === "ignored") return; state = r.state; render(o1Announce(state, r.event)); }
  function render(announce) {
    var done = state.phase === "done", next = o1Next(state), k, cls;
    for (k = 0; k < 12; k++) {
      labels.name("major", k, state.placed[k] ? "full" : "none"); labels.name("minor", k, "none");
      cls = "seg major" + (state.placed[k] ? " found" : " empty") + (k === 0 ? " tonic" : "") + (!done && k === next ? " lit" : "");
      segs.major[k].setAttribute("class", cls); segs.major[k].setAttribute("aria-label", state.placed[k] ? ciKeyTitle(k, false) : "Empty slot" + (!done && k === next ? ", next" : ""));
      segs.minor[k].setAttribute("class", "seg minor empty"); segs.minor[k].setAttribute("aria-label", "Inner ring, empty");
    }
    state.bank.forEach(function (id) { var b = $("tile-" + id); b.disabled = done || o1Used(state, id); b.setAttribute("class", state.wrong.indexOf(id) >= 0 ? "wrongbtn" : ""); });
    $("prompt").textContent = o1Prompt(state);
    if (announce !== undefined) $("sr").textContent = announce;
  }
  function fresh(event) { state = o1Start(rng); drawBank(); render(event ? o1Announce(state, event) : undefined); }
  rgStartOver(function () { fresh("again"); });
  fresh();
})();
</script>
</body>
</html>
