@@HEAD@@
  .chg { min-height: 34px; margin: 2px 0 0; font-size: 12px; line-height: 16px; color: var(--ink); }
</style>
</head>
<body>
<div class="wrap">
<div class="row"><button type="button" id="ccw">Counter-clockwise</button><button type="button" id="cw">Clockwise</button><button type="button" id="play">Play</button></div>
<div class="wheelbox"><svg id="wheel" role="group" aria-label="The circle of fifths: major keys on the outer ring, their relative minors on the inner ring"></svg></div>
<div id="title" aria-live="off"></div>
<svg id="staff" role="img" aria-label="Treble staff"></svg>
<svg id="strip" role="img" aria-label="Piano keys, C4 to C6"></svg>
<div class="chg" id="change"></div>
<div id="detail"></div>
<span id="sr" class="sr" role="status" aria-live="polite"></span>
</div>
<script>
(function () {
  "use strict";
  // 2026-11-19-0900 - the CIRCLE OF FIFTHS explorer: a wheel of twelve sectors (the major keys on the outer ring, C at the top and clockwise, the relative minors on the inner ring, the number of sharps or flats printed on each sector). Choose a sector: it lights, its key signature
  // shows on the treble staff in the standard order of sharps or flats, a piano strip lights its scale and Play sounds it up. Clockwise and counter-clockwise step one fifth and say what changed (one sharp added or one flat added, and which note); the two neighbours shade softly and
  // the opposite sector shades differently, with how many of the seven notes each shares with the chosen key. Sharp keys go clockwise and flat keys counter-clockwise; the sector at the bottom has both names (click it again to switch the spelling). Nothing happens when the pointer merely rests.
  // It looks like the Scales hub player and shares its blocks, byte for byte (pinned by a test): the scale core and the piano voice; the scale view (strip and staff) too. Memory only: the sandboxed page has no storage.
  // ---- pure functions (no DOM; the node harness exports them) ------------------------------------------------------------------------------------------
  @@PRELUDE@@
@@SCALE_CORE@@
@@CIRCLE_CORE@@
@@PIANO_VOICE@@
  if (typeof document === "undefined") {           // node test harness
    module.exports = { BASE: BASE, SC_SCALES: SC_SCALES, scaleNotes: scaleNotes, spellScale: spellScale, scaleMidis: scaleMidis, scHeptatonic: scHeptatonic, noteName: noteName, noteWords: noteWords, midiToHz: midiToHz, isBlack: isBlack, pianoVoice: pianoVoice, pianoBus: pianoBus, PIANO_OSC_PER_NOTE: PIANO_OSC_PER_NOTE,
      CIRCLE_TONICS: CIRCLE_TONICS, ciPc: ciPc, ciMinorPc: ciMinorPc, ciTonic: ciTonic, ciScale: ciScale, ciSigned: ciSigned, ciSignature: ciSignature, ciName: ciName, ciWords: ciWords, ciMinorName: ciMinorName, ciMinorWords: ciMinorWords, ciKeyTitle: ciKeyTitle, ciKeyWords: ciKeyWords, ciMinorTitle: ciMinorTitle, ciMinorKeyWords: ciMinorKeyWords,
      ciCountText: ciCountText, ciCountWords: ciCountWords, ciNeighbours: ciNeighbours, ciOpposite: ciOpposite, ciSteps: ciSteps, ciShared: ciShared, ciSharedByPitch: ciSharedByPitch, ciChange: ciChange, ciChangeText: ciChangeText, ciChangeWords: ciChangeWords, ciSharedText: ciSharedText, ciRelations: ciRelations };
    return;
  }
  // ---- the page ---------------------------------------------------------------------------------------------------------------------------------------
  var schedule = function (fn, ms) { return (window.__schedule || setTimeout)(fn, ms); };                 // an injected scheduler for tests; the page's own is setTimeout
  var cur = 0, curAlt = false, lastChange = null, timers = [], soundingForm = null;
@@SCALE_VIEW@@
@@CIRCLE_STAFF@@
@@CIRCLE_WHEEL@@
  var segs = buildWheel($("wheel"), { counts: true, onPick: function (ring, k) { choose(k, k === 6 && k === cur ? !curAlt : false, null); } });
  Object.keys(segs).forEach(function (r) { segs[r].forEach(function (g, k) { g.setAttribute("aria-label", r === "major" ? ciKeyWords(k, false) + (k === 6 ? " or " + ciKeyWords(6, true) : "") + ", " + ciCountWords(k, false) + (k === 6 ? " or " + ciCountWords(6, true) : "") : ciMinorKeyWords(k, false) + (k === 6 ? " or " + ciMinorKeyWords(6, true) : "") + ", the relative minor of " + ciKeyWords(k, false)); }); });
  function midisOf() { return scaleMidis(ciPc(cur), "major", "up", BASE); }
  function render(announce) {
    var nb = ciNeighbours(cur), op = ciOpposite(cur), r, k, g;
    for (r in segs) for (k = 0; k < 12; k++) { g = segs[r][k]; g.setAttribute("class", "seg " + r + (k === cur ? " lit" : "") + (k === nb[0] || k === nb[1] ? " nb" : "") + (k === op ? " opp" : "")); }
    var both = cur === 6 ? ciKeyTitle(6, !curAlt) : "";
    $("title").textContent = ciKeyTitle(cur, curAlt) + (both ? " (the same keys as " + both + ")" : "") + ", relative minor " + ciMinorTitle(cur, curAlt) + ": " + ciCountWords(cur, curAlt) + ".";
    ciDrawSignature(cur, curAlt);
    var midis = midisOf(), kk, gk;
    for (kk in keys) { gk = keys[kk]; gk.setAttribute("class", "key " + (isBlack(+kk) ? "black" : "white")); }
    midis.forEach(function (mm, idx) { if (keys[mm]) keys[mm].classList.add("lit"); if ((idx === 0 || idx === midis.length - 1) && keys[mm]) keys[mm].classList.add("tonic"); });
    if (soundingIndex >= 0 && keys[midis[soundingIndex]]) keys[midis[soundingIndex]].classList.add("sounding");
    $("change").textContent = lastChange ? ciChangeText(lastChange) : "Choose a key on the wheel, or step round the circle with Clockwise and Counter-clockwise.";
    var rel = ciRelations(cur, curAlt);
    $("detail").textContent = "Neighbours: " + ciKeyTitle(rel[0].sector, rel[0].alt) + " and " + ciKeyTitle(rel[1].sector, rel[1].alt) + " share " + rel[0].shared + " of their 7 notes with " + ciKeyTitle(cur, curAlt) + ". Opposite: " + (rel[2].sector === 6 ? ciName(6, false) + "/" + ciName(6, true) + " major" : ciKeyTitle(rel[2].sector, rel[2].alt)) + " shares " + rel[2].shared + ".";
    if (announce !== undefined) $("sr").textContent = announce;
  }
  function choose(k, alt, change) { stopTimers(); cur = ciSector(k); curAlt = cur === 6 ? alt : false; lastChange = change; render(ciKeyWords(cur, curAlt) + ", " + ciCountWords(cur, curAlt) + ". " + (change ? ciChangeWords(change) : "")); }
  function step(dir) { var c = ciChange(cur, dir); choose(c.to, c.toAlt, c); }
  // ---- sound: the piano voice (the block above, the same as the other gadgets) ------------------------------------------------------------------------------
  var ctx = null;
  function audio() { if (!ctx) { var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; ctx = new AC(); } if (ctx.state === "suspended") ctx.resume(); return ctx; }
  function stopTimers() { timers.forEach(function (t) { (window.__unschedule || clearTimeout)(t); }); timers = []; soundingIndex = -1; }
  function play() {
    var c = audio(), midis = midisOf(); stopTimers();
    if (c) { var t0 = c.currentTime + 0.02; midis.forEach(function (mm, idx) { pianoVoice(c, pianoBus(c), midiToHz(mm), t0 + idx * STEP_SECONDS, NOTE_LEN, 0.8, 1); }); }
    midis.forEach(function (mm, idx) { timers.push(schedule(function () { soundingIndex = idx; render(); }, Math.round(idx * STEP_SECONDS * 1000))); });
    timers.push(schedule(function () { soundingIndex = -1; render(); }, Math.round((midis.length - 1) * STEP_SECONDS * 1000 + NOTE_LEN * 1000)));
    $("sr").textContent = "Playing " + ciKeyWords(cur, curAlt) + ".";
  }
  $("cw").addEventListener("click", function () { step(1); });
  $("ccw").addEventListener("click", function () { step(-1); });
  $("play").addEventListener("click", function () { play(); });
  render();
})();
</script>
</body>
</html>
