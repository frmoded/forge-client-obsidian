@@HEAD@@
@@RING_CSS@@
  #bank { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin: 3px 0 0; min-height: 64px; align-content: start; }
  #bank button { padding: 4px 0; min-width: 0; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
<div id="prompt" aria-live="off"></div>
<div class="wheelbox"><svg id="wheel" role="group" aria-label="The circle of fifths: the major keys are on the outer ring; the inner ring has twelve slots for their relative minors"></svg></div>
<div id="bank" role="group" aria-label="The twelve minor keys: tap the one that goes in the lit slot"></div>
<div class="row"><button type="button" id="startover">Start over</button></div>
<span id="sr" class="sr" role="status" aria-live="polite"></span>
</div>
<script>
(function () {
  "use strict";
  // 2026-11-23-1025 - the CIRCLE EXERCISE "build the inner ring"; 2026-11-24-1038: ONE level, the only goal is to build the circle of fifths. The outer ring is complete and the inner slots are empty. The lit slot sits under a major key, starting under C; tap its relative minor from the
  // shuffled bank of the twelve minor keys (A minor under C, E minor under G, and so on). A wrong minor says in words how far below its major it is (a relative minor is three half steps below) and costs nothing: there is no limit and no way to give up. The exercise ends when the ring is built, and then
  // the twelve pairs are said in words. Start over clears the inner ring and shuffles the tiles again. It shares its blocks with the other circle gadgets, byte for byte (pinned by a test): the scale core, the circle core and the wheel; the ring core and the ring page are shared with the other
  // two ring exercises. Memory only; no sound.
  // ---- pure functions (no DOM; the node harness exports them) ------------------------------------------------------------------------------------------
  @@PRELUDE@@
@@SCALE_CORE@@
@@CIRCLE_CORE@@
@@RING_CORE@@
  // ==== inner ring core BEGIN (2026-11-23-1025, one level 2026-11-24-1038) ========================================================================
  // One exercise, pure. The slots are the twelve sectors clockwise from C (0 to 11); the tile of sector j is the relative minor of the major key of sector j (the one at six o'clock reads D-sharp/E-flat minor: either spelling is that tile), shuffled. A right tile is free; a wrong tile
  // says how far below the major it is and costs nothing; every slot filled = "done".
  function i2Start(rng) {
    var filled = [], ids = [], k;
    for (k = 0; k < 12; k++) { filled.push(false); ids.push(k); }
    return { filled: filled, bank: rgShuffle(ids, rng), wrong: [], note: "", phase: "playing" };
  }
  function i2Next(s) { var i; for (i = 0; i < 12; i++) if (!s.filled[i]) return i; return -1; }
  function i2Used(s, tile) { return s.filled[tile]; }
  function i2WrongWords(s, tile) {
    var c = i2Next(s), n = scMod(ciPc(c) - ciMinorPc(tile), 12);
    if (n === 0) return rgMinorTitle(tile) + " starts on the same note as " + rgMajorTitle(c) + ", not three half steps below it: a relative minor is three half steps below its major.";
    return rgMinorTitle(tile) + " is " + rgHalfSteps(n) + " below " + rgMajorTitle(c) + ", not three: a relative minor is three half steps below its major.";
  }
  function i2Tap(s, tile) {
    if (s.phase !== "playing" || i2Used(s, tile) || s.wrong.indexOf(tile) >= 0) return { state: s, event: "ignored" };
    var c = i2Next(s);
    if (tile === c) {
      var filled = s.filled.slice(); filled[c] = true; var ns = rgCopy(s, { filled: filled, wrong: [], note: "" }), done = i2Next(ns) < 0;
      return { state: rgCopy(ns, { phase: done ? "done" : "playing" }), event: done ? "built" : "right" };
    }
    return { state: rgCopy(s, { wrong: s.wrong.concat([tile]), note: i2WrongWords(s, tile) }), event: "wrong" };
  }
  function i2Answer() { var all = [], k; for (k = 0; k < 12; k++) all.push(rgMinorSlotName(k) + " under " + rgSlotName(k)); return "Each relative minor is three half steps below its major: " + all.join(", ") + "."; }
  function i2Prompt(s) {
    if (s.phase === "done") return "Exercise done. " + i2Answer();
    var c = i2Next(s);
    return "Exercise: build the inner ring. Tap the relative minor of " + rgMajorTitle(c) + ": it goes under " + rgSlotName(c) + "." + (s.note ? " " + s.note : "");
  }
  function i2Announce(s, event) {
    var start = "Build the inner ring. The outer ring is complete.";
    if (event === "start") return start;
    if (event === "again") return "Started over. " + start;
    if (event === "right") return "Right. Next: the relative minor of " + rgMajorTitle(i2Next(s)) + ".";
    if (event === "wrong") return "Not that one. " + s.note;
    if (event === "built") return "Done. " + i2Answer();
    return "";
  }
  // ==== inner ring core END =========================================================================================================================
  if (typeof document === "undefined") {           // node test harness
    module.exports = { BASE: BASE, SC_SCALES: SC_SCALES, scaleNotes: scaleNotes, spellScale: spellScale, scHeptatonic: scHeptatonic, noteName: noteName, noteWords: noteWords,
      CIRCLE_TONICS: CIRCLE_TONICS, ciPc: ciPc, ciMinorPc: ciMinorPc, ciTonic: ciTonic, ciScale: ciScale, ciSigned: ciSigned, ciSignature: ciSignature, ciName: ciName, ciKeyTitle: ciKeyTitle, ciKeyWords: ciKeyWords, ciMinorTitle: ciMinorTitle, ciMinorName: ciMinorName,
      rgShuffle: rgShuffle, rgUp: rgUp, rgIntervalWords: rgIntervalWords, rgSlotName: rgSlotName, rgMinorSlotName: rgMinorSlotName,
      i2Start: i2Start, i2Next: i2Next, i2Used: i2Used, i2Tap: i2Tap, i2Answer: i2Answer, i2Prompt: i2Prompt, i2Announce: i2Announce };
    return;
  }
  // ---- the page ---------------------------------------------------------------------------------------------------------------------------------------
  var rng = function () { return (window.__earRandom || Math.random)(); };                                   // an injected random source for tests
  var state = null;
  var NS = "http://www.w3.org/2000/svg";
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, attrs, parent) { var n = document.createElementNS(NS, tag); for (var a in attrs) n.setAttribute(a, attrs[a]); if (parent) parent.appendChild(n); return n; }
@@CIRCLE_WHEEL@@
@@RING_PAGE@@
  var segs = buildWheel($("wheel"), { counts: false, onPick: function () {} }); rgInert(segs); var labels = rgLabels(segs);
  function drawBank() {
    var bank = $("bank"); bank.textContent = "";
    state.bank.forEach(function (id) {
      var b = document.createElement("button"); b.type = "button"; b.id = "tile-" + id; b.textContent = rgMinorSlotName(id);
      b.setAttribute("aria-label", rgMinorTitle(id)); b.addEventListener("click", function () { apply(i2Tap(state, id)); }); bank.appendChild(b);
    });
  }
  function apply(r) { if (r.event === "ignored") return; state = r.state; render(i2Announce(state, r.event)); }
  function render(announce) {
    var done = state.phase === "done", next = i2Next(state), k;
    for (k = 0; k < 12; k++) {
      labels.name("minor", k, state.filled[k] ? "full" : "none");
      segs.major[k].setAttribute("class", "seg major" + (!done && k === next ? " tonic" : "")); segs.major[k].setAttribute("aria-label", ciKeyTitle(k, false));
      segs.minor[k].setAttribute("class", "seg minor" + (state.filled[k] ? " found" : " empty") + (!done && k === next ? " lit" : ""));
      segs.minor[k].setAttribute("aria-label", state.filled[k] ? ciMinorTitle(k, false) : "Empty slot" + (!done && k === next ? ", next" : ""));
    }
    state.bank.forEach(function (id) { var b = $("tile-" + id); b.disabled = done || i2Used(state, id); b.setAttribute("class", state.wrong.indexOf(id) >= 0 ? "wrongbtn" : ""); });
    $("prompt").textContent = i2Prompt(state);
    if (announce !== undefined) $("sr").textContent = announce;
  }
  function fresh(event) { state = i2Start(rng); drawBank(); render(event ? i2Announce(state, event) : undefined); }
  rgStartOver(function () { fresh("again"); });
  fresh();
})();
</script>
</body>
</html>
